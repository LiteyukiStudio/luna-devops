        hidden: true
        exclusionReason: Browser EventSource transport for the interactive message center.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Unbuffered SSE invalidation stream.
          headers:
            Cache-Control:
              schema: { type: string, const: "no-cache, no-store" }
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: inbox.changed\ndata: {\"unreadCount\":3,\"messageId\":\"imsg_example\"}\n\n"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Inbox stream initialization failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

