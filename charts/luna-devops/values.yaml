nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

app:
  env: production
  logLevel: info
  publicBaseUrl: http://localhost:8088
  corsOrigins: ""
  trustedProxyCidrs: ""
  secretEncryptionKey: ""
  existingSecret: ""
  secretEncryptionKeyKey: secret-encryption-key
  extraEnv: {}

api:
  replicaCount: 1
  image:
    repository: liteyukistudio/luna-devops
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

ai:
  enabled: false
  agentAddress: ""
  agentTimeout: 10s
  existingSecret: ""
  apiServicePrivateKeyKey: ai-api-service-private-key
  actorContextPrivateKeyKey: ai-actor-context-private-key
  apiServicePublicKeyKey: ai-api-service-public-key
  actorContextPublicKeyKey: ai-actor-context-public-key
  runGrantEncryptionKeyKey: ai-run-grant-encryption-key
  runActorGrantSigningKeyKey: ai-run-actor-grant-signing-key
  delegationTokenSigningKeyKey: ai-delegation-token-signing-key
  agentCallbackServiceTokenKey: ai-agent-callback-service-token
  agent:
    replicaCount: 2
    image:
      repository: liteyukistudio/luna-agent
      tag: ""
      pullPolicy: IfNotPresent
    service:
      port: 8091
    authMode: jwt
    providerType: deterministic
    providerBaseUrl: ""
    providerModel: ""
    providerApiKeyKey: ai-provider-api-key
    toolCatalogJson: >-
      [{"operationId":"getDashboard","method":"GET","path":"/api/v1/dashboard","category":"platform","risk":"read","requiredScopes":["dashboard:read"],"approval":"never","idempotent":true,"timeoutMs":10000,"inputSchema":{"type":"object","properties":{},"required":[],"additionalProperties":false}},{"operationId":"listPlatformEvents","method":"GET","path":"/api/v1/events","category":"diagnostics","risk":"read","requiredScopes":["event:read"],"approval":"never","idempotent":true,"timeoutMs":10000,"inputSchema":{"type":"object","properties":{"projectId":{"type":"string","maxLength":64},"pageSize":{"type":"integer","maximum":100}},"required":["projectId"],"additionalProperties":false},"maxItems":100},{"operationId":"getProject","method":"GET","path":"/api/v1/projects/{projectId}","category":"project","risk":"read","requiredScopes":["project:read"],"approval":"never","idempotent":true,"timeoutMs":10000,"inputSchema":{"type":"object","properties":{"projectId":{"type":"string","maxLength":64}},"required":["projectId"],"additionalProperties":false}},{"operationId":"listApplications","method":"GET","path":"/api/v1/applications","category":"diagnostics","risk":"read","requiredScopes":["application:read"],"approval":"never","idempotent":true,"timeoutMs":10000,"inputSchema":{"type":"object","properties":{"projectId":{"type":"string","maxLength":64},"pageSize":{"type":"integer","maximum":100}},"required":["projectId"],"additionalProperties":false},"maxItems":100},{"operationId":"listBuildRuns","method":"GET","path":"/api/v1/build-runs","category":"diagnostics","risk":"read","requiredScopes":["build:read"],"approval":"never","idempotent":true,"timeoutMs":10000,"inputSchema":{"type":"object","properties":{"projectId":{"type":"string","maxLength":64},"pageSize":{"type":"integer","maximum":100}},"required":["projectId"],"additionalProperties":false},"maxItems":100},{"operationId":"listReleases","method":"GET","path":"/api/v1/releases","category":"diagnostics","risk":"read","requiredScopes":["deployment:read"],"approval":"never","idempotent":true,"timeoutMs":10000,"inputSchema":{"type":"object","properties":{"projectId":{"type":"string","maxLength":64},"pageSize":{"type":"integer","maximum":100}},"required":["projectId"],"additionalProperties":false},"maxItems":100},{"operationId":"listRuntimeClusters","method":"GET","path":"/api/v1/runtime-clusters","category":"diagnostics","risk":"read","requiredScopes":["cluster:read"],"approval":"never","idempotent":true,"timeoutMs":10000,"inputSchema":{"type":"object","properties":{"projectId":{"type":"string","maxLength":64},"pageSize":{"type":"integer","maximum":100}},"required":["projectId"],"additionalProperties":false},"maxItems":100}]
    toolCatalogExtensionsJson: >-
      [{"operationId":"listGatewayRoutes","method":"GET","path":"/api/v1/gateway-routes","category":"diagnostics","risk":"read","requiredScopes":["gateway:read"],"approval":"never","idempotent":true,"timeoutMs":10000,"inputSchema":{"type":"object","properties":{"projectId":{"type":"string","maxLength":64}},"required":["projectId"],"additionalProperties":false},"maxItems":20},{"operationId":"listGatewayCertificates","method":"GET","path":"/api/v1/gateway-certificates","category":"diagnostics","risk":"read","requiredScopes":["gateway:read"],"approval":"never","idempotent":true,"timeoutMs":10000,"inputSchema":{"type":"object","properties":{"projectId":{"type":"string","maxLength":64}},"required":["projectId"],"additionalProperties":false},"maxItems":20},{"operationId":"listProjectHookRuns","method":"GET","path":"/api/v1/project-hook-runs","category":"diagnostics","risk":"read","requiredScopes":["project:read"],"approval":"never","idempotent":true,"timeoutMs":10000,"inputSchema":{"type":"object","properties":{"projectId":{"type":"string","maxLength":64}},"required":["projectId"],"additionalProperties":false},"maxItems":20},{"operationId":"listNotificationDeliveries","method":"GET","path":"/api/v1/notification-deliveries","category":"diagnostics","risk":"read","requiredScopes":["event:read"],"approval":"never","idempotent":true,"timeoutMs":10000,"inputSchema":{"type":"object","properties":{"projectId":{"type":"string","maxLength":64}},"required":["projectId"],"additionalProperties":false},"maxItems":20},{"operationId":"listRuntimeEvents","method":"GET","path":"/api/v1/runtime-events","category":"diagnostics","risk":"read","requiredScopes":["event:read"],"approval":"never","idempotent":true,"timeoutMs":10000,"inputSchema":{"type":"object","properties":{"projectId":{"type":"string","maxLength":64}},"required":["projectId"],"additionalProperties":false},"maxItems":20}]
    runLeaseSeconds: 30
    runPollMs: 500
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    podLabels: {}
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    networkPolicy:
      enabled: true

metrics:
  enabled: false
  path: /metrics
  service:
    enabled: false
    annotations: {}
    labels: {}
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  api:
    addr: ":9090"
    port: 9090
  worker:
    addr: ":9091"
    port: 9091
  agent:
    port: 9092

worker:
  replicaCount: 1
  image:
    repository: liteyukistudio/luna-worker
    tag: ""
    pullPolicy: IfNotPresent
  deployRolloutTimeoutSeconds: 600
  certManagerClusterIssuer: letsencrypt-http01
  buildExecutorImage: moby/buildkit:v0.24.0-rootless
  buildEgressMode: permissive
  buildJobTimeoutSeconds: 1800
  buildJobTtlSeconds: 3600
  buildCacheEnabled: false
  buildCacheTag: buildcache
  buildNpmRegistry: ""
  buildPrivateEgressCidrs: ""
  buildPrivateEgressPorts: "443"
  buildBlockedEgressCidrs: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  auth:
    database: devops
    username: devops
    password: ""
    existingSecret: ""
    passwordKey: postgres-password
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

externalDatabase:
  url: ""
  existingSecret: ""
  urlKey: database-url

redis:
  enabled: true
  image:
    repository: redis
    tag: 8-alpine
    pullPolicy: IfNotPresent
  auth:
    existingSecret: ""
    urlKey: redis-url
    passwordKey: redis-password
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

externalRedis:
  url: ""
  existingSecret: ""
  urlKey: redis-url

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: devops.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext: {}

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
