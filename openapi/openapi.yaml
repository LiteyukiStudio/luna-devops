  /api/v1/projects/{projectId}/volumes:
    get:
      operationId: listProjectVolumes
      tags: [Volumes]
      summary: List project-space volumes with current Kubernetes observations
      description: Returns only the requested page. Current state is observed from Kubernetes and is never served from a persisted status cache.
      x-luna-cli:
        command: volume.list
        classification: business-command
        risk: low
        requiredScopes: [volume:read]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: availability, in: query, schema: { $ref: "#/components/schemas/ProjectVolumeAvailability" } }
        - { name: lifecycleState, in: query, schema: { $ref: "#/components/schemas/ProjectVolumeLifecycleState" } }
        - { name: clusterId, in: query, schema: { type: string } }
        - { name: sourceKind, in: query, schema: { $ref: "#/components/schemas/ProjectVolumeSourceKind" } }
        - { name: ownershipMode, in: query, schema: { $ref: "#/components/schemas/ProjectVolumeOwnershipMode" } }
        - { name: volumeMode, in: query, schema: { $ref: "#/components/schemas/ProjectVolumeMode" } }
        - { name: sortBy, in: query, schema: { type: string, enum: [createdAt, updatedAt, displayName, capacity], default: createdAt } }
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Paginated project volume list. This response is not cacheable.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedProjectVolumes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createProjectVolume
      tags: [Volumes]
      summary: Create a blank volume, reference or adopt a claim, or restore a snapshot
      description: Existing-claim adoption is checked against live Pod references and existing Luna ownership. The endpoint never supports a force bypass.
      x-luna-cli:
        command: volume.create
        classification: business-command
        risk: high
        requiredScopes: [volume:write]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectVolumeCreateInput" }
      responses:
        "202":
          description: Volume provisioning was accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectVolume" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: Snapshot or volume specification is unsupported, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: Runtime cluster is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/projects/{projectId}/volume-storage-classes:
    get:
      operationId: listProjectVolumeStorageClasses
      tags: [Volumes]
      summary: List storage classes and volume capabilities from a runtime cluster
      x-luna-cli:
        command: volume.storage-classes
        classification: business-command
        risk: low
        requiredScopes: [volume:read]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: clusterId
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: sortBy, in: query, schema: { type: string, enum: [name, provisioner], default: name } }
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Paginated live storage class capabilities. This response is not cacheable.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedProjectVolumeStorageClasses" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { description: Runtime cluster is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/projects/{projectId}/volumes/{volumeId}:
    get:
      operationId: getProjectVolume
      tags: [Volumes]
      summary: Get a project volume, bindings, recent transfers, and current observation
      x-luna-cli:
        command: volume.get
        classification: business-command
        risk: low
        requiredScopes: [volume:read]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/VolumeId"
        - { name: bindingPage, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: bindingPageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: transferPage, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: transferPageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Project volume detail. This response is not cacheable.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectVolumeDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProjectVolume
      tags: [Volumes]
      summary: Rename or expand a project volume
      x-luna-cli:
        command: volume.update
        classification: business-command
        risk: high
        requiredScopes: [volume:write]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/VolumeId"
        - name: If-Match
          in: header
          required: true
          x-luna-agent-input-name: revision
          description: Current numeric volume revision.
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectVolumeUpdateInput" }
      responses:
        "200":
          description: Updated volume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectVolume" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteProjectVolume
      tags: [Volumes]
      summary: Queue managed claim deletion or detach a referenced claim
      x-luna-cli:
        command: volume.delete
        classification: business-command
        risk: critical
        requiredScopes: [volume:delete]
        mfaPurpose: volume_delete
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/VolumeId"
        - name: dataAction
          in: query
          required: true
          schema: { type: string, enum: [delete, detach] }
        - name: If-Match
          in: header
          required: true
          x-luna-agent-input-name: revision
          description: Current numeric volume revision.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "202":
          description: Deletion or detachment was accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectVolume" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/projects/{projectId}/volumes/{volumeId}/retry:
    post:
      operationId: retryProjectVolumeOperation
      tags: [Volumes]
      summary: Retry the most recent failed project volume operation
      x-luna-cli:
        command: volume.retry
        classification: business-command
        risk: high
        requiredScopes: [volume:read]
        agentAllowed: false
        exclusionReason: Retrying must first read the failed operation and dynamically re-authorize its original action and step-up purpose; generic Agent delegation cannot express that policy safely.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/VolumeId"
        - name: If-Match
          in: header
          required: true
          x-luna-agent-input-name: revision
          description: Current numeric volume revision.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "202":
          description: Retry was queued after rechecking the original operation permission.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectVolume" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/projects/{projectId}/volumes/{volumeId}/deletion-preview:
    post:
      operationId: previewProjectVolumeDeletion
      tags: [Volumes]
      summary: Preview active bindings, transfers, and underlying storage deletion impact
      x-luna-cli:
        command: volume.delete-preview
        classification: business-command
        risk: high
        requiredScopes: [volume:delete]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/VolumeId"
      responses:
        "200":
          description: Current deletion impact preview. This response is not cacheable.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectVolumeDeletionPreview" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Runtime cluster is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/projects/{projectId}/volume-imports:
    post:
      operationId: createVolumeImport
      tags: [Volumes]
      summary: Create a resumable archive import session and provisioning volume
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        transport: upload
        risk: high
        mfaPurpose: volume_import
        exclusionReason: Local archive selection and resumable byte upload are handled by Web or Luna CLI protocol adapters.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolumeImportCreateInput" }
      responses:
        "202":
          description: Import upload session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeImportCreateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { description: Transfer store or runtime cluster is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/projects/{projectId}/volume-imports/{transferId}/content:
    head:
      operationId: getVolumeImportUploadOffset
      tags: [Volumes]
      summary: Read the authoritative resumable upload offset
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        transport: upload
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TransferId"
        - $ref: "#/components/parameters/TusResumable"
      responses:
        "200":
          description: Current upload offset.
          headers:
            Tus-Resumable: { schema: { type: string, const: 1.0.0 } }
            Upload-Offset: { schema: { type: integer, format: int64, minimum: 0 } }
            Upload-Length: { schema: { type: integer, format: int64, minimum: 0 } }
            Upload-Chunk-Size: { schema: { type: integer, format: int64, minimum: 67108864, maximum: 5368709120 } }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { description: Transfer expired, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    patch:
      operationId: uploadVolumeImportContent
      tags: [Volumes]
      summary: Stream one checksum-protected TUS upload chunk
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        transport: upload
        streaming: true
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TransferId"
        - $ref: "#/components/parameters/TusResumable"
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: Upload-Checksum
          in: header
          required: true
          schema: { type: string, pattern: '^sha256 [A-Za-z0-9+/]+={0,2}$' }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary, maxLength: 5368709120 }
      responses:
        "204":
          description: Chunk persisted and offset advanced.
          headers:
            Tus-Resumable: { schema: { type: string, const: 1.0.0 } }
            Upload-Offset: { schema: { type: integer, format: int64, minimum: 0 } }
            Upload-Chunk-Size: { schema: { type: integer, format: int64, minimum: 67108864, maximum: 5368709120 } }
        "409":
          description: Upload offset mismatch, content conflict, or an identical part is still being persisted. `volume_transfer.part_in_progress` includes a bounded Retry-After value.
          headers:
            Upload-Offset: { schema: { type: integer, format: int64, minimum: 0 } }
            Upload-Chunk-Size: { schema: { type: integer, format: int64, minimum: 67108864, maximum: 5368709120 } }
            Retry-After: { schema: { type: integer, minimum: 1, maximum: 5 }, description: Present for `volume_transfer.part_in_progress`; clients wait, then HEAD the authoritative offset before a bounded retry. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410": { description: Transfer expired, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "413": { description: Chunk exceeds the S3 multipart part-size limit, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "429": { description: API spool byte budget is busy, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "460": { description: Chunk checksum mismatch, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: API spool directory or capacity observation is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "507": { description: API spool disk has insufficient free space, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/projects/{projectId}/volume-imports/{transferId}/complete:
