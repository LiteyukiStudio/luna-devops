nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

app:
  env: production
  logFormat: json
  logColor: never
  logLevel: info
  publicBaseUrl: http://localhost:8088
  corsOrigins: ""
  trustedProxyCidrs: ""
  secretEncryptionKey: ""
  existingSecret: ""
  secretEncryptionKeyKey: secret-encryption-key
  extraEnv: {}

api:
  replicaCount: 1
  image:
    repository: liteyukistudio/luna-devops
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

ai:
  enabled: false
  agentAddress: ""
  agentTimeout: 10s
  existingSecret: ""
  internalSecretKey: ai-internal-secret
  agent:
    # High-sensitivity diagnostics. Exports redacted model and tool content.
    observabilityCaptureContent: false
    database:
      maxConnections: 10
      connectionTimeoutMs: 5000
      statementTimeoutMs: 15000
    image:
      repository: liteyukistudio/luna-agent
      tag: ""
      pullPolicy: IfNotPresent
    service:
      port: 8091
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    podLabels: {}
    networkPolicy:
      ingress:
        enabled: true
      egress:
        # Kubernetes NetworkPolicy accepts IP blocks and selectors, not dynamic FQDNs.
        # Enable only after every Provider, OTLP, and database destination is allowed.
        enabled: false
        additionalCIDRs: []
        additionalRules: []

metrics:
  enabled: false
  path: /metrics
  service:
    enabled: false
    annotations: {}
    labels: {}
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  api:
    addr: ":9090"
    port: 9090

observability:
  # Empty keeps OpenTelemetry exporters disabled.
  otlpEndpoint: ""
  resourceAttributes: "deployment.environment.name=production"
  # Optional Secret containing an OTEL_EXPORTER_OTLP_HEADERS value.
  existingSecret: ""
  headersKey: otlp-headers

worker:
  replicaCount: 1
  image:
    repository: liteyukistudio/luna-worker
    tag: ""
    pullPolicy: IfNotPresent
  deployRolloutTimeoutSeconds: 600
  certManagerClusterIssuer: letsencrypt-http01
  buildExecutorImage: moby/buildkit:v0.24.0-rootless
  buildEgressMode: restricted
  buildJobTimeoutSeconds: 1800
  buildJobTtlSeconds: 3600
  buildCacheEnabled: false
  buildCacheTag: buildcache
  buildPrivateEgressCidrs: ""
  buildPrivateEgressPorts: "443"
  buildBlockedEgressCidrs: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

# Project-volume imports and exports stream through an ephemeral workload in the
# runtime cluster. No object store or long-lived transfer credential is needed.
volumeTransfer:
  maxBytes: 100Gi
  # Empty uses the Worker image and tag from this release.
  jobImage: ""

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  auth:
    database: devops
    username: devops
    password: ""
    existingSecret: ""
    passwordKey: postgres-password
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

externalDatabase:
  url: ""
  existingSecret: ""
  urlKey: database-url

redis:
  enabled: true
  image:
    repository: redis
    tag: 8-alpine
    pullPolicy: IfNotPresent
  auth:
    existingSecret: ""
    urlKey: redis-url
    passwordKey: redis-password
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

externalRedis:
  url: ""
  existingSecret: ""
  urlKey: redis-url

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: devops.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext: {}

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
