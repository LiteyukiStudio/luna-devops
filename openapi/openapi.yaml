        updatedAt: { type: string, format: date-time }
    InboxMessage:
      type: object
      additionalProperties: false
      required: [id, type, category, priority, actorId, projectId, resourceType, resourceId, titleKey, contentKey, params, actionRequestId, deepLink, groupKey, readAt, expiresAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        type: { type: string }
        category:
          $ref: "#/components/schemas/InboxCategory"
        priority:
          $ref: "#/components/schemas/InboxPriority"
        actorId: { type: string }
        projectId: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        titleKey: { type: string }
        contentKey: { type: string }
