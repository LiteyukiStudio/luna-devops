      properties:
        id: { type: string }
        name: { type: string }
        identifier: { type: string }
        kubernetesNamespace: { type: string }
        description: { type: string }
        namespaceStrategy: { type: string, enum: [project] }
        maxConcurrentBuilds: { type: integer }
        webConsoleEnabled:
          type: boolean
          description: Project-space master switch. A false value disables Web Console for every deployment target in the project space.
        currentUserRole:
          allOf:
            - $ref: "#/components/schemas/ProjectRole"
          description: Role of the current authenticated user in this project space. Omitted for platform administrators.
        createdAt: { type: string, format: date-time }
      required: [id, name, identifier, kubernetesNamespace, namespaceStrategy, maxConcurrentBuilds, webConsoleEnabled, createdAt]
