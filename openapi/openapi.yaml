components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: lyd_session
      description: HttpOnly browser session cookie. Sensitive interactive operations do not accept personal access tokens as a substitute.
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: Luna personal access token

  parameters:
    BuildEnvironmentScope:
      name: scope
      in: query
      required: true
      schema: { type: string, enum: [global, application, deployment] }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string }
    BindingId:
      name: bindingId
      in: path
      required: true
      schema: { type: string }
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema: { type: string }
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: { type: string }
    IdentityId:
      name: identityId
      in: path
      required: true
      schema: { type: string }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string }
    OAuthCode:
      name: code
      in: query
      required: true
      schema: { type: string }
    OAuthState:
      name: state
      in: query
      required: true
      schema: { type: string }
    Owner:
      name: owner
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string }
    RegistryId:
      name: registryId
      in: path
      required: true
      schema: { type: string }
    Repo:
      name: repo
      in: path
      required: true
      schema: { type: string }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: string }
    SortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    TargetId:
      name: targetId
      in: path
      required: true
      schema: { type: string }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: The request is invalid or cannot be processed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated principal is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        error:
          type: string
          description: Safe user-facing error message.
        detail:
          type: string
          description: Development-only diagnostic detail.
        purpose:
          type: string
          description: Step-up purpose returned with `mfa_required`.
      required: [code, error]
    OAuthApplication:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        clientId: { type: string }
        redirectUris:
          type: array
          items: { type: string, format: uri }
        scopes:
          type: array
          items: { type: string }
        confidential: { type: boolean }
        active: { type: boolean }
      required: [id, name, clientId, redirectUris, scopes, confidential, active]
    OAuthTokenResponse:
      type: object
      properties:
        access_token: { type: string, writeOnly: true }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, minimum: 1 }
        refresh_token: { type: string, writeOnly: true }
        scope: { type: string }
      required: [access_token, token_type, expires_in, refresh_token, scope]
    OAuthProtocolError:
      type: object
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - authorization_pending
            - slow_down
            - access_denied
            - expired_token
        error_description: { type: string }
      required: [error]
    DashboardEntityRef:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        identifier: { type: string }
      required: [id, name, identifier]
    DashboardActivity:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        category: { type: string }
        severity: { type: string }
        status: { type: string }
        message: { type: string }
        project: { $ref: "#/components/schemas/DashboardEntityRef" }
        application: { $ref: "#/components/schemas/DashboardEntityRef" }
        deploymentTarget: { $ref: "#/components/schemas/DashboardEntityRef" }
        resourceType: { type: string }
        resourceId: { type: string }
        links:
          type: object
          additionalProperties: { type: string }
        occurredAt: { type: string, format: date-time }
      required: [id, type, category, severity, status, message, resourceType, resourceId, links, occurredAt]
    DashboardProjectShortcut:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        identifier: { type: string }
        description: { type: string }
        pinned: { type: boolean }
        applicationCount: { type: integer, format: int64 }
        latestActivity:
          oneOf:
            - $ref: "#/components/schemas/DashboardActivity"
            - type: "null"
      required: [id, name, identifier, description, pinned, applicationCount, latestActivity]
    DashboardAttentionItem:
      type: object
      properties:
        key: { type: string }
        category: { type: string }
        severity: { type: string }
        occurrences: { type: integer, minimum: 1 }
        latest: { $ref: "#/components/schemas/DashboardActivity" }
      required: [key, category, severity, occurrences, latest]
    DashboardReadinessItem:
      type: object
      properties:
        status: { type: string, enum: [ready, degraded, unavailable, available, missing] }
        available: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
      required: [status, available, total]
    DashboardOverview:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        summary:
          type: object
          properties:
            projects: { type: integer, format: int64, minimum: 0 }
            applications: { type: integer, format: int64, minimum: 0 }
            activeBuilds: { type: integer, format: int64, minimum: 0 }
            activeReleases: { type: integer, format: int64, minimum: 0 }
            attentionItems: { type: integer, minimum: 0 }
            healthyClusters: { type: integer, minimum: 0 }
            totalClusters: { type: integer, minimum: 0 }
          required: [projects, applications, activeBuilds, activeReleases, attentionItems, healthyClusters, totalClusters]
        projects:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/DashboardProjectShortcut" }
        attention:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/DashboardAttentionItem" }
        activities:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/DashboardActivity" }
        readiness:
          type: object
          properties:
            clusters: { $ref: "#/components/schemas/DashboardReadinessItem" }
            registries: { $ref: "#/components/schemas/DashboardReadinessItem" }
          required: [clusters, registries]
      required: [generatedAt, summary, projects, attention, activities, readiness]
    AuthSessionResponse:
      type: object
      properties:
        user:
          type: object
          additionalProperties: true
      required: [user]
    BootstrapStatus:
      type: object
      properties:
        mode:
          type: string
          enum: [development, production]
          description: Production initialization requires the API process to have `BOOTSTRAP_TOKEN` configured and the same value supplied as `bootstrapToken`.
        initialized: { type: boolean }
        devLoginEnabled: { type: boolean }
        devLoginHint:
          type: object
          description: Present only in development mode.
          properties:
            email: { type: string, format: email }
            password: { type: string }
          required: [email, password]
      required: [mode, initialized, devLoginEnabled]
    ConfigDefinition:
      type: object
      properties:
        key: { type: string }
        labelKey:
          type: string
          description: Stable frontend i18n key for the setting label; the backend does not localize labels.
        descriptionKey:
          type: string
          description: Stable frontend i18n key for the setting description; the backend does not localize descriptions.
        type: { type: string, enum: [string, textarea, select, boolean, number] }
        public: { type: boolean }
        default: { type: string }
        options:
          type: array
          items: { type: string }
      required: [key, labelKey, descriptionKey, type, public, default]
    MFAStatus:
      type: object
      properties:
        enabled: { type: boolean }
        pending: { type: boolean }
        policyEnabled: { type: boolean }
        enrollmentReauthMode:
          type: string
          enum: [password, fresh_session]
          description: Primary reauthentication required before starting enrollment. Local accounts use `password`; OIDC accounts require fresh non-impersonated primary authentication, which remember-token recovery cannot refresh.
        confirmedAt:
          type: [string, "null"]
          format: date-time
        recoveryCodesRemaining: { type: integer, minimum: 0 }
      required: [enabled, pending, policyEnabled, enrollmentReauthMode, confirmedAt, recoveryCodesRemaining]
    MFAEnrollmentInput:
      type: object
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
          description: Required for local accounts and ignored for OIDC accounts.
    DataExportAuthorization:
      type: object
      properties:
        ticket:
          type: string
          description: Random one-time ticket. The backend stores only its hash in production.
        expiresAt:
          type: string
          format: date-time
      required: [ticket, expiresAt]
    RuntimeTerminalAuthorization:
      type: object
      properties:
        ticket:
          type: string
          description: Random short-lived one-time terminal ticket. Only its hash is stored by the backend.
        expiresAt:
          type: string
          format: date-time
      required: [ticket, expiresAt]
    MFAEnrollment:
      type: object
      properties:
        secret:
          type: string
          description: Base32 TOTP secret returned only while enrolling.
        otpauthUrl: { type: string, format: uri }
        qrCodeDataUrl:
          type: string
          description: PNG data URL for the enrollment QR code.
      required: [secret, otpauthUrl, qrCodeDataUrl]
    MFAConfirmInput:
      type: object
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
      required: [code]
    MFARecoveryCodes:
      type: object
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: "^[A-Z2-7]{4}(?:-[A-Z2-7]{4}){3}$"
      required: [recoveryCodes]
    MFAConfirmResult:
      allOf:
        - $ref: "#/components/schemas/MFARecoveryCodes"
        - type: object
          properties:
            enabled: { type: boolean, const: true }
          required: [enabled]
    MFAPurpose:
      type: string
      enum:
        - runtime_exec
        - runtime_terminal
        - data_export
        - secret_update
        - registry_credential_update
        - kubeconfig_update
        - auth_provider_update
        - user_admin_update
        - mfa_manage
        - security_settings_update
        - data_retention_cleanup
        - password_update
        - access_token_manage
    MFAVerifyInput:
      type: object
      properties:
        purpose: { $ref: "#/components/schemas/MFAPurpose" }
        code: { type: string, pattern: "^[0-9]{6}$" }
        recoveryCode:
          type: string
          description: One-time recovery code. Hyphens and case are normalized before verification.
      required: [purpose]
      oneOf:
        - required: [code]
          not: { required: [recoveryCode] }
        - required: [recoveryCode]
          not: { required: [code] }
    MFAVerifyResult:
      type: object
      properties:
        verified: { type: boolean, const: true }
        purpose: { $ref: "#/components/schemas/MFAPurpose" }
      required: [verified, purpose]
    AccessTokenInput:
      type: object
      properties:
        name: { type: string }
        scope:
          type: string
          description: "Comma-separated scopes. Wildcard and unknown scopes are rejected. Normal users can create read scopes only."
        expiresInDays: { type: integer, enum: [0, 7, 15, 30, 90], description: "0 means never expires." }
      required: [name, scope]
    AccessTokenScopeDefinition:
      type: object
      properties:
        value: { type: string }
        group: { type: string }
        recommended: { type: boolean }
        creatableByUser: { type: boolean }
        requiresAdminRole: { type: boolean }
      required: [value, group, recommended, creatableByUser, requiresAdminRole]
    ApplicationTopology:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        targets:
          type: array
          items: { $ref: "#/components/schemas/ApplicationTopologyTarget" }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/ApplicationTopologyNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/ApplicationTopologyEdge" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ApplicationTopologyWarning" }
      required: [generatedAt, targets, nodes, edges, warnings]
    ApplicationTopologyTarget:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        stage: { type: string }
        clusterId: { type: string }
        clusterName: { type: string }
        namespace: { type: string }
      required: [id, name, stage, clusterId, clusterName, namespace]
    ApplicationTopologyNode:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        namespace: { type: string }
        status: { type: string }
        summary: { type: string }
        clusterId: { type: string }
        clusterName: { type: string }
        deploymentTargetId: { type: string }
      required: [id, kind, name, namespace, status, summary, clusterId, clusterName, deploymentTargetId]
    ApplicationTopologyEdge:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        type:
          type: string
          enum: [owns, selects, scales, configures, mounts, accepts, routes]
      required: [id, source, target, type]
    ApplicationTopologyWarning:
      type: object
      properties:
        code:
          type: string
          enum: [cluster_kubeconfig_missing, cluster_kubeconfig_unavailable, cluster_client_failed, topology_read_failed]
        deploymentTargetId: { type: string }
        deploymentTargetName: { type: string }
        clusterId: { type: string }
        clusterName: { type: string }
      required: [code, deploymentTargetId, deploymentTargetName, clusterId, clusterName]
    ApplicationInput:
      type: object
      properties:
        name: { type: string }
        identifier:
          type: string
          minLength: 2
          maxLength: 22
          pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
          description: Immutable application identifier, unique within its project space and used to derive stable resource IDs.
        sourceType: { type: string, enum: [repository, image] }
        repositoryUrl: { type: string }
        imageReference: { type: string }
        dockerfilePath: { type: string }
        buildContext: { type: string }
        servicePort: { type: integer }
      required: [name, identifier, sourceType]
    ArtifactRegistryInput:
      type: object
      properties:
        name: { type: string }
        provider: { type: string, enum: [harbor, dockerhub, gitea-registry] }
        endpoint: { type: string }
        namespace: { type: string }
        scope: { type: string, enum: [global, project, user] }
        ownerRef: { type: string }
        isDefault: { type: boolean }
        capabilities: { type: array, items: { type: string } }
      required: [name, provider, endpoint, scope]
    AuthAdmissionPolicyInput:
      type: object
      properties:
        allowLocalLogin: { type: boolean }
        allowOidcLogin: { type: boolean }
        allowedEmailDomains: { type: array, items: { type: string } }
        allowedOidcGroups: { type: array, items: { type: string } }
        invitedEmails: { type: array, items: { type: string } }
        defaultRole: { type: string, enum: [platform_admin, user] }
    AuthProviderInput:
      type: object
      properties:
        type: { type: string, enum: [oidc] }
        name: { type: string }
        enabled: { type: boolean }
        issuerUrl: { type: string }
        clientId: { type: string }
        clientSecret: { type: string }
        scopes: { type: string }
        groupClaim: { type: string }
        emailClaim: { type: string }
        usernameClaim: { type: string }
        isDefault: { type: boolean }
      required: [name, issuerUrl, clientId]
    ConfigKeysInput:
      type: object
      properties:
        keys:
          type: array
          items: { type: string }
      required: [keys]
    ContainerImageInput:
      type: object
      properties:
        projectId: { type: string }
        applicationId: { type: string }
        registryId: { type: string }
        repository: { type: string }
        tag: { type: string }
        digest: { type: string }
        imageRef: { type: string }
        sourceCommit: { type: string }
        buildRunId: { type: string }
        sourceType: { type: string }
        scanStatus: { type: string }
      required: [registryId, repository, tag]
    ReleaseImageCandidate:
      type: object
      properties:
        key: { type: string }
        source: { type: string, enum: [registry, build, target] }
        label: { type: string }
        imageRef: { type: string }
        buildRunId: { type: string }
        tag: { type: string }
        digest: { type: string }
        sourceCommit: { type: string }
        createdAt: { type: string, format: date-time }
    ReleaseImageCandidates:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseImageCandidate"
        registryAvailable: { type: boolean }
        registryError: { type: string }
        fallbackUsed: { type: boolean }
    GitAccountInput:
      type: object
      properties:
        providerId: { type: string }
        scope: { type: string, enum: [global, project, user] }
        ownerRef: { type: string }
        externalUserId: { type: string }
        username: { type: string }
