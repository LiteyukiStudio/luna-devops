apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "luna-devops.workerName" . }}
  labels:
    {{- include "luna-devops.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "luna-devops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "luna-devops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum.luna.devops/shared-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum.luna.devops/worker-config: {{ include (print $.Template.BasePath "/worker-configmap.yaml") . | sha256sum }}
        checksum.luna.devops/managed-secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "luna-devops.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ include "luna-devops.imageTag" (dict "Chart" .Chart "tag" .Values.worker.image.tag) }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "luna-devops.commonEnv" . | nindent 12 }}
            {{- include "luna-devops.extraEnv" (dict "component" "worker" "values" .Values.worker.extraEnv) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "luna-devops.sharedConfigName" . }}
            - configMapRef:
                name: {{ include "luna-devops.workerConfigName" . }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
