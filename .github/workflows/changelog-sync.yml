name: Changelog Sync

on:
  workflow_run:
    workflows:
      - Build & Publish Containers
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changelog-sync-main
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize release changelogs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Generate LiteyukiAutoBot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.LITEYUKI_AUTO_BOT_APP_ID }}
          private-key: ${{ secrets.LITEYUKI_AUTO_BOT_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: write

      - name: Resolve LiteyukiAutoBot user ID
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: echo "id=$(gh api "/users/${BOT_LOGIN}" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Check out main with release tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch immutable release tags
        run: git fetch --force --tags origin

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Generate the platform changelog
        run: scripts/generate-changelog.sh

      - name: Commit synchronized changelogs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          BOT_USER_ID: ${{ steps.bot-user.outputs.id }}
        run: |
          if git diff --quiet -- docs/docs/zh/changelog docs/docs/en/changelog; then
            echo "Changelogs are already synchronized."
            exit 0
          fi

          git config user.name "$BOT_LOGIN"
          git config user.email "${BOT_USER_ID}+${BOT_LOGIN}@users.noreply.github.com"
          git add docs/docs/zh/changelog docs/docs/en/changelog
          git commit -m "docs 📝: 同步发布更新日志"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              gh workflow run build-publish.yml --ref main
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Failed to synchronize changelogs after 3 attempts." >&2
          exit 1
