  /api/v1/runtime/clusters/{clusterId}/pods/terminal:
    get:
      operationId: streamRuntimeClusterPodTerminal
      tags:
        - Runtime
      summary: Stream Runtime Cluster Pod Terminal
      description: >-
        Opens the Pod terminal WebSocket and requires negotiation of the
        `luna.devops.terminal.v1` subprotocol before Upgrade. Luna CLI passes the
        short-lived one-time ticket returned by the
        authorize endpoint in the `ticket` query parameter; browser callers may omit
        it and continue using the existing session-cookie flow. Client binary frames
        are forwarded byte-for-byte to terminal stdin. Client text frames are reserved
        for `{"type":"resize","cols":N,"rows":N}` controls, where both dimensions
        are integers from 1 through 65535; other text frames close with WebSocket code
        1002. Server stdout is always binary. When the remote shell exits, the server
        sends `{"type":"exit","code":N}` as a text control before closing with code
        1000. Stream failures close with 1011, while expired or revoked authorization
        closes with 1008.
      x-luna-cli:
        requiredScopes: ["cluster:manage"]
        classification: protocol-adapter
        hidden: true
        exclusionReason: WebSocket terminal transport consumed by the explicit CLI runtime-terminal protocol adapter.
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
        - name: namespace
          in: query
          required: true
          schema:
            type: string
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: container
          in: query
          required: false
          schema:
            type: string
        - name: ticket
          in: query
          required: false
          schema:
            type: string
          description: Short-lived one-time ticket returned by `authorizeRuntimeClusterPodTerminal`. Required for Luna CLI; omitted by the existing browser cookie flow.
      responses:
        "101":
          description: WebSocket protocol switch accepted with the `luna.devops.terminal.v1` subprotocol after the ticket or browser session is authorized.
          content:
            text/plain:
              schema:
                type: string
