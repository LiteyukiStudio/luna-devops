      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
            - refresh_token
            - urn:ietf:params:oauth:grant-type:device_code
        client_id: { type: string }
        client_secret: { type: string, writeOnly: true, x-luna-sensitive: true }
        code: { type: string, writeOnly: true, x-luna-sensitive: true }
        code_verifier: { type: string, writeOnly: true, x-luna-sensitive: true }
