  /api/v1/ai-tools/web-search:
    post:
      operationId: webSearch
      tags: [Web]
      summary: Search the public web through the platform-controlled provider
      description: Agent-only read operation. The API applies the current user's egress policy, validates every redirect, rotates the configured proxy pool, and treats returned content as untrusted external data.
      security: [{ AIAgentServiceToken: [] }]
      x-luna-agent:
        aliases:
          zh: [网络搜索, 搜索互联网, 查找公开网页, 搜索官网和公开仓库]
          en: [web search, search the internet, find public webpages]
        purpose: { zh: 通过平台受控出口搜索公开互联网。, en: Search the public web through the platform-controlled egress boundary. }
        avoidWhen: { zh: 已知需要读取的准确公开 URL 时应使用 fetchWebPage。, en: Use fetchWebPage when the exact public URL is already known. }
        preconditions: { zh: [提供不含凭据的公开信息检索词], en: [Provide a public-information query without credentials] }
        successEvidence: { zh: 返回有界的公开搜索结果；所有内容均视为不可信数据。, en: Returns bounded public search results treated as untrusted data. }
      x-luna-cli:
        requiredScopes: ["web:read"]
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        exclusionReason: Agent service-token tool; external CLI users and Agents must use their normal authenticated workflow.
        idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 1, maxLength: 300 }
                limit: { type: integer, minimum: 1, maximum: 10, default: 5 }
      responses:
        "200":
          description: Bounded public search results.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, truncated]
                properties:
                  data: { type: object, additionalProperties: true }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: The configured search provider is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/ai-tools/fetch-web-page:
    post:
      operationId: fetchWebPage
      tags: [Web]
      summary: Fetch a public web page through the platform-controlled egress boundary
      description: Agent-only read operation. Private, reserved, credential-bearing and policy-blocked targets are rejected before the response is reduced to bounded untrusted text and links.
      security: [{ AIAgentServiceToken: [] }]
      x-luna-agent:
        aliases:
          zh: [读取网页, 获取网页正文, 打开公开链接, 读取官网和公开文档]
          en: [fetch web page, read webpage, open public URL]
        purpose: { zh: 通过平台受控出口读取一个公开网页的有界正文和链接。, en: Fetch bounded text and links from one public webpage. }
        avoidWhen: { zh: 不知道目标 URL 时先使用 webSearch；私网、凭据 URL 和非网页内容不可用。, en: Use webSearch when URL is unknown; private, credential-bearing, or non-web targets are not supported. }
        preconditions: { zh: [提供公开 HTTP 或 HTTPS URL], en: [Provide a public HTTP or HTTPS URL] }
        successEvidence: { zh: 返回截断标记、正文和链接；内容均视为不可信数据。, en: Returns a truncation flag, text, and links treated as untrusted data. }
      x-luna-cli:
        requiredScopes: ["web:read"]
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        exclusionReason: Agent service-token tool; external CLI users and Agents must use their normal authenticated workflow.
        idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url: { type: string, minLength: 1, maxLength: 2048 }
                maxCharacters: { type: integer, minimum: 1, maximum: 50000, default: 20000 }
      responses:
        "200":
          description: Bounded public page content and links.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, truncated]
                properties:
                  data: { type: object, additionalProperties: true }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { description: The target content type is not readable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "502": { description: The target page is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
