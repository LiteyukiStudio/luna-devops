services:
  postgres:
    image: postgres:17-alpine
    networks:
      - devops-internal
    environment:
      POSTGRES_DB: devops
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    networks:
      - devops-internal
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: liteyukistudio/luna-devops:${DEVOPS_IMAGE_TAG:-nightly}
    networks:
      - devops-internal
    environment:
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY is required}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DATABASE_URL: postgres://devops:devops@postgres:5432/devops?sslmode=disable
      REDIS_ADDR: redis://default:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      AI_ASSISTANT_AVAILABLE: ${AI_ASSISTANT_AVAILABLE:-false}
      AI_AGENT_BASE_URL: http://agent:8091
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    image: liteyukistudio/luna-worker:${DEVOPS_IMAGE_TAG:-nightly}
    networks:
      - devops-internal
    environment:
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DATABASE_URL: postgres://devops:devops@postgres:5432/devops?sslmode=disable
      REDIS_ADDR: redis://default:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  agent:
    profiles: ["ai"]
    image: liteyukistudio/luna-agent:${DEVOPS_IMAGE_TAG:-nightly}
    networks:
      - devops-internal
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://devops:devops@postgres:5432/devops?sslmode=disable
      AUTH_MODE: bff-hmac
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET:-}
      LUNA_API_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose:
      - "8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8091/internal/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:

networks:
  devops-internal:
