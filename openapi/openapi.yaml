          type: object
          required: [inputTokens, outputTokens, cacheReadInputTokens, cacheWriteInputTokens, reasoningOutputTokens, cacheHitRate, toolCalls, toolSuccessRate, turnCount, turnSuccessRate, runDurationP95]
          properties:
            inputTokens: { type: integer, format: int64, minimum: 0, description: Input tokens consumed during the selected period; cache-read and cache-write tokens are subsets and are not added again. }
            outputTokens: { type: integer, format: int64, minimum: 0, description: Output tokens generated during the selected period. }
            cacheReadInputTokens: { type: integer, format: int64, minimum: 0, nullable: true, description: Cache-read subset of inputTokens, or null when any included provider usage omitted it. }
            cacheWriteInputTokens: { type: integer, format: int64, minimum: 0, nullable: true, description: Cache-write subset of inputTokens, or null when any included provider usage omitted it. }
            reasoningOutputTokens: { type: integer, format: int64, minimum: 0, nullable: true, description: Reasoning subset of outputTokens, or null when any included provider usage omitted it. }
            cacheHitRate: { type: number, format: double, minimum: 0, maximum: 100, nullable: true, description: Weighted cacheReadInputTokens divided by inputTokens as a percentage; null when cache-read usage is incomplete or total input is zero. }
            toolCalls: { type: number, minimum: 0, description: Tool calls recorded during the selected period, including internal UI tools and non-terminal calls. }
            toolSuccessRate: { type: number, minimum: 0, maximum: 100, description: Succeeded tool calls divided by succeeded plus failed calls during the selected period. }
            turnCount: { type: integer, format: int64, minimum: 0, description: Conversation turns created during the selected period. }
