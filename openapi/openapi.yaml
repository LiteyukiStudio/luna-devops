      type: object
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: "^[A-Z2-7]{4}(?:-[A-Z2-7]{4}){3}$"
      required: [recoveryCodes]
