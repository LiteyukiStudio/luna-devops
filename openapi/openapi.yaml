openapi: 3.1.0
info:
  title: Luna DevOps API
  version: 0.1.0
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Configs
  - name: DataRetention
  - name: Git
  - name: Registries
  - name: Runtime
  - name: Dashboard
  - name: Projects
  - name: Volumes
  - name: Applications
  - name: Deployments
  - name: Builds
  - name: AccessTokens
  - name: OAuthApplications
  - name: System
  - name: Notifications
  - name: Inbox
  - name: Events
  - name: Billing
  - name: Gateway
  - name: Topology
  - name: Releases
  - name: AppTemplates
  - name: Web
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy.

  /api/v1/meta:
    get:
      operationId: getApiMeta
      tags: [Health]
      summary: Get API version and CLI capability metadata
      responses:
        "200":
          description: Public API compatibility and feature metadata.
          content:
            application/json:
              schema:
                type: object
                required: [apiVersion, serverVersion, openapiDigest, minimumCliVersion, features]
                properties:
                  apiVersion: { type: string, example: v1 }
                  serverVersion: { type: string, example: 0.1.0 }
                  openapiDigest:
                    type: string
                    description: Exact OpenAPI snapshot digest for diagnostics and cache invalidation, not a compatibility version.
                    example: "sha256:0123456789abcdef"
                  minimumCliVersion: { type: string, example: 0.1.0 }
                  features:
                    type: object
                    required: [accessToken, deviceCode, oauthAuthorization, openapiOperations]
                    properties:
                      accessToken: { type: boolean }
                      deviceCode: { type: boolean }
                      oauthAuthorization: { type: boolean }
                      openapiOperations: { type: boolean }

  /.well-known/oauth-authorization-server:
    get:
      operationId: getOAuthAuthorizationServerMetadata
      tags: [Auth]
      summary: Get OAuth authorization server metadata
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: OAuth discovery is consumed by the CLI authentication adapter.
      responses:
        "200":
          description: OAuth 2.0 authorization server metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthAuthorizationServerMetadata"

  /api/v1/oauth/device/authorization:
    post:
      operationId: startOAuthDeviceAuthorization
      tags: [Auth]
      summary: Start an OAuth Device Authorization Grant
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: Device authorization is exposed through `luna login`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthDeviceAuthorizationInput"
      responses:
        "200":
          description: Device and user codes for the browser verification flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthDeviceAuthorizationResponse"
        "400":
          description: OAuth protocol error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthProtocolError" }

  /api/v1/oauth/device/verification:
    get:
      operationId: getOAuthDeviceVerification
      tags: [Auth]
      summary: Inspect a pending OAuth device authorization
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: Browser-only Device Code verification endpoint.
      parameters:
        - name: user_code
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pending device authorization visible to the signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthDeviceVerification"
        "400":
          description: Invalid, expired, or consumed user code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: decideOAuthDeviceVerification
      tags: [Auth]
      summary: Approve or deny an OAuth device authorization
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: Browser-only Device Code verification endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthDeviceVerificationDecisionInput"
      responses:
        "200":
          description: Device authorization decision accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthDeviceVerificationResult"
        "400":
          description: Invalid, expired, or consumed user code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/oauth/token:
    post:
      operationId: exchangeOAuthToken
      tags: [Auth]
      summary: Exchange an OAuth authorization grant for tokens
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: OAuth token exchange is consumed by the CLI authentication adapter.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthTokenInput"
      responses:
        "200":
          description: OAuth access token and, when the application uses expiring access tokens, a refresh token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthTokenResponse" }
        "400":
          description: OAuth protocol error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthProtocolError" }

  /api/v1/oauth/revoke:
    post:
      operationId: revokeOAuthToken
      tags: [Auth]
      summary: Revoke the token family containing an OAuth access or refresh token
      description: Revokes every access and refresh token issued by the same login family. Other login families and the consent grant remain active.
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: OAuth revocation is exposed through `luna logout`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthTokenRevocationInput"
      responses:
        "200":
          description: The matching token family is revoked, or the supplied token was already invalid.

  /api/v1/public/configs:
    post:
      operationId: getPublicConfigs
      tags: [Configs]
      summary: Get public app configs by keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigKeysInput"
      responses:
        "200":
          description: Public config dictionary.

  /api/v1/build/templates:
    get:
      operationId: listBuildTemplates
      x-luna-cli:
        requiredScopes: ["build:read"]
      tags: [Builds]
      summary: List immutable platform build templates
      responses:
        "200":
          description: Built-in template catalog.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BuildTemplate" }

  /api/v1/build/templates/{templateId}/preview:
    post:
      operationId: previewBuildTemplate
      x-luna-cli:
        requiredScopes: ["build:read"]
      tags: [Builds]
      summary: Validate template parameters and preview the generated Dockerfile
      parameters:
        - name: templateId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildTemplatePreviewInput" }
      responses:
        "200":
          description: Rendered, immutable build definition preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildTemplatePreview" }

  /api/v1/build/environment-config:
    get:
      operationId: getBuildEnvironmentConfig
      x-luna-cli:
        requiredScopes: ["secret:read_summary"]
      tags: [Builds]
      summary: Get one global, application, or deployment build environment
      parameters:
        - $ref: "#/components/parameters/BuildEnvironmentScope"
        - { name: projectId, in: query, schema: { type: string } }
        - { name: applicationId, in: query, schema: { type: string } }
        - { name: deploymentTargetId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Public values and boolean secret presence. Secret values and references are never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildEnvironmentConfig" }
    put:
      operationId: updateBuildEnvironmentConfig
      x-luna-cli:
        requiredScopes: ["secret:update"]
      tags: [Builds]
      summary: Replace one global, application, or deployment build environment
      parameters:
        - $ref: "#/components/parameters/BuildEnvironmentScope"
        - { name: projectId, in: query, schema: { type: string } }
        - { name: applicationId, in: query, schema: { type: string } }
        - { name: deploymentTargetId, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildEnvironmentConfigInput" }
      responses:
        "200":
          description: Updated build environment with secret presence only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildEnvironmentConfig" }

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Login with a local account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Login failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/login/resume:
    post:
      operationId: resumeLogin
      tags: [Auth]
      summary: Resume login with a remembered account
      description: Rotates the per-user remember token, creates a new 24-hour session, and refreshes the 30-day remember cookie. Browser cookies are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeLoginInput"
      responses:
        "200":
          description: Remembered login resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Remember token missing, expired, revoked, or the account is disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Logout current session
      responses:
        "204":
          description: Logged out.

  /api/v1/auth/registration:
    get:
      operationId: getAuthRegistrationStatus
      x-luna-cli:
        requiredScopes: ["auth:manage"]
      tags: [Auth]
      summary: Get public registration capabilities
      responses:
        "200":
          description: Public registration capability flags.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthRegistrationStatus" }

  /api/v1/auth/registration/email/code:
    post:
      operationId: requestEmailRegistrationCode
      tags: [Auth]
      summary: Request an email registration verification code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRegistrationCodeInput" }
      responses:
        "202":
          description: Verification challenge created.

  /api/v1/auth/registration/email:
    post:
      operationId: completeEmailRegistration
      tags: [Auth]
      summary: Complete email registration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRegistrationInput" }
      responses:
        "201":
          description: Account created and signed in.

  /api/v1/auth/registration/settings:
    get:
      operationId: getAuthRegistrationSettings
      x-luna-cli:
        requiredScopes: ["auth:manage"]
      tags: [Auth]
      summary: Get registration settings
      responses:
        "200":
          description: Registration settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthRegistrationSettings" }
    put:
      operationId: updateAuthRegistrationSettings
      x-luna-cli:
        requiredScopes: ["auth:manage"]
      tags: [Auth]
      summary: Update registration settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRegistrationSettingsInput" }
      responses:
        "200":
          description: Registration settings updated.

  /api/v1/mail/settings:
    get:
      operationId: getPlatformMailSettings
      tags: [Notifications]
      summary: Get the global mail service settings
      description: Returns the platform SMTP transport and personal-email cooldown configuration without exposing its Secret Store reference or password.
      x-luna-agent:
        aliases: { zh: [查看全局邮件配置, 查询 SMTP 设置, 邮件服务设置], en: [get global mail settings, get SMTP settings, mail service settings] }
        purpose: { zh: 读取平台统一 SMTP 传输配置、个人邮件冷却时间及密码是否已设置。, en: Read the platform-wide SMTP transport, personal-email cooldown, and whether its password is set. }
        avoidWhen: { zh: 查看个人邮件偏好时应使用 getMyNotificationPreferences。, en: Use getMyNotificationPreferences for a user's personal email preference. }
        preconditions: { zh: [当前用户是平台管理员], en: [The current user is a platform administrator] }
        successEvidence: { zh: 返回不含密码和 Secret 引用的全局邮件配置。, en: Returns global mail settings without the password or Secret reference. }
      x-luna-cli:
        command: mail.settings.get
        classification: business-command
        risk: low
        requiredScopes: ["config:read"]
        agentAllowed: true
      responses:
        "200":
          description: Sanitized global mail settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformMailSettings" }
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updatePlatformMailSettings
      tags: [Notifications]
      summary: Update the global mail service settings
      description: Stores a newly supplied SMTP password in Secret Store and configures the personal-event email cooldown; an empty password keeps the current value. The cooldown does not affect registration, account-recovery, administrator-test, or shared-channel email.
      x-luna-agent:
        aliases: { zh: [更新全局邮件配置, 配置 SMTP, 修改邮件服务], en: [update global mail settings, configure SMTP, update mail service] }
        purpose: { zh: 配置注册、个人通知及后续账号恢复共用的 SMTP 传输服务，并设置仅作用于个人事件邮件的冷却时间。, en: Configure the SMTP transport shared by registration, personal notifications, and future account recovery, plus the cooldown used only for personal event email. }
        avoidWhen: { zh: 不要用它修改个人邮件开关或创建固定收件人渠道。, en: Do not use this to change a personal email toggle or create a fixed-recipient channel. }
        preconditions: { zh: [当前用户是平台管理员, 已确认 SMTP 服务地址、发件人和认证方式], en: [The current user is a platform administrator, The SMTP endpoint sender and authentication mode are confirmed] }
        successEvidence: { zh: 返回脱敏后的权威配置；随后可用 testPlatformMailSettings 验证真实投递。, en: Returns the sanitized authoritative settings; testPlatformMailSettings can then verify a real delivery. }
        requiresApproval: true
      x-luna-cli:
        command: mail.settings.update
        classification: business-command
        risk: high
        requiredScopes: ["config:write"]
        agentAllowed: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformMailSettingsInput" }
      responses:
        "200":
          description: Sanitized updated global mail settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformMailSettings" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/mail/settings/test:
    post:
      operationId: testPlatformMailSettings
      tags: [Notifications]
      summary: Send a global mail service test message
      description: Sends one test message to the explicit recipient through the saved global SMTP configuration.
      x-luna-agent:
        aliases: { zh: [测试全局邮件, 测试 SMTP, 发送测试邮件], en: [test global mail, test SMTP, send test email] }
        purpose: { zh: 用一次真实邮件验证已保存的全局 SMTP 配置。, en: Verify the saved global SMTP configuration with one real email. }
        avoidWhen: { zh: 测试个人 Webhook 渠道时应使用 testMyNotificationChannel。, en: Use testMyNotificationChannel to test a personal webhook channel. }
        preconditions: { zh: [当前用户是平台管理员, 全局邮件配置已保存, 已获得向收件地址发送测试邮件的授权], en: [The current user is a platform administrator, Global mail settings are saved, Sending a test to the recipient is authorized] }
        successEvidence: { zh: SMTP 服务接受测试消息并返回成功结果。, en: The SMTP service accepts the test message and returns success. }
        requiresApproval: true
      x-luna-cli:
        command: mail.settings.test
        classification: business-command
        risk: high
        requiredScopes: ["config:write"]
        agentAllowed: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformMailTestInput" }
      responses:
        "200":
          description: Test message accepted by SMTP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTestResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: SMTP rejected the message or was unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/providers:
    get:
      operationId: listAuthProviders
      x-luna-cli:
        requiredScopes: ["auth:manage"]
      tags: [Auth]
      summary: List auth providers
      parameters:
        - name: includeDisabled
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Auth provider list.
    post:
      operationId: createAuthProvider
      x-luna-cli:
        requiredScopes: ["auth:manage"]
      tags: [Auth]
      summary: Create auth provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthProviderInput"
      responses:
        "201":
          description: Created auth provider.

  /api/v1/auth/providers/{providerId}:
    put:
      operationId: updateAuthProvider
      x-luna-cli:
        requiredScopes: ["auth:manage"]
      tags: [Auth]
      summary: Update auth provider
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthProviderInput"
      responses:
        "200":
          description: Updated auth provider.

  /api/v1/auth/admission-policy:
    get:
      operationId: getAuthAdmissionPolicy
      x-luna-cli:
        requiredScopes: ["auth:manage"]
      tags: [Auth]
      summary: Get auth admission policy
      responses:
        "200":
          description: Auth admission policy.
    put:
      operationId: updateAuthAdmissionPolicy
      x-luna-cli:
        requiredScopes: ["auth:manage"]
      tags: [Auth]
      summary: Update auth admission policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthAdmissionPolicyInput"
      responses:
        "200":
          description: Updated auth admission policy.

  /api/v1/auth/oidc/{providerId}/start:
    get:
      operationId: startOIDC
      tags: [Auth]
      summary: Start OIDC login or binding flow
      x-luna-cli:
        hidden: true
        exclusionReason: Protocol endpoint consumed by a browser, webhook, probe, stream, or terminal adapter instead of a regular CLI command.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - name: mode
          in: query
          schema:
            type: string
            enum: [login, bind]
            default: login
        - name: redirect
          in: query
          schema:
            type: string
            default: /projects
      responses:
        "302":
          description: Redirect to OIDC provider.

  /api/v1/auth/oidc/callback:
    get:
      operationId: completeOIDC
      tags: [Auth]
      summary: Complete OIDC callback
      x-luna-cli:
        hidden: true
        exclusionReason: Protocol endpoint consumed by a browser, webhook, probe, stream, or terminal adapter instead of a regular CLI command.
      parameters:
        - $ref: "#/components/parameters/OAuthState"
        - $ref: "#/components/parameters/OAuthCode"
      responses:
        "302":
          description: Redirect after OIDC callback.

  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      x-luna-cli:
        requiredScopes: ["user:read"]
      tags: [Users]
      summary: Get current user
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
    put:
      operationId: updateCurrentUser
      x-luna-cli:
        requiredScopes: ["user:write"]
      tags: [Users]
      summary: Update current user preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrentUserInput"
      responses:
        "200":
          description: Updated current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /api/v1/users/me/password:
    put:
      operationId: updateMyPassword
      x-luna-cli:
        requiredScopes: ["user:write"]
      tags: [Users]
      summary: Set or change the current user's local password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMyPasswordInput" }
      responses:
        "204":
          description: Password updated and all sessions revoked.

  /api/v1/users/me/external-identities:
    get:
      operationId: listMyExternalIdentities
      x-luna-cli:
        requiredScopes: ["user:read"]
      tags: [Users]
      summary: List current user's external identities
      responses:
        "200":
          description: External identity list.

  /api/v1/users/me/external-identities/{identityId}:
    delete:
      operationId: unbindMyExternalIdentity
      x-luna-cli:
        requiredScopes: ["user:write"]
      tags: [Users]
      summary: Unbind current user's external identity
      parameters:
        - $ref: "#/components/parameters/IdentityId"
      responses:
        "204":
          description: External identity unbound.

  /api/v1/users:
    get:
      operationId: listUsers
      x-luna-cli:
        requiredScopes: ["user:read"]
      tags: [Users]
      summary: List users
      x-luna-agent:
        aliases:
          zh: [列出平台用户, 查询平台用户, 用户列表]
          en: [list platform users, platform user list]
        purpose: { zh: 分页列出平台用户账号。, en: List platform user accounts. }
        avoidWhen: { zh: 查看当前登录用户自身信息时应使用 getCurrentUser。, en: Use getCurrentUser for the signed-in user's own profile. }
        preconditions: { zh: [当前用户具有平台用户读取权限], en: [The current user can read platform users] }
        successEvidence: { zh: 返回分页用户列表。, en: Returns a paginated user list. }
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, email, name, role, passwordSet, status]
            default: createdAt
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Paginated user list.
    post:
      operationId: createUser
      x-luna-cli:
        requiredScopes: ["user:manage"]
      tags: [Users]
      summary: Create local user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user.

  /api/v1/users/{userId}:
    put:
      operationId: updateUser
      x-luna-cli:
        requiredScopes: ["user:manage"]
      tags: [Users]
      summary: Update user
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: Updated user.

  /api/v1/configs/definitions:
    get:
      operationId: listConfigDefinitions
      x-luna-cli:
