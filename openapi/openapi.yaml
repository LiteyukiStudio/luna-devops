      properties:
        id: { type: string, pattern: '^vtx_' }
        projectId: { type: string }
        projectVolumeId: { type: string, pattern: '^pvol_' }
        direction: { $ref: "#/components/schemas/VolumeTransferDirection" }
        format: { $ref: "#/components/schemas/VolumeTransferFormat" }
        consistencyMode: { $ref: "#/components/schemas/VolumeTransferConsistencyMode" }
        state: { $ref: "#/components/schemas/VolumeTransferState" }
