        agentAllowed: false
        exclusionReason: Legacy administrator conversation detail query; it is not a public business operation and Agent self-inspection is forbidden.
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Conversation observability detail, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObservabilityConversationDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai/observability/turns:
    get:
      operationId: listAgentObservabilityTurns
      tags: [AI Assistant]
      summary: List Agent turns across all users for platform-admin observability
      x-luna-cli:
        classification: internal-observability
        hidden: true
        agentAllowed: false
        exclusionReason: The administrator operations UI consumes this diagnostic turn list; it is intentionally excluded from the public business CLI catalog.
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d, 1y], default: 1h } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: sortBy, in: query, schema: { type: string, enum: [createdAt, conversation, user, status, duration], default: createdAt } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200": { description: Paginated cross-user Agent turn summaries, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObservabilityTurnPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: Agent observability is disabled, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /internal/v1/volume-transfers/{transferId}/content:
    head:
      operationId: headInternalVolumeTransferContent
      tags: [Volumes]
      summary: Read the authoritative internal transfer content offset or size
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        exclusionReason: Private transfer-job token protocol; it is not a user or Agent business command.
      security: [{ VolumeTransferJobToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TransferId"
      responses:
        "200":
          description: Internal content metadata bound to this transfer.
          headers:
            Upload-Offset: { schema: { type: integer, format: int64, minimum: 0 } }
            Upload-Length: { schema: { type: integer, format: int64, minimum: 0 } }
            Upload-Chunk-Size: { schema: { type: integer, format: int64, minimum: 67108864, maximum: 5368709120 } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
    patch:
      operationId: uploadInternalVolumeTransferContent
      tags: [Volumes]
      summary: Stream an export-job archive chunk to the private transfer store
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        transport: upload
        streaming: true
        exclusionReason: Private transfer-job token byte protocol; it is not a user or Agent business command.
      security: [{ VolumeTransferJobToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TransferId"
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: Upload-Checksum
          in: header
          required: true
          schema: { type: string, pattern: '^sha256 [A-Za-z0-9+/]+={0,2}$' }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary, maxLength: 5368709120 }
      responses:
        "204":
          description: Chunk persisted.
          headers:
            Upload-Offset: { schema: { type: integer, format: int64, minimum: 0 } }
            Upload-Chunk-Size: { schema: { type: integer, format: int64, minimum: 67108864, maximum: 5368709120 } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Upload offset mismatch, content conflict, or an identical part is still being persisted. `volume_transfer.part_in_progress` includes a bounded Retry-After value.
          headers:
            Upload-Offset: { schema: { type: integer, format: int64, minimum: 0 } }
            Upload-Chunk-Size: { schema: { type: integer, format: int64, minimum: 67108864, maximum: 5368709120 } }
            Retry-After: { schema: { type: integer, minimum: 1, maximum: 5 }, description: Present for `volume_transfer.part_in_progress`; clients wait, then HEAD the authoritative offset before a bounded retry. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413": { description: Chunk exceeds the S3 multipart part-size limit, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "429": { description: API spool byte budget is busy, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "460": { description: Chunk checksum mismatch, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: API spool directory or capacity observation is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "507": { description: API spool disk has insufficient free space, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    get:
      operationId: downloadInternalVolumeTransferContent
      tags: [Volumes]
      summary: Stream an import archive range to the transfer job
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        transport: download
        streaming: true
        exclusionReason: Private transfer-job token byte protocol; it is not a user or Agent business command.
      security: [{ VolumeTransferJobToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TransferId"
        - name: Range
          in: header
          schema: { type: string, pattern: '^bytes=[0-9]+-[0-9]*$' }
      responses:
        "200": { description: Complete archive, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "206":
          description: Requested archive range.
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/v1/volume-transfers/{transferId}/progress:
    post:
      operationId: reportInternalVolumeTransferProgress
      tags: [Volumes]
      summary: Report bounded transfer progress using a state CAS
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        exclusionReason: Private transfer-job token callback; it is not a user or Agent business command.
      security: [{ VolumeTransferJobToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TransferId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolumeTransferProgressInput" }
      responses:
        "204": { description: Progress accepted idempotently. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/v1/volume-transfers/{transferId}/complete:
    post:
      operationId: completeInternalVolumeTransfer
      tags: [Volumes]
      summary: Commit a successful transfer terminal state idempotently
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        exclusionReason: Private transfer-job token callback; it is not a user or Agent business command.
      security: [{ VolumeTransferJobToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TransferId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolumeTransferCompleteInput" }
      responses:
        "200": { description: Terminal state committed, content: { application/json: { schema: { $ref: "#/components/schemas/VolumeTransfer" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: Final checksum or size mismatch, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /internal/v1/volume-transfers/{transferId}/fail:
    post:
      operationId: failInternalVolumeTransfer
      tags: [Volumes]
      summary: Commit a failed transfer terminal state using a stable error code
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        exclusionReason: Private transfer-job token callback; it is not a user or Agent business command.
      description: Raw stderr is accepted only as bounded internal diagnostics and is never returned in production API responses.
      security: [{ VolumeTransferJobToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TransferId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolumeTransferFailInput" }
      responses:
        "200": { description: Failed terminal state committed, content: { application/json: { schema: { $ref: "#/components/schemas/VolumeTransfer" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: lyd_session
      description: HttpOnly browser session cookie. Sensitive interactive operations do not accept personal access tokens as a substitute.
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: Luna OAuth access token or personal access token
      description: Luna OAuth access token or personal access token. Individual operations may require OAuth and explicitly reject personal access tokens.
    AIAgentServiceToken:
      type: http
      scheme: bearer
      bearerFormat: independent Agent callback service credential
    AIDelegationToken:
      type: http
      scheme: bearer
      bearerFormat: 60-second operation-bound AI delegation
    VolumeTransferJobToken:
      type: http
      scheme: bearer
      bearerFormat: short-lived transfer-bound worker token
      description: Random token bound to exactly one Transfer and valid only for the internal transfer-job callback API.

  parameters:
    BuildEnvironmentScope:
      name: scope
      in: query
      required: true
      schema: { type: string, enum: [global, application, deployment] }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string }
    BindingId:
      name: bindingId
      in: path
      required: true
      schema: { type: string }
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema: { type: string }
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: { type: string }
    IdentityId:
      name: identityId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 160 }
    InboxMessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, pattern: "^imsg_" }
    InboxRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, pattern: "^iar_" }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string }
    OAuthCode:
      name: code
      in: query
      required: true
      schema: { type: string }
    OAuthState:
      name: state
      in: query
      required: true
      schema: { type: string }
    Owner:
      name: owner
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string }
    RegistryId:
      name: registryId
      in: path
      required: true
      schema: { type: string }
    Repo:
      name: repo
      in: path
      required: true
      schema: { type: string }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: string }
    SortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    TargetId:
      name: targetId
      in: path
      required: true
      schema: { type: string }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string }
    TransferId:
      name: transferId
      in: path
      required: true
      schema: { type: string, pattern: '^vtx_' }
    TusResumable:
      name: Tus-Resumable
      in: header
      required: true
      schema: { type: string, const: 1.0.0 }
    DownloadTicket:
      name: ticket
      in: query
      required: false
      description: Optional single-use 60-second ticket exchanged for a transfer-bound Range download session. It is required only for the initial exchange or reauthorization and takes precedence over an existing download session cookie.
      schema: { type: string, minLength: 16, maxLength: 512 }
    DownloadSessionCookie:
      name: luna_volume_download_session
      in: cookie
      required: false
      description: Opaque HttpOnly download session established by a prior successful ticket exchange. It is bound to the actor, project, transfer, archive identity, and exact content path, and expires within 30 minutes.
      schema: { type: string, minLength: 16, maxLength: 512 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    VolumeId:
      name: volumeId
      in: path
      required: true
      schema: { type: string, pattern: '^pvol_' }

  responses:
    Unauthorized:
      description: A valid interactive browser session is required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: The requested state transition conflicts with the current durable state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BadRequest:
      description: The request is invalid or cannot be processed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated principal is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    AIAssistantAccess:
      type: object
      additionalProperties: false
      required: [enabled, maxInputBytes]
      properties:
        enabled:
          type: boolean
          description: Whether the platform enables the assistant for the current authenticated user. Runtime Agent or Provider health never changes this value.
        maxInputBytes:
          type: integer
          minimum: 8192
          maximum: 1048576
          description: Maximum UTF-8 request body size enforced by the Luna API BFF.
    AIObject:
      type: object
      additionalProperties: true
      description: Versioned AI Agent response projected through the Luna API BFF.
    AIProgressOperationType:
      type: string
      enum: [build_run, release, hook_run, app_template_installation]
    AIProgressSnapshot:
      type: object
      required: [operationId, operationType, revision, state, stageCode, progress, steps, updatedAt]
      properties:
        operationId: { type: string }
        operationType: { $ref: "#/components/schemas/AIProgressOperationType" }
        revision: { type: string, pattern: "^[0-9]{8}T[0-9]{6}\\.[0-9]{9}Z$", description: Stable lexically sortable revision derived from the authoritative record update time. }
        state: { type: string, enum: [queued, running, waiting_input, waiting_approval, succeeded, failed, cancelled] }
        stageCode: { type: string, description: Stable frontend i18n code. }
        progress:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [determinate, indeterminate] }
            value: { type: number, minimum: 0, maximum: 100 }
        steps:
          type: array
          items:
            type: object
            required: [id, labelCode, status]
            properties:
              id: { type: string }
              labelCode: { type: string, description: Stable frontend i18n code. }
              status: { type: string, enum: [pending, running, success, warning, error, skipped] }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        error:
          type: object
          required: [code]
          properties:
            code: { type: string }
            requestId: { type: string }
            traceId: { type: string }
    AIDelegationExchangeInput:
      type: object
      properties:
        runActorGrant: { type: string }
        runId: { type: string }
        toolCallId: { type: string }
        operationId: { type: string }
        requestedScopes: { type: array, items: { type: string } }
        argumentsHash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        approvalGranted: { type: boolean, description: True only after the Agent validated the current parameter-bound approval. }
        mfaPurpose: { type: string, description: Present only after a matching Step-up resume. }
        stepUpAssertionId: { type: string, description: API-issued assertion revalidated for the delegated user, session, and purpose. }
      required: [runActorGrant, runId, toolCallId, operationId, requestedScopes, argumentsHash, approvalGranted]
    AIDelegationResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, const: 60 }
        operationId: { type: string }
      required: [accessToken, tokenType, expiresIn, operationId]
    AIProviderInternalConfig:
      type: object
      properties:
        version: { type: string }
        provider:
          type: object
          properties:
            baseUrl: { type: string, format: uri }
            model: { type: string }
            apiKey: { type: string, description: In-memory Agent use only; never returned to browser APIs. }
            configured: { type: boolean }
          required: [baseUrl, model, apiKey, configured]
        runtime:
          type: object
          properties:
            providerTimeoutMs: { type: integer, minimum: 1000, maximum: 120000 }
            runTimeoutMs: { type: integer, minimum: 30000, maximum: 900000 }
            agentConcurrentRuns: { type: integer, minimum: 1, maximum: 10 }
          required: [providerTimeoutMs, runTimeoutMs, agentConcurrentRuns]
      required: [version, provider, runtime]
    AgentObservabilitySource:
      type: string
      enum: [prometheus, loki, tempo]
    AgentObservabilityTestInput:
      type: object
      required: [source, url]
      properties:
        source: { $ref: "#/components/schemas/AgentObservabilitySource" }
        url: { type: string, format: uri }
        token: { type: string, writeOnly: true }
        tenantId: { type: string }
    AgentObservabilityTestResult:
      type: object
      required: [source, reachable, dataAvailable, latencyMs, code]
      properties:
        source: { $ref: "#/components/schemas/AgentObservabilitySource" }
        reachable: { type: boolean }
        dataAvailable: { type: boolean }
        latencyMs: { type: integer, format: int64 }
        code: { type: string }
    AgentObservabilityPoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp: { type: integer, format: int64, description: Unix seconds. }
        value: { type: number }
    AgentObservabilitySeries:
      type: object
      required: [labels, points]
      properties:
        labels: { type: object, additionalProperties: { type: string } }
        points: { type: array, items: { $ref: "#/components/schemas/AgentObservabilityPoint" } }
    AgentObservabilityLog:
      type: object
      required: [timestamp, line, labels]
      properties:
        timestamp: { type: string, description: Unix nanoseconds encoded as a string. }
        line: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
    AgentObservabilityTrace:
      type: object
      required: [traceId, rootServiceName, rootTraceName, startTimeUnixNano, durationMs]
      properties:
        traceId: { type: string }
        rootServiceName: { type: string }
        rootTraceName: { type: string }
        startTimeUnixNano: { type: string }
        durationMs: { type: integer, format: int64 }
    AgentObservabilityTraceSpanEvent:
      type: object
      required: [name, timeUnixNano, attributes]
      properties:
        name: { type: string }
        timeUnixNano: { type: string, description: Unix nanoseconds encoded as a string. }
        attributes: { type: object, additionalProperties: { type: string } }
    AgentObservabilityTraceSpan:
      type: object
      required: [spanId, parentSpanId, name, serviceName, kind, status, startTimeUnixNano, startOffsetMs, durationMs, attributes, events, raw]
      properties:
        spanId: { type: string }
        parentSpanId: { type: string }
        name: { type: string }
        serviceName: { type: string }
        kind: { type: string }
        status: { type: string, enum: [unset, ok, error] }
        startTimeUnixNano: { type: string, description: Unix nanoseconds encoded as a string. }
        startOffsetMs: { type: number, format: double }
        durationMs: { type: number, format: double }
        attributes: { type: object, additionalProperties: { type: string } }
        events: { type: array, items: { $ref: "#/components/schemas/AgentObservabilityTraceSpanEvent" } }
        raw: { type: object, additionalProperties: true, description: Original OTLP JSON object returned by Tempo for this span. }
    AgentObservabilityTraceDetail:
      type: object
      required: [traceId, durationMs, spanCount, errorCount, spans]
      properties:
        traceId: { type: string }
        durationMs: { type: number, format: double }
        spanCount: { type: integer }
        errorCount: { type: integer }
        spans: { type: array, items: { $ref: "#/components/schemas/AgentObservabilityTraceSpan" } }
        context: { $ref: "#/components/schemas/AgentObservabilityTraceContext" }
    AgentObservabilityConversationUser:
      type: object
      required: [id, name, email, avatarUrl]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: string }
    AgentObservabilityConversation:
      type: object
      required: [id, title, user, turnCount, traceCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        user: { $ref: "#/components/schemas/AgentObservabilityConversationUser" }
        turnCount: { type: integer, format: int64 }
        traceCount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentObservabilityConversationTurn:
      type: object
      required: [id, turnIndex, status, userMessage, assistantMessage, runId, traceId, durationMs, createdAt, loops]
      properties:
        id: { type: string }
        turnIndex: { type: integer }
        status: { type: string }
        userMessage: { type: string }
        assistantMessage: { type: string }
        runId: { type: string }
        traceId: { type: string }
        durationMs: { type: number, format: double }
        createdAt: { type: string, format: date-time }
        loops: { type: array, items: { $ref: "#/components/schemas/AgentObservabilityConversationLoop" } }
    AgentObservabilityTurn:
      type: object
      required: [id, conversationId, conversationTitle, user, turnIndex, status, userMessage, assistantMessage, runId, traceId, inputTokens, outputTokens, toolCallCount, durationMs, createdAt]
      properties:
        id: { type: string }
        conversationId: { type: string }
        conversationTitle: { type: string }
        user: { $ref: "#/components/schemas/AgentObservabilityConversationUser" }
        turnIndex: { type: integer }
        status: { type: string }
        userMessage: { type: string }
        assistantMessage: { type: string }
        runId: { type: string }
        traceId: { type: string }
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        toolCallCount: { type: integer, format: int64, minimum: 0 }
        durationMs: { type: number, format: double }
        createdAt: { type: string, format: date-time }
    AgentObservabilityConversationLoop:
      type: object
      required: [loopIndex, items]
      properties:
        loopIndex: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/AgentObservabilityConversationRunItem" } }
    AgentObservabilityConversationRunItem:
      type: object
      required: [id, timelineIndex, type, status, text, createdAt]
      properties:
        id: { type: string }
        timelineIndex: { type: integer }
        type: { type: string, enum: [reasoning_summary, assistant_message, tool_call] }
        status: { type: string }
        text: { type: string }
        toolCall: { $ref: "#/components/schemas/AgentObservabilityConversationToolCall" }
        createdAt: { type: string, format: date-time }
    AgentObservabilityConversationToolCall:
      type: object
      required: [id, operationId, status, arguments]
      properties:
