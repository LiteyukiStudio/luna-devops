      properties:
        generatedAt: { type: string, format: date-time }
        range: { type: string, enum: [1h, 6h, 24h, 7d, 30d, 1y] }
        summary:
          type: object
          required: [inputTokens, outputTokens, toolCalls, toolSuccessRate, turnCount, turnSuccessRate, runDurationP95]
          properties:
            inputTokens: { type: number, minimum: 0, description: Input tokens consumed during the selected period. }
            outputTokens: { type: number, minimum: 0, description: Output tokens generated during the selected period. }
            toolCalls: { type: number, minimum: 0, description: Tool calls recorded during the selected period, including internal UI tools and non-terminal calls. }
            toolSuccessRate: { type: number, minimum: 0, maximum: 100, description: Succeeded tool calls divided by succeeded plus failed calls during the selected period. }
            turnCount: { type: integer, format: int64, minimum: 0, description: Conversation turns created during the selected period. }
            turnSuccessRate: { type: number, minimum: 0, maximum: 100, description: Completed turns divided by terminal turns during the selected period. }
            runDurationP95: { type: number, minimum: 0, description: P95 Agent Run duration in seconds during the selected period. }
        sourceStatus: { type: object, additionalProperties: { type: string, enum: [ready, unavailable] } }
        observationCode: { type: string }
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Stable frontend localization key for a generic safe message; clients should localize primarily from code.
        developerDetail:
          type: string
          description: Credential-redacted development-only diagnostic detail; omitted in production responses.
        requestId:
          type: string
          description: Request identifier for support and log correlation.
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Trace identifier when the request has a valid trace context.
        retryable:
          type: boolean
          description: Whether retrying the same operation without changing arguments may succeed.
        status:
          type: string
          description: Stable resource observation status when an upstream source cannot provide a current fact.
          enum: [unavailable]
        observationCode:
          type: string
          description: Stable machine-readable observation reason when status is unavailable.
        path:
          type: string
          description: Stable argument path associated with a structured validation error.
        allowedValues:
          type: array
          items: { type: string }
          description: Allowed enum values for a structured validation error.
        details:
          type: object
          additionalProperties: true
          description: Development-only machine-readable diagnostic context; omitted in production responses.
      required: [code, message, requestId]
