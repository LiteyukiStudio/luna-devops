name: Luna DevOps Skill Validation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing cli-v-prefixed Git tag to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cli-skills-validation-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Parse release version from tag
        id: metadata
        run: >-
          node scripts/skills/release-metadata.mjs
          --tag="${{ inputs.tag }}"

      - name: Verify tag points at checked-out commit
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        run: test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"

      - name: Record release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    name: Validate Skills
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release helpers and Skills
        run: |
          node --test scripts/skills/tests/*.test.mjs
          node scripts/cli/verify-skills-sync.mjs

  package:
    name: Package same-version Skills
    needs:
      - metadata
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Package the standard progressive Skill
        run: >-
          node scripts/skills/package-skills.mjs
          --output=release/skills
          --tag="${{ needs.metadata.outputs.tag }}"
          --version="${{ needs.metadata.outputs.version }}"
          --commit="${{ needs.metadata.outputs.commit }}"
          --requires-cli="${{ needs.metadata.outputs.version }}"

      - name: Upload assembled release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luna-cli-skills-validation-${{ needs.metadata.outputs.version }}
          path: |
            release/skills/luna-devops-*.skill
            release/skills/LUNA-CLI-SKILLS-MANIFEST.json
          if-no-files-found: error
          retention-days: 7
