{{- if and .Values.ai.enabled .Values.ai.agent.networkPolicy.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "luna-devops.agentName" . }}-ingress
  labels:
    {{- include "luna-devops.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "luna-devops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "luna-devops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: {{ .Values.ai.agent.service.port }}
{{- end }}
{{- if and .Values.ai.enabled .Values.ai.agent.networkPolicy.egress.enabled }}
{{- if .Values.ai.agent.networkPolicy.ingress.enabled }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "luna-devops.agentName" . }}-egress
  labels:
    {{- include "luna-devops.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "luna-devops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "luna-devops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "luna-devops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgresql
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- range .Values.ai.agent.networkPolicy.egress.additionalCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
    {{- end }}
    {{- with .Values.ai.agent.networkPolicy.egress.additionalRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
