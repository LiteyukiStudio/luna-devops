      type: string
      enum:
        - runtime_exec
        - runtime_terminal
        - secret_update
        - registry_credential_update
        - kubeconfig_update
        - auth_provider_update
        - user_admin_update
        - mfa_manage
        - security_settings_update
        - data_retention_cleanup
        - password_update
        - access_token_manage
        - billing_owner_transfer
        - volume_import
        - volume_export
        - volume_adopt
        - volume_delete
