openapi: 3.1.0
info:
  title: Luna Agent Internal API
  version: 1.0.0
  description: Cluster-internal contract consumed only by the Luna API BFF.
servers:
  - url: http://luna-agent
security:
  - APIServiceToken: []
paths:
  /internal/health/live:
    get:
      operationId: getAgentLiveness
      security: []
      responses: { "200": { description: Agent process is live } }
  /internal/health/ready:
    get:
      operationId: getAgentReadiness
      security: []
      responses: { "200": { description: PostgreSQL, the AI schema, and the last valid Provider configuration are ready. }, "503": { description: A required dependency is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } } }
  /internal/v1/capabilities:
    get:
      operationId: getInternalAICapabilities
      description: Returns Agent feature, limit, and Provider metadata. Liveness and readiness are reported only by the dedicated health endpoints.
      responses: { "200": { description: Capability result, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } }, "401": { $ref: "#/components/responses/AgentError" } }
  /internal/v1/conversations:
    get:
      operationId: listInternalAIConversations
      parameters:
        - { $ref: "#/components/parameters/ActorContext" }
        - { $ref: "#/components/parameters/ActorSignature" }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: sortBy, in: query, required: false, schema: { type: string, enum: [updatedAt], default: updatedAt } }
        - { name: sortOrder, in: query, required: false, schema: { type: string, enum: [asc, desc], default: desc } }
      responses: { "200": { description: Paginated conversation list, content: { application/json: { schema: { $ref: "#/components/schemas/AgentConversationPage" } } } }, "401": { $ref: "#/components/responses/AgentError" } }
    post:
      operationId: createInternalAIConversation
      parameters: [{ $ref: "#/components/parameters/ActorContext" }, { $ref: "#/components/parameters/ActorSignature" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentConversationCreateInput" } } } }
      responses: { "200": { description: Existing empty conversation reused with the requested model, content: { application/json: { schema: { $ref: "#/components/schemas/AgentConversation" } } } }, "201": { description: Conversation created, content: { application/json: { schema: { $ref: "#/components/schemas/AgentConversation" } } } }, "401": { $ref: "#/components/responses/AgentError" } }
  /internal/v1/conversations/{conversationId}:
    parameters:
      - { $ref: "#/components/parameters/ActorContext" }
      - { $ref: "#/components/parameters/ActorSignature" }
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      operationId: getInternalAIConversation
      responses: { "200": { description: Conversation, content: { application/json: { schema: { $ref: "#/components/schemas/AgentConversation" } } } }, "404": { $ref: "#/components/responses/AgentError" } }
    patch:
      operationId: updateInternalAIConversation
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentConversationUpdateInput" } } } }
      responses: { "200": { description: Conversation updated, content: { application/json: { schema: { $ref: "#/components/schemas/AgentConversation" } } } }, "404": { $ref: "#/components/responses/AgentError" } }
    delete:
      operationId: deleteInternalAIConversation
      responses: { "204": { description: Conversation physically deleted }, "404": { $ref: "#/components/responses/AgentError" }, "409": { $ref: "#/components/responses/AgentError" } }
  /internal/v1/conversations/{conversationId}/timeline:
    get:
      operationId: getInternalAIConversationTimeline
      parameters:
        - { $ref: "#/components/parameters/ActorContext" }
        - { $ref: "#/components/parameters/ActorSignature" }
        - { $ref: "#/components/parameters/ConversationId" }
        - { name: before, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 512, pattern: "^[A-Za-z0-9_-]+$" }, description: Opaque exclusive cursor returned by pageInfo.olderCursor; only requests older complete turns. }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200": { description: Durable timeline page ordered by turnIndex ascending, content: { application/json: { schema: { $ref: "#/components/schemas/AgentTimelinePage" } } } }
        "400": { description: Invalid, malformed, or cross-conversation cursor; error code is ai.timeline_cursor_invalid., content: { application/json: { schema: { $ref: "#/components/schemas/AgentError" } } } }
        "404": { $ref: "#/components/responses/AgentError" }
  /internal/v1/conversations/{conversationId}/turns:
    post:
      operationId: createInternalAITurn
      parameters:
        - { $ref: "#/components/parameters/ActorContext" }
        - { $ref: "#/components/parameters/ActorSignature" }
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCreateTurnInput" } } } }
      responses: { "202": { description: Turn and run accepted, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } }, "409": { $ref: "#/components/responses/AgentError" } }
  /internal/v1/conversations/{conversationId}/tool-actions:
    post:
      operationId: executeInternalInteractionCardToolAction
      parameters:
        - { $ref: "#/components/parameters/ActorContext" }
        - { $ref: "#/components/parameters/ActorSignature" }
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } }
      responses: { "202": { description: Tool action accepted, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } }, "409": { $ref: "#/components/responses/AgentError" } }
  /internal/v1/turns/{turnId}/runs:
    parameters:
      - { $ref: "#/components/parameters/ActorContext" }
      - { $ref: "#/components/parameters/ActorSignature" }
      - { $ref: "#/components/parameters/TurnId" }
    get:
      operationId: listInternalAIRuns
      responses: { "200": { description: Paginated runs, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } } }
    post:
      operationId: createInternalAIRun
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } }
      responses: { "202": { description: Run accepted, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } }, "409": { $ref: "#/components/responses/AgentError" } }
  /internal/v1/runs/{runId}:
    get:
      operationId: getInternalAIRun
      parameters: [{ $ref: "#/components/parameters/ActorContext" }, { $ref: "#/components/parameters/ActorSignature" }, { $ref: "#/components/parameters/RunId" }]
      responses: { "200": { description: Run state, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } }, "404": { $ref: "#/components/responses/AgentError" } }
  /internal/v1/runs/{runId}/events:
    get:
      operationId: streamInternalAIRunEvents
      parameters:
        - { $ref: "#/components/parameters/ActorContext" }
        - { $ref: "#/components/parameters/ActorSignature" }
        - { $ref: "#/components/parameters/RunId" }
        - { name: after, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string } }
      responses: { "200": { description: Recoverable SSE stream from the single Agent replica, backed by a bounded live buffer and PostgreSQL durable replay. Business frames replay by after or Last-Event-ID; heartbeats have no id, are not persisted, and do not advance eventSequence. Completed output and workflow terminal facts are available from the authoritative Timeline., content: { text/event-stream: { schema: { type: string } } } }, "404": { $ref: "#/components/responses/AgentError" }, "429": { description: Per-Run or per-instance SSE subscriber limit reached., content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } } }
  /internal/v1/runs/{runId}/cancel:
    post:
      operationId: cancelInternalAIRun
      parameters: [{ $ref: "#/components/parameters/ActorContext" }, { $ref: "#/components/parameters/ActorSignature" }, { $ref: "#/components/parameters/RunId" }]
      responses: { "202": { description: Cancellation is durably reflected in the returned Run state and signals any active model or platform-tool HTTP request on the single Agent replica. Aborting an external request is best-effort after that system has committed a side effect; authoritative business readback remains required., content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } }, "404": { $ref: "#/components/responses/AgentError" } }
  /internal/v1/runs/{runId}/input:
    post:
      operationId: submitInternalAIRunInput
      parameters: [{ $ref: "#/components/parameters/ActorContext" }, { $ref: "#/components/parameters/ActorSignature" }, { $ref: "#/components/parameters/RunId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } }
      responses: { "202": { description: Input accepted, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } }, "409": { $ref: "#/components/responses/AgentError" } }
  /internal/v1/runs/{runId}/approvals/{toolCallId}/decision:
    post:
      operationId: decideInternalAIToolApproval
      parameters: [{ $ref: "#/components/parameters/ActorContext" }, { $ref: "#/components/parameters/ActorSignature" }, { $ref: "#/components/parameters/RunId" }, { $ref: "#/components/parameters/ToolCallId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } }
      responses: { "202": { description: Decision accepted, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObject" } } } }, "409": { $ref: "#/components/responses/AgentError" } }
components:
  securitySchemes:
    APIServiceToken: { type: http, scheme: bearer, bearerFormat: short-lived EdDSA service JWT }
  parameters:
    ActorContext: { name: X-Luna-Actor-Context, in: header, required: true, schema: { type: string }, description: Short-lived EdDSA Actor Context JWT; compatibility mode uses base64url-encoded JSON. }
    ActorSignature: { name: X-Luna-Actor-Signature, in: header, required: false, schema: { type: string, pattern: "^sha256=[0-9a-f]{64}$" }, description: Required only by the explicitly configured HMAC compatibility mode. }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { type: string } }
    TurnId: { name: turnId, in: path, required: true, schema: { type: string } }
    RunId: { name: runId, in: path, required: true, schema: { type: string } }
    ToolCallId: { name: toolCallId, in: path, required: true, schema: { type: string } }
  schemas:
    AgentObject: { type: object, additionalProperties: true }
    AgentConversation:
      type: object
      additionalProperties: false
      required: [id, ownerUserId, title, titleSource, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        ownerUserId: { type: string }
        projectId: { type: string }
        modelId: { type: string, minLength: 5, maxLength: 64 }
        title: { type: string }
        titleSource: { type: string, enum: [default, assistant, user] }
        status: { type: string, enum: [active] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentConversationCreateInput:
      type: object
      additionalProperties: false
      required: [modelId]
      properties:
        projectId: { type: string, minLength: 5, maxLength: 64 }
        modelId: { type: string, minLength: 5, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 120 }
    AgentConversationSummary:
      type: object
      additionalProperties: false
      required: [id, title, titleSource, status]
      properties:
        id: { type: string }
        modelId: { type: string, minLength: 5, maxLength: 64 }
        title: { type: string }
        titleSource: { type: string, enum: [default, assistant, user] }
        status: { type: string, enum: [active] }
    AgentConversationUpdateInput:
      type: object
      additionalProperties: false
      anyOf:
        - required: [title]
        - required: [modelId]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        modelId: { type: string, minLength: 5, maxLength: 64 }
    AgentCreateTurnInput:
      type: object
      additionalProperties: false
      required: [runId, modelId, input, pageContext]
      properties:
        runId: { type: string, minLength: 1, maxLength: 128, description: Stable Run ID preallocated by the authenticated Luna API BFF. }
        modelId: { type: string, minLength: 1 }
        modelSnapshot:
          type: object
          additionalProperties: false
          required: [id, name, maxContextTokens, maxOutputTokens, inputCreditsPerMillion, outputCreditsPerMillion, cachedInputCreditsPerMillion]
          description: Immutable model identity, capability, and price snapshot attached by the Luna API BFF. maxOutputTokens must be less than maxContextTokens.
          properties:
            id: { type: string, minLength: 5, maxLength: 64 }
            name: { type: string, minLength: 1, maxLength: 200 }
            maxContextTokens: { type: integer, minimum: 4096, maximum: 2097152 }
            maxOutputTokens: { type: integer, minimum: 256, maximum: 262144 }
            inputCreditsPerMillion: { type: string, pattern: '^\d+(\.\d{1,8})?$' }
            outputCreditsPerMillion: { type: string, pattern: '^\d+(\.\d{1,8})?$' }
            cachedInputCreditsPerMillion: { type: string, pattern: '^\d+(\.\d{1,8})?$' }
        input: { type: object, additionalProperties: true }
        pageContext: { type: object, additionalProperties: true }
    AgentConversationPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, sortBy, sortOrder, total, totalPages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentConversation" } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        sortBy: { type: string, enum: [updatedAt] }
        sortOrder: { type: string, enum: [asc, desc] }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    AgentTimelinePage:
      type: object
      additionalProperties: false
      required: [conversation, turns, eventCursors, pageInfo]
      properties:
        conversation: { $ref: "#/components/schemas/AgentConversationSummary" }
        contextUsage: { $ref: "#/components/schemas/AgentContextUsage" }
        turns:
          type: array
          description: Complete turns in chronological order within this page; a turn is never split across pages.
          items: { $ref: "#/components/schemas/AgentObject" }
        eventCursors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [runId, after]
            properties:
              runId: { type: string }
              after: { type: integer, format: int64, minimum: 0 }
        pageInfo:
          type: object
          additionalProperties: false
          required: [hasOlder]
          properties:
            hasOlder: { type: boolean }
            olderCursor: { type: string, description: Opaque cursor for the next older page; omitted when hasOlder is false. }
    AgentContextUsage:
      type: object
      additionalProperties: false
      description: Latest confirmed conversation context, tagged with its model identity. It remains stable while a new Run is active and may decrease after context compaction.
      required: [status, runId, modelId, usedTokens, maxContextTokensSnapshot, recordedAt]
      properties:
        status: { type: string, enum: [reported] }
        runId: { type: string }
        modelId: { type: string }
        usedTokens: { type: integer, format: int64, minimum: 0, description: Official total_tokens after the latest reported assistant model call; not a sum of historical requests. }
        maxContextTokensSnapshot: { type: integer, format: int64, minimum: 1 }
        recordedAt: { type: string, format: date-time }
    AgentError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
        retryable: { type: boolean }
      required: [code, retryable]
  responses:
    AgentError:
      description: Stable internal Agent error envelope.
      content: { application/json: { schema: { $ref: "#/components/schemas/AgentError" } } }
