      security: [{ SessionCookie: [] }]
      parameters: [{ name: runId, in: path, required: true, schema: { type: string } }]
      responses: { "202": { description: Cancellation accepted. PostgreSQL records the authoritative canceled terminal state, and the current single Agent replica signals any active model request or platform-tool HTTP request to abort. Cancellation is best-effort once an external system has already committed a side effect; callers must use the operation's authoritative readback to determine the final business result. Cross-Pod cancellation continuity is not provided., content: { application/json: { schema: { $ref: "#/components/schemas/AIObject" } } } }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/v1/ai/runs/{runId}/input:
    post:
      operationId: submitAIRunInput
      tags: [AI Assistant]
      security: [{ SessionCookie: [] }]
      parameters: [{ name: runId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AIRunInput" } } } }
      responses: { "202": { description: Supplemental input accepted, content: { application/json: { schema: { $ref: "#/components/schemas/AIObject" } } } }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" } }
  /api/v1/ai/runs/{runId}/approvals/{toolCallId}/decision:
    post:
      operationId: decideAIToolApproval
      tags: [AI Assistant]
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: toolCallId, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AIToolApprovalDecisionInput" } } } }
      responses: { "202": { description: Approval decision accepted, content: { application/json: { schema: { $ref: "#/components/schemas/AIObject" } } } }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" } }
  /api/v1/ai/progress/projects/{projectId}/{operationType}/{operationId}:
    get:
      operationId: getAIProgress
      tags: [AI Assistant]
      summary: Read the authoritative progress snapshot for an AI interaction card
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: operationType, in: path, required: true, schema: { $ref: "#/components/schemas/AIProgressOperationType" } }
        - { name: operationId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Current authoritative operation progress, content: { application/json: { schema: { $ref: "#/components/schemas/AIProgressSnapshot" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai/progress/projects/{projectId}/{operationType}/{operationId}/stream:
    get:
      operationId: streamAIProgress
      tags: [AI Assistant]
      summary: Stream authoritative progress snapshots for an AI interaction card
      description: Emits an immediate `progress.snapshot`, sends later revisions, and closes after a terminal state. Reconnecting always reconciles from the latest platform state.
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: operationType, in: path, required: true, schema: { $ref: "#/components/schemas/AIProgressOperationType" } }
        - { name: operationId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Unbuffered SSE stream of progress snapshots, content: { text/event-stream: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /internal/v1/ai/provider-config:
    get:
      operationId: getInternalAIProviderConfig
      tags: [AI Assistant Internal]
      summary: Return the versioned Provider and runtime policy required by Agent
      security: [{ AIAgentServiceToken: [] }]
      responses:
        "200":
          description: Non-cacheable Provider configuration, including the decrypted API key for in-memory Agent use.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProviderInternalConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/configs/ai/provider/test:
    post:
      operationId: testAIProviderConnection
      tags: [AI Assistant]
      summary: Ask Agent to perform a minimal read-only Provider connection test
      security: [{ SessionCookie: [] }]
      responses:
        "200": { description: Stable Provider connection result, content: { application/json: { schema: { $ref: "#/components/schemas/AIObject" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Provider configuration has not been completed, content: { application/json: { schema: { $ref: "#/components/schemas/AIObject" } } } }
        "503": { description: Agent or Provider is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/configs/ai/observability/test:
    post:
      operationId: testAgentObservabilitySource
      tags: [AI Assistant]
      summary: Test one unsaved or saved Agent observability query source without blocking configuration persistence
      description: Use this administrator-only command to verify one Prometheus, Loki, or Tempo source. Unsaved credentials are accepted as write-only input, so strict Agent mode is intentionally disabled.
      x-luna-cli:
        command: agent-observability.source-test
        classification: business-command
        risk: medium
        requiredScopes: ["agent-observability:read"]
        agentAllowed: false
        examples:
          - luna agent-observability source-test body=@source-test.json output=json interactive=false
      security: [{ SessionCookie: [] }, { BearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentObservabilityTestInput" }
      responses:
        "200": { description: Connection and recent-data diagnostic result, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObservabilityTestResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ai/observability/overview:
    get:
      operationId: getAgentObservabilityOverview
      tags: [AI Assistant]
      summary: Return selected-period Agent token, tool, turn, success, and latency totals used by the operations overview
      description: Start Agent operations diagnosis here. The bounded snapshot defaults to one hour and reports source availability with a stable observation code before any detailed query is attempted.
      x-luna-cli:
        command: agent-observability.overview
        classification: business-command
        risk: low
        requiredScopes: ["agent-observability:read"]
        agentAllowed: true
        examples:
          - luna agent-observability overview range=1h output=json interactive=false agent=true
      security: [{ SessionCookie: [] }, { BearerToken: [] }]
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d, 1y], default: 1h } }
      responses:
        "200": { description: Non-cacheable Agent observability snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObservabilityOverview" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: Agent observability is disabled or not configured, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/ai/observability/traces/{traceId}:
    get:
      operationId: getAgentObservabilityTrace
      tags: [AI Assistant]
      summary: Get a normalized Agent turn Span timeline from Tempo
      description: Load one known 32-character Trace ID after a turn or tool-call query identifies it. Luna CLI applies an additional output redaction boundary to raw spans and captured GenAI content.
      x-luna-cli:
        command: agent-observability.trace
        classification: business-command
        risk: low
        requiredScopes: ["agent-observability:read"]
        agentAllowed: true
        examples:
          - luna agent-observability trace traceId=0123456789abcdef0123456789abcdef output=json interactive=false agent=true
      security: [{ SessionCookie: [] }, { BearerToken: [] }]
      parameters:
        - in: path
          name: traceId
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{32}$" }
      responses:
        "200": { description: Non-cacheable normalized trace detail, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObservabilityTraceDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: Trace data is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/ai/observability/conversations:
    get:
      operationId: listAgentObservabilityConversations
      tags: [AI Assistant]
      summary: List Agent conversations across all users for platform-admin observability
      x-luna-cli:
        classification: internal-observability
        hidden: true
        agentAllowed: false
        requiredScopes: ["agent-observability:read"]
        exclusionReason: Legacy administrator conversation observability query; the current operations UI uses paginated turn queries instead of exposing this as a business CLI command.
      security: [{ SessionCookie: [] }, { BearerToken: [] }]
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d, 1y], default: 1h } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: sortBy, in: query, schema: { type: string, enum: [updatedAt, title, user, turnCount], default: updatedAt } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200": { description: Paginated cross-user conversation summaries, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObservabilityConversationPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: Agent observability is disabled, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/ai/observability/conversations/{conversationId}:
    get:
      operationId: getAgentObservabilityConversation
      tags: [AI Assistant]
      summary: Get one cross-user Agent conversation with messages, turns, and linked traces
      x-luna-cli:
        classification: internal-observability
        hidden: true
        agentAllowed: false
        requiredScopes: ["agent-observability:read"]
        exclusionReason: Legacy administrator conversation detail query; it is not a public business operation and Agent self-inspection is forbidden.
      security: [{ SessionCookie: [] }, { BearerToken: [] }]
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Conversation observability detail, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObservabilityConversationDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai/observability/turns:
    get:
      operationId: listAgentObservabilityTurns
      tags: [AI Assistant]
      summary: List Agent turns across all users for platform-admin observability
      description: Narrow an abnormal overview to bounded cross-user turns. Defaults to the last hour, page 1, and 20 items; supports search, stable sorting, and at most 100 items per page.
      x-luna-cli:
        command: agent-observability.turns
        classification: business-command
        risk: low
        requiredScopes: ["agent-observability:read"]
        agentAllowed: true
        examples:
          - luna agent-observability turns range=1h page=1 pageSize=20 sortBy=createdAt sortOrder=desc output=json interactive=false agent=true
      security: [{ SessionCookie: [] }, { BearerToken: [] }]
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d, 1y], default: 1h } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: sortBy, in: query, schema: { type: string, enum: [createdAt, conversation, user, status, duration], default: createdAt } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200": { description: Paginated cross-user Agent turn summaries, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObservabilityTurnPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: Agent observability is disabled, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/ai/observability/tools:
    get:
      operationId: listAgentObservabilityTools
      tags: [AI Assistant]
      summary: List selected-period Agent tool success summaries for the platform-admin operations UI
      description: Narrow an abnormal overview to bounded per-operation tool totals and success rates. Defaults to the last hour, page 1, and 20 items; search and sorting are server-side.
      x-luna-cli:
        command: agent-observability.tools
        classification: business-command
        risk: low
        requiredScopes: ["agent-observability:read"]
        agentAllowed: true
        examples:
          - luna agent-observability tools range=1h page=1 pageSize=20 sortBy=failedCalls sortOrder=desc output=json interactive=false agent=true
      security: [{ SessionCookie: [] }, { BearerToken: [] }]
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d, 1y], default: 1h } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, schema: { type: string, maxLength: 128 } }
        - { name: sortBy, in: query, schema: { type: string, enum: [lastCalledAt, operationId, totalCalls, successRate, failedCalls], default: lastCalledAt } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200": { description: Paginated tool success summaries, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObservabilityToolSummaryPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: Agent observability is disabled, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /api/v1/ai/observability/tools/{operationId}/calls:
    get:
      operationId: listAgentObservabilityToolCalls
      tags: [AI Assistant]
      summary: List selected-period redacted calls for one Agent tool
      description: Load bounded, already-redacted call evidence for one known operation ID after the tool summary identifies an anomaly. Encrypted executable arguments are never returned.
      x-luna-cli:
        command: agent-observability.tool-calls
        classification: business-command
        risk: low
        requiredScopes: ["agent-observability:read"]
        agentAllowed: true
        examples:
          - luna agent-observability tool-calls operationId=listProjectVolumes range=1h page=1 pageSize=20 output=json interactive=false agent=true
      security: [{ SessionCookie: [] }, { BearerToken: [] }]
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z][A-Za-z0-9_.-]{0,127}$" } }
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d, 1y], default: 1h } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: sortBy, in: query, schema: { type: string, enum: [createdAt, status, user, conversation], default: createdAt } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200": { description: Paginated redacted tool calls, content: { application/json: { schema: { $ref: "#/components/schemas/AgentObservabilityToolCallPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: Agent observability is disabled, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: lyd_session
      description: HttpOnly browser session cookie. Sensitive interactive operations do not accept personal access tokens as a substitute.
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: Luna OAuth access token or personal access token
      description: Luna OAuth access token or personal access token. Individual operations may require OAuth and explicitly reject personal access tokens.
    AIAgentServiceToken:
      type: http
      scheme: bearer
      bearerFormat: independent Agent callback service credential

  parameters:
    BuildEnvironmentScope:
      name: scope
      in: query
      required: true
      schema: { type: string, enum: [global, application, deployment] }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string }
    BindingId:
      name: bindingId
      in: path
      required: true
      schema: { type: string }
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema: { type: string }
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: { type: string }
    IdentityId:
      name: identityId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 160 }
    InboxMessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, pattern: "^imsg_" }
    InboxRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, pattern: "^iar_" }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string }
    NotificationChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string, pattern: '^nch_' }
    OAuthCode:
      name: code
      in: query
      required: true
      schema: { type: string }
    OAuthState:
      name: state
      in: query
      required: true
      schema: { type: string }
    Owner:
      name: owner
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string }
    RegistryId:
      name: registryId
      in: path
      required: true
      schema: { type: string }
    Repo:
      name: repo
      in: path
      required: true
      schema: { type: string }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: string }
    SortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    Visibility:
      name: visibility
      in: query
      required: false
      description: Controls cross-project discovery. Omitted or `related` returns resources related to the caller. `all` must be requested explicitly and is available only to platform administrators. Invalid values return `400`; an unauthorized `all` request returns `403`. When an operation also accepts `projectId` or another resource identifier, that identifier is applied as a stronger filter within the selected visibility.
      schema:
        type: string
        enum: [related, all]
        default: related
    TargetId:
      name: targetId
      in: path
      required: true
      schema: { type: string }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string }
    TransferId:
      name: transferId
      in: path
      required: true
      schema: { type: string, pattern: '^vtx_' }
    DownloadTicket:
      name: ticket
      in: query
      required: true
      description: Single-use 60-second ticket bound to the actor, project, and transfer. It is consumed when one direct content or manifest stream opens.
      schema: { type: string, minLength: 16, maxLength: 512 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    VolumeId:
      name: volumeId
      in: path
      required: true
      schema: { type: string, pattern: '^pvol_' }

  responses:
    Unauthorized:
      description: A valid interactive browser session is required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: The requested state transition conflicts with the current durable state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BadRequest:
      description: The request is invalid or cannot be processed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated principal is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreconditionRequired:
      description: The request must include the current resource revision precondition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required storage or external provider dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    AIAssistantAccess:
      type: object
      additionalProperties: false
      required: [enabled, maxInputBytes]
      properties:
        enabled:
          type: boolean
          description: Whether the platform enables the assistant for the current authenticated user. Runtime Agent or Provider health never changes this value.
        maxInputBytes:
          type: integer
          const: 131072
          description: Maximum UTF-8 text size accepted for one user turn or supplemental input; the JSON envelope has a separate internal transport limit.
    AIModelOption:
      type: object
      additionalProperties: false
      required: [id, name, maxContextTokens, maxOutputTokens]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1 }
        maxContextTokens: { type: integer, format: int64, minimum: 4096, maximum: 2097152 }
        maxOutputTokens: { type: integer, format: int64, minimum: 256, maximum: 262144 }
    AIModelConfig:
      type: object
      additionalProperties: false
      required: [id, name, maxContextTokens, maxOutputTokens, inputCreditsPerMillion, outputCreditsPerMillion, cachedInputCreditsPerMillion, enabled, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1 }
        maxContextTokens: { type: integer, format: int64, minimum: 4096, maximum: 2097152 }
        maxOutputTokens: { type: integer, format: int64, minimum: 256, maximum: 262144 }
        inputCreditsPerMillion: { type: string, pattern: "^\\d+(\\.\\d{1,8})?$" }
        outputCreditsPerMillion: { type: string, pattern: "^\\d+(\\.\\d{1,8})?$" }
        cachedInputCreditsPerMillion: { type: string, pattern: "^\\d+(\\.\\d{1,8})?$" }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AIModelWriteInput:
      type: object
      additionalProperties: false
      required: [name, maxContextTokens, maxOutputTokens, inputCreditsPerMillion, outputCreditsPerMillion, cachedInputCreditsPerMillion]
      properties:
        name: { type: string, minLength: 1 }
        maxContextTokens: { type: integer, format: int64, minimum: 4096, maximum: 2097152 }
        maxOutputTokens: { type: integer, format: int64, minimum: 256, maximum: 262144 }
        inputCreditsPerMillion: { type: string, pattern: "^\\d+(\\.\\d{1,8})?$" }
        outputCreditsPerMillion: { type: string, pattern: "^\\d+(\\.\\d{1,8})?$" }
        cachedInputCreditsPerMillion: { type: string, pattern: "^\\d+(\\.\\d{1,8})?$" }
        enabled: { type: boolean }
    AIModelPricingSnapshot:
      type: object
      additionalProperties: false
      required: [id, name, maxContextTokens, maxOutputTokens, inputCreditsPerMillion, outputCreditsPerMillion, cachedInputCreditsPerMillion]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1 }
        maxContextTokens: { type: integer, format: int64, minimum: 4096, maximum: 2097152 }
        maxOutputTokens: { type: integer, format: int64, minimum: 256, maximum: 262144 }
        inputCreditsPerMillion: { type: string, pattern: "^\\d+(\\.\\d{1,8})?$" }
        outputCreditsPerMillion: { type: string, pattern: "^\\d+(\\.\\d{1,8})?$" }
        cachedInputCreditsPerMillion: { type: string, pattern: "^\\d+(\\.\\d{1,8})?$" }
    AICreateTurnInput:
      type: object
      additionalProperties: false
      required: [modelId, input, pageContext]
      properties:
        modelId: { type: string, minLength: 1 }
        input:
          type: object
          additionalProperties: false
          required: [parts]
          description: Combined text across all parts must not exceed 128 KiB when encoded as UTF-8.
          properties:
            parts:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: object
                additionalProperties: false
                required: [type, text]
                properties:
                  type: { type: string, const: text }
                  text: { type: string, minLength: 1, maxLength: 131072, description: Text is trimmed and is also subject to the combined 128 KiB UTF-8 limit. }
        pageContext: { type: object, additionalProperties: true }
    AIObject:
      type: object
      additionalProperties: true
      description: Versioned AI Agent response projected through the Luna API BFF.
    AIConversation:
      type: object
      additionalProperties: false
      required: [id, title, titleSource, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        titleSource: { type: string, enum: [default, assistant, user] }
        status: { type: string }
        projectId: { type: string }
        modelId: { type: string, minLength: 5, maxLength: 64, description: Model preference used by subsequent turns in this conversation. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AIToolApprovalDecisionInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
    AIInteractionCardToolActionInput:
      type: object
      additionalProperties: false
      required: [operationId, arguments, message]
      properties:
        operationId: { type: string, pattern: "^[a-zA-Z][a-zA-Z0-9_.-]{2,100}$" }
        arguments: { type: object, additionalProperties: true }
        message: { type: string, minLength: 1, maxLength: 131072, description: Text is trimmed and must not exceed 128 KiB when encoded as UTF-8. }
    AIRunInput:
      type: object
      additionalProperties: false
      required: [text, expectedVersion]
      properties:
        text: { type: string, minLength: 1, maxLength: 131072, description: Text is trimmed and must not exceed 128 KiB when encoded as UTF-8. }
        expectedVersion: { type: integer }
    AIConversationCreateInput:
      type: object
      additionalProperties: false
      required: [modelId]
      properties:
        projectId: { type: string, minLength: 5, maxLength: 64 }
        modelId: { type: string, minLength: 5, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 120 }
    AIConversationUpdateInput:
      type: object
      additionalProperties: false
      anyOf:
        - required: [title]
        - required: [modelId]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        modelId: { type: string, minLength: 5, maxLength: 64 }
    AIConversationPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, sortBy, sortOrder, total, totalPages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AIConversation" } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        sortBy: { type: string, enum: [updatedAt] }
        sortOrder: { type: string, enum: [asc, desc] }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    AIConversationTimelineSummary:
      type: object
      additionalProperties: false
      required: [id, title, titleSource, status]
      properties:
        id: { type: string }
        title: { type: string }
        titleSource: { type: string, enum: [default, assistant, user] }
        status: { type: string }
        modelId: { type: string, minLength: 5, maxLength: 64, description: Model preference used by subsequent turns in this conversation. }
    AIMessagePart:
      type: object
      additionalProperties: false
      required: [id, partIndex, type]
      properties:
        id: { type: string }
        partIndex: { type: integer, minimum: 0 }
        type: { type: string, enum: [text, structured_data] }
        text: { type: string }
        data: { type: object, additionalProperties: true }
    AITimelineItem:
      type: object
      additionalProperties: false
      required: [id, timelineIndex, revision, createdAt, type, status, parts]
      properties:
        id: { type: string }
        timelineIndex: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        type: { type: string, enum: [user_message, reasoning_summary, progress, assistant_message, tool_call, tool_result, system_notice] }
        status: { type: string }
        relatedItemId: { type: string }
        display: { type: string, enum: [summary, progress] }
        parts: { type: array, items: { $ref: "#/components/schemas/AIMessagePart" } }
        toolCall: { $ref: "#/components/schemas/AIObject" }
    AITimelineTurn:
      type: object
      additionalProperties: false
      required: [id, turnIndex, status, input]
      properties:
        id: { type: string }
        turnIndex: { type: integer, minimum: 0 }
        status: { type: string }
        input:
          type: object
          additionalProperties: false
          required: [id, type, createdAt, parts]
          properties:
            id: { type: string }
            type: { type: string, enum: [user_message] }
            createdAt: { type: string, format: date-time }
            parts: { type: array, items: { $ref: "#/components/schemas/AIMessagePart" } }
        selectedRun:
          type: object
          additionalProperties: false
          required: [id, runIndex, status, items]
          properties:
            id: { type: string }
            runIndex: { type: integer, minimum: 0 }
            status: { type: string, enum: [queued, running, waiting_approval, waiting_input, completed, failed, canceled, interrupted] }
            expectedVersion: { type: integer, format: int64, minimum: 0 }
            errorCode: { type: string }
            latestPromptTokens: { type: integer, format: int64, minimum: 0, description: Official prompt_tokens from the latest reported assistant model usage in this Run. }
            latestUsageModelId: { type: string }
            latestUsageMaxContextTokensSnapshot: { type: integer, format: int64, minimum: 1 }
            items: { type: array, items: { $ref: "#/components/schemas/AITimelineItem" } }
    AIProviderUsage:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, inputTokens, outputTokens, totalTokens]
          properties:
            status: { type: string, enum: [reported] }
            inputTokens: { type: integer, format: int64, minimum: 0 }
            outputTokens: { type: integer, format: int64, minimum: 0 }
            totalTokens: { type: integer, format: int64, minimum: 0, description: Must equal inputTokens plus outputTokens. }
            cacheReadInputTokens: { type: integer, format: int64, minimum: 0, nullable: true }
            cacheWriteInputTokens: { type: integer, format: int64, minimum: 0, nullable: true }
            reasoningOutputTokens: { type: integer, format: int64, minimum: 0, nullable: true, description: Informational subset of outputTokens and never billed twice. }
        - type: object
          additionalProperties: false
          required: [status, reason]
          properties:
            status: { type: string, enum: [unavailable] }
            reason: { type: string, enum: [missing_usage, invalid_usage, stream_ended_without_usage] }
        - type: object
          additionalProperties: false
          required: [status, reason]
          properties:
            status: { type: string, enum: [reconciliation_required] }
            reason: { type: string, enum: [missing_usage, invalid_usage, stream_ended_without_usage, request_outcome_unknown, hold_deficit] }
      discriminator: { propertyName: status }
    AIContextUsage:
      type: object
      additionalProperties: false
      description: Latest confirmed conversation context, tagged with its model identity. It remains stable while a new Run is active and may decrease after context compaction; clients display it only while the conversation model matches.
      required: [status, runId, modelId, usedTokens, maxContextTokensSnapshot, recordedAt]
      properties:
        status: { type: string, enum: [reported] }
        runId: { type: string }
        modelId: { type: string }
        usedTokens: { type: integer, format: int64, minimum: 0, description: Official total_tokens after the latest reported assistant model call; this is not a sum of historical requests. }
        maxContextTokensSnapshot: { type: integer, format: int64, minimum: 1 }
        recordedAt: { type: string, format: date-time }
    AIModelCompletedPayload:
      type: object
      additionalProperties: false
      required: [usage]
      properties:
        usage: { $ref: "#/components/schemas/AIProviderUsage" }
        modelId: { type: string }
        maxContextTokensSnapshot: { type: integer, format: int64, minimum: 1 }
        creditHoldId: { type: string }
        providerRequestId: { type: string }
        responseId: { type: string }
        responseModel: { type: string }
        finishReason: { type: string }
    AIContentDeltaPayload:
      type: object
      additionalProperties: false
      required: [itemId, contentPartId, partIndex, delta, timelineIndex]
      properties:
        itemId: { type: string }
        contentPartId: { type: string }
        partIndex: { type: integer, minimum: 0 }
        delta: { type: string }
        timelineIndex: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time, description: Present only on the first content.delta frame that creates the live item. }
    AIThinkingStartedPayload:
      type: object
      additionalProperties: false
      required: [itemId, summary, display, timelineIndex, createdAt]
      properties:
        itemId: { type: string }
        summary: { type: string }
        display: { type: string, enum: [summary] }
        timelineIndex: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    AIThinkingDeltaPayload:
      type: object
      additionalProperties: false
      required: [itemId, delta, display, timelineIndex]
      properties:
        itemId: { type: string }
        delta: { type: string }
        display: { type: string, enum: [summary] }
        timelineIndex: { type: integer, minimum: 0 }
    AIEvent:
      type: object
      additionalProperties: false
      required: [version, eventId, eventSequence, type, conversationId, turnId, runId, occurredAt, payload]
      properties:
        version: { type: integer, enum: [2] }
        eventId: { type: string }
        eventSequence: { type: integer, format: int64, minimum: 1 }
        type: { type: string }
        conversationId: { type: string }
        turnId: { type: string }
        runId: { type: string }
        itemId: { type: string }
        contentPartId: { type: string }
        toolCallId: { type: string }
        item: { $ref: "#/components/schemas/AITimelineItem" }
        occurredAt: { type: string, format: date-time }
        payload:
          anyOf:
            - { $ref: "#/components/schemas/AIModelCompletedPayload" }
            - { $ref: "#/components/schemas/AIContentDeltaPayload" }
            - { $ref: "#/components/schemas/AIThinkingStartedPayload" }
            - { $ref: "#/components/schemas/AIThinkingDeltaPayload" }
            - { $ref: "#/components/schemas/AIObject" }
    AITimelineEventCursor:
      type: object
      additionalProperties: false
      required: [runId, after]
      properties:
        runId: { type: string }
        after: { type: integer, format: int64, minimum: 0 }
    AITimelinePageInfo:
      type: object
      additionalProperties: false
      required: [hasOlder]
      properties:
        hasOlder: { type: boolean }
        olderCursor: { type: string, description: Opaque cursor for the next older page; omitted when hasOlder is false. }
    AITimelinePage:
      type: object
      additionalProperties: false
      required: [conversation, turns, eventCursors, pageInfo]
      properties:
        conversation: { $ref: "#/components/schemas/AIConversationTimelineSummary" }
        contextUsage: { $ref: "#/components/schemas/AIContextUsage" }
        turns:
          type: array
          description: Complete turns in chronological order within this page; a turn is never split across pages.
          items: { $ref: "#/components/schemas/AITimelineTurn" }
        eventCursors: { type: array, items: { $ref: "#/components/schemas/AITimelineEventCursor" } }
        pageInfo: { $ref: "#/components/schemas/AITimelinePageInfo" }
    AIProgressOperationType:
      type: string
      enum: [build_run, release, hook_run, app_template_installation]
    AIProgressSnapshot:
      type: object
      required: [operationId, operationType, revision, state, stageCode, progress, steps, updatedAt]
      properties:
        operationId: { type: string }
        operationType: { $ref: "#/components/schemas/AIProgressOperationType" }
        revision: { type: string, pattern: "^[0-9]{8}T[0-9]{6}\\.[0-9]{9}Z$", description: Stable lexically sortable revision derived from the authoritative record update time. }
        state: { type: string, enum: [queued, running, waiting_input, waiting_approval, succeeded, failed, cancelled] }
        stageCode: { type: string, description: Stable frontend i18n code. }
        progress:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [determinate, indeterminate] }
            value: { type: number, minimum: 0, maximum: 100 }
        steps:
          type: array
          items:
            type: object
            required: [id, labelCode, status]
            properties:
              id: { type: string }
              labelCode: { type: string, description: Stable frontend i18n code. }
              status: { type: string, enum: [pending, running, success, warning, error, skipped] }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        error:
          type: object
          required: [code]
          properties:
            code: { type: string }
            requestId: { type: string }
            traceId: { type: string }
    AIProviderCompatibility:
      type: string
      enum: [auto, openai, deepseek]
      description: auto preserves direct-endpoint detection; select openai or deepseek explicitly when a compatible gateway hides the leaf Provider hostname.
    AIPromptCacheKeyMode:
      type: string
      enum: [auto, enabled, disabled]
      description: auto sends prompt_cache_key only to the official OpenAI endpoint; enabled opts a confirmed compatible endpoint in, while disabled never sends it.
    AIProviderInternalConfig:
      type: object
      properties:
        version: { type: string }
        provider:
          type: object
          properties:
            baseUrl: { type: string, format: uri }
            apiKey: { type: string, writeOnly: true, x-luna-sensitive: true, description: In-memory Agent use only; never returned to browser APIs. }
            providerCompatibility: { $ref: "#/components/schemas/AIProviderCompatibility" }
            promptCacheKeyMode: { $ref: "#/components/schemas/AIPromptCacheKeyMode" }
            channelAffinityEnabled: { type: boolean, description: When enabled, Agent adds a pseudonymous X-Luna-Affinity-Key header only to conversation-bound model requests. }
            configured: { type: boolean }
            models: { type: array, items: { $ref: "#/components/schemas/AIModelPricingSnapshot" } }
          required: [baseUrl, apiKey, providerCompatibility, promptCacheKeyMode, channelAffinityEnabled, configured, models]
        runtime:
          type: object
          additionalProperties: false
          properties:
            providerTimeoutMs: { type: integer, minimum: 1000, maximum: 900000 }
            maxRequestRetries: { type: integer, minimum: 0, maximum: 10 }
            runTimeoutMs: { type: integer, minimum: 30000, maximum: 7200000 }
            agentConcurrentRuns: { type: integer, minimum: 1, maximum: 100 }
            userConcurrentRuns: { type: integer, minimum: 1, maximum: 100 }
          required: [providerTimeoutMs, maxRequestRetries, runTimeoutMs, agentConcurrentRuns, userConcurrentRuns]
        toolCatalog:
          type: array
          items: { $ref: "#/components/schemas/AIPlatformToolCatalogOperation" }
      required: [version, provider, runtime, toolCatalog]
    AIPlatformToolCatalogOperation:
      type: object
      additionalProperties: false
      required: [operationId, name, summary, category, tags, aliases, purpose, avoidWhen, preconditions, successEvidence, requiresApproval, idempotent, method, path, requiredScopes, inputSchema, outputSchema, parameters, requestBody, requestRequired]
      properties:
        operationId: { type: string }
        name: { type: string }
        summary: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        aliases:
          type: object
          additionalProperties: false
          required: [zh, en]
          properties:
            zh: { type: array, items: { type: string } }
            en: { type: array, items: { type: string } }
        purpose: { $ref: "#/components/schemas/AIAgentLocalizedText" }
        avoidWhen: { $ref: "#/components/schemas/AIAgentLocalizedText" }
        preconditions: { $ref: "#/components/schemas/AIAgentLocalizedList" }
        successEvidence: { $ref: "#/components/schemas/AIAgentLocalizedText" }
        requiresApproval: { type: boolean }
        idempotent: { type: boolean }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        path: { type: string }
        requiredScopes: { type: array, items: { type: string } }
        inputSchema: { type: object, additionalProperties: true }
        outputSchema: { type: object, additionalProperties: true }
        sensitivePaths: { type: array, items: { type: string } }
        parameters:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [inputName, wireName, in, required]
            properties:
              inputName: { type: string }
              wireName: { type: string }
              in: { type: string, enum: [path, query, header] }
              required: { type: boolean }
        requestBody: { type: boolean }
        requestRequired: { type: boolean }
        requestType: { type: string }
    AIAgentLocalizedText:
      type: object
      additionalProperties: false
      required: [zh, en]
      properties:
        zh: { type: string }
        en: { type: string }
    AIAgentLocalizedList:
      type: object
      additionalProperties: false
      required: [zh, en]
      properties:
        zh: { type: array, items: { type: string } }
        en: { type: array, items: { type: string } }
    AgentObservabilitySource:
      type: string
      enum: [prometheus, loki, tempo]
    AgentObservabilityTestInput:
      type: object
      required: [source, url]
      properties:
        source: { $ref: "#/components/schemas/AgentObservabilitySource" }
        url: { type: string, format: uri }
        token: { type: string, writeOnly: true }
        tenantId: { type: string }
    AgentObservabilityTestResult:
      type: object
      required: [source, reachable, dataAvailable, latencyMs, code]
      properties:
        source: { $ref: "#/components/schemas/AgentObservabilitySource" }
        reachable: { type: boolean }
        dataAvailable: { type: boolean }
        latencyMs: { type: integer, format: int64 }
        code: { type: string }
    AgentObservabilityPoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp: { type: integer, format: int64, description: Unix seconds. }
        value: { type: number }
    AgentObservabilitySeries:
      type: object
      required: [labels, points]
      properties:
        labels: { type: object, additionalProperties: { type: string } }
        points: { type: array, items: { $ref: "#/components/schemas/AgentObservabilityPoint" } }
    AgentObservabilityLog:
      type: object
      required: [timestamp, line, labels]
      properties:
        timestamp: { type: string, description: Unix nanoseconds encoded as a string. }
        line: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
    AgentObservabilityTrace:
      type: object
      required: [traceId, rootServiceName, rootTraceName, startTimeUnixNano, durationMs]
      properties:
        traceId: { type: string }
        rootServiceName: { type: string }
        rootTraceName: { type: string }
        startTimeUnixNano: { type: string }
        durationMs: { type: integer, format: int64 }
    AgentObservabilityTraceSpanEvent:
      type: object
      required: [name, timeUnixNano, attributes]
      properties:
        name: { type: string }
        timeUnixNano: { type: string, description: Unix nanoseconds encoded as a string. }
        attributes: { type: object, additionalProperties: { type: string } }
    AgentObservabilityTraceSpan:
      type: object
      required: [spanId, parentSpanId, name, serviceName, kind, status, startTimeUnixNano, startOffsetMs, durationMs, attributes, events, raw]
      properties:
        spanId: { type: string }
        parentSpanId: { type: string }
        name: { type: string }
        serviceName: { type: string }
        kind: { type: string }
        status: { type: string, enum: [unset, ok, error] }
        startTimeUnixNano: { type: string, description: Unix nanoseconds encoded as a string. }
        startOffsetMs: { type: number, format: double }
        durationMs: { type: number, format: double }
        attributes: { type: object, additionalProperties: { type: string } }
        events: { type: array, items: { $ref: "#/components/schemas/AgentObservabilityTraceSpanEvent" } }
        raw: { type: object, additionalProperties: true, description: Original OTLP JSON object returned by Tempo for this span. }
    AgentObservabilityTraceUsage:
      type: object
      additionalProperties: false
      required: [inputTokens, outputTokens, cacheReadInputTokens, cacheWriteInputTokens, reasoningOutputTokens, cacheHitRate]
      properties:
        inputTokens: { type: integer, format: int64, minimum: 0, description: Provider-reported input tokens summed across model spans whose luna.gen_ai.request.purpose is assistant in this trace. }
        outputTokens: { type: integer, format: int64, minimum: 0, description: Provider-reported output tokens summed across model spans whose luna.gen_ai.request.purpose is assistant in this trace. }
        cacheReadInputTokens: { type: integer, format: int64, minimum: 0, nullable: true, description: Cache-read subset of inputTokens, or null when any included model span omitted or invalidated it. }
        cacheWriteInputTokens: { type: integer, format: int64, minimum: 0, nullable: true, description: Cache-write subset of inputTokens, or null when any included model span omitted or invalidated it. }
        reasoningOutputTokens: { type: integer, format: int64, minimum: 0, nullable: true, description: Reasoning subset of outputTokens, or null when any included model span omitted or invalidated it. }
        cacheHitRate: { type: number, format: double, minimum: 0, maximum: 100, nullable: true, description: Weighted cacheReadInputTokens divided by inputTokens as a percentage; null when cache-read usage is incomplete or total input is zero. }
    AgentObservabilityTraceDetail:
      type: object
      required: [traceId, durationMs, spanCount, errorCount, usage, spans]
      properties:
        traceId: { type: string }
        durationMs: { type: number, format: double }
        spanCount: { type: integer }
        errorCount: { type: integer }
        usage:
          nullable: true
          description: Typed usage for provider-reported assistant-purpose model spans in this trace, or null when reported input/output totals are absent, ambiguous, or invalid. Summary, title, and legacy spans without an explicit purpose are excluded.
          allOf:
            - { $ref: "#/components/schemas/AgentObservabilityTraceUsage" }
        spans: { type: array, items: { $ref: "#/components/schemas/AgentObservabilityTraceSpan" } }
        context: { $ref: "#/components/schemas/AgentObservabilityTraceContext" }
    AgentObservabilityConversationUser:
      type: object
      required: [id, name, email, avatarUrl]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: string }
    AgentObservabilityConversation:
      type: object
      required: [id, title, user, turnCount, traceCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        user: { $ref: "#/components/schemas/AgentObservabilityConversationUser" }
        turnCount: { type: integer, format: int64 }
        traceCount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentObservabilityConversationTurn:
      type: object
      required: [id, turnIndex, status, userMessage, assistantMessage, runId, traceId, inputTokens, outputTokens, cacheReadInputTokens, cacheWriteInputTokens, reasoningOutputTokens, durationMs, createdAt, loops]
      properties:
        id: { type: string }
        turnIndex: { type: integer }
        status: { type: string }
        userMessage: { type: string }
        assistantMessage: { type: string }
        runId: { type: string }
        traceId: { type: string }
        inputTokens: { type: integer, format: int64, minimum: 0 }
        outputTokens: { type: integer, format: int64, minimum: 0 }
        cacheReadInputTokens: { type: integer, format: int64, minimum: 0, nullable: true }
        cacheWriteInputTokens: { type: integer, format: int64, minimum: 0, nullable: true }
        reasoningOutputTokens: { type: integer, format: int64, minimum: 0, nullable: true }
        durationMs: { type: number, format: double }
        createdAt: { type: string, format: date-time }
        loops: { type: array, items: { $ref: "#/components/schemas/AgentObservabilityConversationLoop" } }
