        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentBundleReferenceCandidatesRequest" }
      responses:
        "200":
          description: One candidate page scoped to the current user, project space, application, resource state, and reference kind.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentBundleReferenceCandidatePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: Request exceeds 1 MiB, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal failure with a stable deployment bundle error code and no dependency diagnostics., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/projects/{projectId}/applications/{applicationId}/deployment-target-imports:
    post:
      operationId: importDeploymentTargetBundle
      tags: [Deployments]
      summary: Create a deployment target from a validated portable bundle
      description: Revalidates the bundle digest, destination mappings, permissions, billing gate, public stage invariant, dependency visibility, and Secret requirements. Creates one new deployment target transactionally and does not start a build, release, or deployment. A commit that is not ready, including one with an invalid stage, creates no target, Secret, build environment, or volume mount.
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        exclusionReason: Local JSON selection, interactive mappings, and Secret re-entry are handled by the Web console deployment bundle adapter.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentTargetBundleImportRequest" }
      responses:
        "201":
          description: Newly imported deployment target configuration. No build or release was started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentTarget" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: Bundle exceeds 1 MiB, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal failure with a stable deployment bundle error code and no dependency diagnostics., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/projects/{projectId}/releases/{releaseId}/terminal/authorize:
    post:
      operationId: authorizeReleaseRuntimeTerminal
      tags: [Deployments]
      summary: Authorize a release Web Console terminal connection
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: Low-level terminal preflight consumed by the explicit CLI release-terminal protocol adapter.
      description: Normal HTTP preflight used before opening the release terminal WebSocket. Browser callers use their current session cookie and Luna CLI uses its OAuth bearer token; personal access tokens are rejected. The response contains a short-lived random one-time ticket bound to the user, interactive subject, project, release, deployment target, cluster, and namespace. The WebSocket consumes the ticket atomically, repeats authorization checks before upgrading, and continuously revalidates identity, membership, role, resource state, and Web Console policy.
      security:
        - SessionCookie: []
        - BearerToken: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ReleaseId"
      responses:
        "200":
          description: One-time terminal ticket issued. The WebSocket endpoint must still atomically consume it and repeat authorization checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeTerminalAuthorization" }
        "401":
          description: Browser session or Luna CLI OAuth bearer is missing, invalid, expired, or revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Project role is insufficient, Web Console is disabled (`runtime.web_console_disabled`), or a personal access token was used (`runtime.terminal_session_required`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Project, release, or deployment target was not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Project or deployment target is being deleted and cannot open Web Console.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The shared production terminal-ticket store is unavailable (`runtime_terminal.ticket_unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

