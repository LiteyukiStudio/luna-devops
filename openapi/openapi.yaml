        aliases: { zh: [列出运行时集群, 查询集群, 选择集群], en: [list runtime clusters, find cluster, select cluster] }
        avoidWhen: { zh: 已有资源已经绑定明确 clusterId 时不要重新选择；已知项目空间时应传 projectId，不要用 all 扩大候选。, en: Do not reselect when the resource already has an explicit clusterId; pass projectId when the project is known instead of widening candidates with all. }
        preconditions: { zh: [当前用户具有集群读取权限, visibility=all 仅由平台管理员在明确需要全局范围时使用], en: [The current user can read runtime clusters, visibility=all is used only by a platform administrator who explicitly needs the global view] }
        successEvidence: { zh: 返回符合 visibility 及 projectId 强过滤的分页集群列表和真实 clusterId。, en: Returns a paginated cluster list with authoritative clusterId values matching visibility and the stronger projectId filter. }
      parameters:
