openapi: 3.1.0
info:
  title: Luna DevOps API
  version: 0.1.0
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Configs
  - name: DataRetention
  - name: Git
  - name: Registries
  - name: Runtime
  - name: Dashboard
  - name: Projects
  - name: Volumes
  - name: Applications
  - name: Deployments
  - name: Builds
  - name: AccessTokens
  - name: OAuthApplications
  - name: System
  - name: Notifications
  - name: Inbox
  - name: Events
  - name: Billing
  - name: Gateway
  - name: Topology
  - name: Releases
  - name: AppTemplates
  - name: Web
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy.

  /api/v1/meta:
    get:
      operationId: getApiMeta
      tags: [Health]
      summary: Get API version and CLI capability metadata
      responses:
        "200":
          description: Public API compatibility and feature metadata.
          content:
            application/json:
              schema:
                type: object
                required: [apiVersion, serverVersion, openapiDigest, minimumCliVersion, features]
                properties:
                  apiVersion: { type: string, example: v1 }
                  serverVersion: { type: string, example: 0.1.0 }
                  openapiDigest:
                    type: string
                    description: Exact OpenAPI snapshot digest for diagnostics and cache invalidation, not a compatibility version.
                    example: "sha256:0123456789abcdef"
                  minimumCliVersion: { type: string, example: 0.1.0 }
                  features:
                    type: object
                    required: [accessToken, deviceCode, oauthAuthorization, openapiOperations]
                    properties:
                      accessToken: { type: boolean }
                      deviceCode: { type: boolean }
                      oauthAuthorization: { type: boolean }
                      openapiOperations: { type: boolean }

  /.well-known/oauth-authorization-server:
    get:
      operationId: getOAuthAuthorizationServerMetadata
      tags: [Auth]
      summary: Get OAuth authorization server metadata
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: OAuth discovery is consumed by the CLI authentication adapter.
      responses:
        "200":
          description: OAuth 2.0 authorization server metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/oauth/device/authorization:
    post:
      operationId: startOAuthDeviceAuthorization
      tags: [Auth]
      summary: Start an OAuth Device Authorization Grant
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: Device authorization is exposed through `luna login`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string }
                scope: { type: string }
      responses:
        "200":
          description: Device and user codes for the browser verification flow.
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
                properties:
                  device_code: { type: string }
                  user_code: { type: string }
                  verification_uri: { type: string, format: uri }
                  verification_uri_complete: { type: string, format: uri }
                  expires_in: { type: integer, minimum: 1 }
                  interval: { type: integer, minimum: 1 }
        "400":
          description: OAuth protocol error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthProtocolError" }

  /api/v1/oauth/device/verification:
    get:
      operationId: getOAuthDeviceVerification
      tags: [Auth]
      summary: Inspect a pending OAuth device authorization
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: Browser-only Device Code verification endpoint.
      parameters:
        - name: user_code
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pending device authorization visible to the signed-in user.
          content:
            application/json:
              schema:
                type: object
                required: [application, userCode, scopes, expiresAt]
                properties:
                  application: { $ref: "#/components/schemas/OAuthApplication" }
                  userCode: { type: string }
                  scopes:
                    type: array
                    items: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400":
          description: Invalid, expired, or consumed user code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: decideOAuthDeviceVerification
      tags: [Auth]
      summary: Approve or deny an OAuth device authorization
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: Browser-only Device Code verification endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCode, decision]
              properties:
                userCode: { type: string }
                decision: { type: string, enum: [approve, deny] }
      responses:
        "200":
          description: Device authorization decision accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [approved, denied] }
        "400":
          description: Invalid, expired, or consumed user code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/oauth/token:
    post:
      operationId: exchangeOAuthToken
      tags: [Auth]
      summary: Exchange an OAuth authorization grant for tokens
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: OAuth token exchange is consumed by the CLI authentication adapter.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                    - urn:ietf:params:oauth:grant-type:device_code
                client_id: { type: string }
                client_secret: { type: string, writeOnly: true }
                code: { type: string }
                code_verifier: { type: string }
                redirect_uri: { type: string, format: uri }
                refresh_token: { type: string, writeOnly: true }
                device_code: { type: string, writeOnly: true }
      responses:
        "200":
          description: OAuth access and refresh tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthTokenResponse" }
        "400":
          description: OAuth protocol error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthProtocolError" }

  /api/v1/oauth/revoke:
    post:
      operationId: revokeOAuthToken
      tags: [Auth]
      summary: Revoke an OAuth access or refresh token
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: OAuth revocation is exposed through `luna logout`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, writeOnly: true }
                token_type_hint:
                  type: string
                  enum: [access_token, refresh_token]
                client_id: { type: string }
                client_secret: { type: string, writeOnly: true }
      responses:
        "200":
          description: Token is revoked or was already invalid.

  /api/v1/public/configs:
    post:
      operationId: getPublicConfigs
      tags: [Configs]
      summary: Get public app configs by keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigKeysInput"
      responses:
        "200":
          description: Public config dictionary.

  /api/v1/build/templates:
    get:
      operationId: listBuildTemplates
      tags: [Builds]
      summary: List immutable platform build templates
      responses:
        "200":
          description: Built-in template catalog.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BuildTemplate" }

  /api/v1/build/templates/{templateId}/preview:
    post:
      operationId: previewBuildTemplate
      tags: [Builds]
      summary: Validate template parameters and preview the generated Dockerfile
      parameters:
        - name: templateId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildTemplatePreviewInput" }
      responses:
        "200":
          description: Rendered, immutable build definition preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildTemplatePreview" }

  /api/v1/build/environment-config:
    get:
      operationId: getBuildEnvironmentConfig
      tags: [Builds]
      summary: Get one global, application, or deployment build environment
      parameters:
        - $ref: "#/components/parameters/BuildEnvironmentScope"
        - { name: projectId, in: query, schema: { type: string } }
        - { name: applicationId, in: query, schema: { type: string } }
        - { name: deploymentTargetId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Public values and boolean secret presence. Secret values and references are never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildEnvironmentConfig" }
    put:
      operationId: updateBuildEnvironmentConfig
      tags: [Builds]
      summary: Replace one global, application, or deployment build environment
      parameters:
        - $ref: "#/components/parameters/BuildEnvironmentScope"
        - { name: projectId, in: query, schema: { type: string } }
        - { name: applicationId, in: query, schema: { type: string } }
        - { name: deploymentTargetId, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildEnvironmentConfigInput" }
      responses:
        "200":
          description: Updated build environment with secret presence only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildEnvironmentConfig" }

  /api/v1/auth/bootstrap:
    get:
      operationId: getBootstrapStatus
      tags: [Auth]
      summary: Get bootstrap and runtime mode status
      responses:
        "200":
          description: Bootstrap status. devLoginHint is returned only in development mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"

  /api/v1/auth/bootstrap/admin:
    post:
      operationId: initializeAdmin
      tags: [Auth]
      summary: Initialize the first platform admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeAdminInput"
      responses:
        "201":
          description: Created platform admin and session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Invalid email, password, language, or JSON (`bootstrap.invalid_input` or `request.invalid_json`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The production bootstrap token is invalid (`bootstrap.token_invalid`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Platform admin already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Production bootstrap is unavailable because `BOOTSTRAP_TOKEN` is not configured (`bootstrap.unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Login with a local account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Login failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/login/resume:
    post:
      operationId: resumeLogin
      tags: [Auth]
      summary: Resume login with a remembered account
      description: Rotates the per-user remember token, creates a new 24-hour session, and refreshes the 30-day remember cookie. Browser cookies are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeLoginInput"
      responses:
        "200":
          description: Remembered login resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Remember token missing, expired, revoked, or the account is disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Logout current session
      responses:
        "204":
          description: Logged out.

  /api/v1/auth/registration:
    get:
      operationId: getAuthRegistrationStatus
      tags: [Auth]
      summary: Get public registration capabilities
      responses:
        "200":
          description: Public registration capability flags.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthRegistrationStatus" }

  /api/v1/auth/registration/email/code:
    post:
      operationId: requestEmailRegistrationCode
      tags: [Auth]
      summary: Request an email registration verification code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRegistrationCodeInput" }
      responses:
        "202":
          description: Verification challenge created.

  /api/v1/auth/registration/email:
    post:
      operationId: completeEmailRegistration
      tags: [Auth]
      summary: Complete email registration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRegistrationInput" }
      responses:
        "201":
          description: Account created and signed in.

  /api/v1/auth/registration/settings:
    get:
      operationId: getAuthRegistrationSettings
      tags: [Auth]
      summary: Get registration and SMTP settings
      responses:
        "200":
          description: Registration settings with the write-only SMTP password omitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthRegistrationSettings" }
    put:
      operationId: updateAuthRegistrationSettings
      tags: [Auth]
      summary: Update registration and SMTP settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRegistrationSettingsInput" }
      responses:
        "200":
          description: Registration settings updated.

  /api/v1/auth/providers:
    get:
      operationId: listAuthProviders
      tags: [Auth]
      summary: List auth providers
      parameters:
        - name: includeDisabled
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Auth provider list.
    post:
      operationId: createAuthProvider
      tags: [Auth]
      summary: Create auth provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthProviderInput"
      responses:
        "201":
          description: Created auth provider.

  /api/v1/auth/providers/{providerId}:
    put:
      operationId: updateAuthProvider
      tags: [Auth]
      summary: Update auth provider
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthProviderInput"
      responses:
        "200":
          description: Updated auth provider.

  /api/v1/auth/admission-policy:
    get:
      operationId: getAuthAdmissionPolicy
      tags: [Auth]
      summary: Get auth admission policy
      responses:
        "200":
          description: Auth admission policy.
    put:
      operationId: updateAuthAdmissionPolicy
      tags: [Auth]
      summary: Update auth admission policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthAdmissionPolicyInput"
      responses:
        "200":
          description: Updated auth admission policy.

  /api/v1/auth/oidc/{providerId}/start:
    get:
      operationId: startOIDC
      tags: [Auth]
      summary: Start OIDC login or binding flow
      x-luna-cli:
        hidden: true
        exclusionReason: Protocol endpoint consumed by a browser, webhook, probe, stream, or terminal adapter instead of a regular CLI command.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - name: mode
          in: query
          schema:
            type: string
            enum: [login, bind]
            default: login
        - name: redirect
          in: query
          schema:
            type: string
            default: /projects
      responses:
        "302":
          description: Redirect to OIDC provider.

  /api/v1/auth/oidc/callback:
    get:
      operationId: completeOIDC
      tags: [Auth]
      summary: Complete OIDC callback
      x-luna-cli:
        hidden: true
        exclusionReason: Protocol endpoint consumed by a browser, webhook, probe, stream, or terminal adapter instead of a regular CLI command.
      parameters:
        - $ref: "#/components/parameters/OAuthState"
        - $ref: "#/components/parameters/OAuthCode"
      responses:
        "302":
          description: Redirect after OIDC callback.

  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Get current user
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
    put:
      operationId: updateCurrentUser
      tags: [Users]
      summary: Update current user preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrentUserInput"
      responses:
        "200":
          description: Updated current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /api/v1/users/me/password:
    put:
      operationId: updateMyPassword
      tags: [Users]
      summary: Set or change the current user's local password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMyPasswordInput" }
      responses:
        "204":
          description: Password updated and all sessions revoked.

  /api/v1/users/me/external-identities:
    get:
      operationId: listMyExternalIdentities
      tags: [Users]
      summary: List current user's external identities
      responses:
        "200":
          description: External identity list.

  /api/v1/users/me/external-identities/{identityId}:
    delete:
      operationId: unbindMyExternalIdentity
      tags: [Users]
      summary: Unbind current user's external identity
      parameters:
        - $ref: "#/components/parameters/IdentityId"
      responses:
        "204":
          description: External identity unbound.

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List users
      x-luna-agent:
        aliases:
          zh: [列出平台用户, 查询平台用户, 用户列表]
          en: [list platform users, platform user list]
        purpose: { zh: 分页列出平台用户账号。, en: List platform user accounts. }
        avoidWhen: { zh: 查看当前登录用户自身信息时应使用 getCurrentUser。, en: Use getCurrentUser for the signed-in user's own profile. }
        preconditions: { zh: [当前用户具有平台用户读取权限], en: [The current user can read platform users] }
        successEvidence: { zh: 返回分页用户列表。, en: Returns a paginated user list. }
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, email, name, role, passwordSet, status]
            default: createdAt
        - $ref: "#/components/parameters/SortOrder"
      responses:
        "200":
          description: Paginated user list.
    post:
      operationId: createUser
      tags: [Users]
      summary: Create local user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user.

  /api/v1/users/{userId}:
    put:
      operationId: updateUser
      tags: [Users]
      summary: Update user
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: Updated user.

  /api/v1/configs/definitions:
    get:
      operationId: listConfigDefinitions
      tags: [Configs]
      summary: List configurable app config definitions
      responses:
        "200":
          description: Config definitions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConfigDefinition" }

  /api/v1/configs:
    put:
      operationId: updateConfigs
      tags: [Configs]
      summary: Update app configs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConfigsInput"
      responses:
        "200":
          description: Updated config dictionary.

    get:
      operationId: getConfigs
      tags:
        - Configs
      summary: Get Configs
      responses:
        "200":
          description: Point-in-time service dependency observation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceBindingCheckResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/data-retention/catalog:
    get:
      operationId: listDataRetentionCatalog
      tags: [DataRetention]
      summary: List supported data-retention datasets
      description: Returns the fixed cleanup catalog. Audit logs, billing data, and build, release, or Hook metadata are intentionally excluded.
      x-luna-cli:
        command: retention.catalog
        classification: business-command
        risk: low
        requiredScopes: ["retention:read"]
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Retention dataset catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataRetentionCatalogResponse" }
        "403":
          description: Platform-administrator role is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/data-retention/preview:
    post:
      operationId: previewDataRetention
      tags: [DataRetention]
      summary: Preview data matching a retention range
      description: Counts rows without changing data. The selected range is left-closed and right-open (`startAt <= timestamp < endAt`). Active runtime records and protected datasets are never matched.
      x-luna-cli:
        command: retention.preview
        classification: business-command
        risk: low
        requiredScopes: ["retention:read"]
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataRetentionRequest" }
      responses:
        "200":
          description: Matching counts by dataset. `deleted` is zero for a preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataRetentionResultResponse" }
        "400":
          description: Invalid range or unknown dataset (`retention.invalid_range` or `retention.invalid_dataset`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Platform-administrator role is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/data-retention/cleanup:
    post:
      operationId: cleanupDataRetention
      tags: [DataRetention]
      summary: Permanently remove data matching a retention range
      description: Runs the same fixed whitelist and protection rules as preview, then writes only the aggregate result to the audit log. The operation does not accept table names or SQL expressions.
      x-luna-cli:
        command: retention.cleanup
        classification: business-command
        risk: critical
        requiredScopes: ["retention:manage"]
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataRetentionRequest" }
      responses:
        "200":
          description: Matched and deleted counts by dataset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataRetentionResultResponse" }
        "400":
          description: Invalid range or unknown dataset (`retention.invalid_range` or `retention.invalid_dataset`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Platform-administrator role is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Cleanup failed (`retention.cleanup_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runtime/clusters/{clusterId}/pods/terminal/authorize:
    post:
      operationId: authorizeRuntimeClusterPodTerminal
      tags: [Runtime]
      summary: Authorize a runtime-cluster Pod terminal connection
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: Low-level terminal preflight consumed by the explicit CLI runtime-terminal protocol adapter.
      description: Normal HTTP preflight used before opening the Pod terminal WebSocket. Browser callers use their current session cookie and Luna CLI uses its OAuth bearer token; personal access tokens are rejected. The response contains a short-lived random one-time ticket bound to the user, interactive subject, cluster, and Pod. The WebSocket consumes the ticket atomically, repeats authorization checks before upgrading, and continuously revalidates identity, role, Pod identity, and platform ownership.
      security:
        - SessionCookie: []
        - BearerToken: []
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - name: namespace
          in: query
          required: true
          schema: { type: string }
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One-time terminal ticket issued. The WebSocket endpoint must still atomically consume it and repeat authorization checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeTerminalAuthorization" }
        "400":
          description: Pod namespace or name is empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Browser session or Luna CLI OAuth bearer is missing, invalid, expired, or revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The current user is not a platform administrator, or a personal access token was used (`runtime.terminal_session_required`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Runtime cluster was not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The shared production terminal-ticket store is unavailable (`runtime_terminal.ticket_unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

