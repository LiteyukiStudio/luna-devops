  /api/v1/projects/{projectId}/applications/{applicationId}/deployment-targets/{targetId}/export:
    get:
      operationId: exportDeploymentTargetBundle
      tags: [Deployments]
      summary: Export one deployment target as a portable JSON bundle
      description: Exports desired deployment configuration and logical dependency descriptors. Resource IDs, credentials, secret values, runtime state, and workflow history are omitted. Importing the bundle never starts a build or release. If an existing target has a stage outside dev, test, staging, or prod, the exported file remains readable but preview requires a legal stage override before import.
      x-luna-cli:
        requiredScopes: ["deployment:read"]
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        exclusionReason: Local JSON file download is handled by the Web console deployment bundle adapter.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/TargetId"
      responses:
        "200":
          description: "Portable deployment target JSON bundle. The response uses Cache-Control: no-store and an attachment filename."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentTargetBundle" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { description: Export failed with the stable code deployment_bundle.export_failed; internal diagnostics are never returned., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/projects/{projectId}/applications/{applicationId}/deployment-target-imports/preview:
    post:
      operationId: previewDeploymentTargetBundleImport
      tags: [Deployments]
      summary: Validate a deployment target bundle and resolve destination references
      description: Stateless preview. The destination project and application are authoritative. The effective stage must be dev, test, staging, or prod; production is normalized to prod, and an invalid stage can be repaired with a legal override. Missing, ambiguous, forbidden, or incompatible references must be mapped explicitly before commit. No database record, Secret, build, release, or asynchronous task is created.
      x-luna-cli:
        requiredScopes: ["deployment:update"]
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        exclusionReason: Local JSON selection and interactive reference mapping are handled by the Web console deployment bundle adapter.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentTargetBundlePreviewRequest" }
      responses:
        "200":
          description: Destination-specific validation and reference resolution result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentTargetBundlePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: Bundle exceeds 1 MiB, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal failure with a stable deployment bundle error code and no dependency diagnostics., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/projects/{projectId}/applications/{applicationId}/deployment-target-imports/reference-candidates:
    post:
      operationId: listDeploymentTargetBundleReferenceCandidates
      tags: [Deployments]
      summary: List destination candidates for one portable deployment reference
      description: Returns a permission-scoped, searchable and fully paginated candidate page. Invisible and missing mapped resource IDs are intentionally indistinguishable during import validation to prevent resource enumeration. The response uses Cache-Control no-store.
      x-luna-cli:
        requiredScopes: ["deployment:update"]
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        exclusionReason: Interactive local bundle reference mapping is handled by the Web console deployment bundle adapter.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ApplicationId"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
        - name: sortBy
          in: query
          schema: { type: string, enum: [name, createdAt], default: name }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentBundleReferenceCandidatesRequest" }
      responses:
        "200":
          description: One candidate page scoped to the current user, project space, application, resource state, and reference kind.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentBundleReferenceCandidatePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: Request exceeds 1 MiB, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal failure with a stable deployment bundle error code and no dependency diagnostics., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/projects/{projectId}/applications/{applicationId}/deployment-target-imports:
    post:
      operationId: importDeploymentTargetBundle
      tags: [Deployments]
      summary: Create a deployment target from a validated portable bundle
      description: Revalidates the bundle digest, destination mappings, permissions, billing gate, public stage invariant, dependency visibility, and Secret requirements. Creates one new deployment target transactionally and does not start a build, release, or deployment. A commit that is not ready, including one with an invalid stage, creates no target, Secret, build environment, or volume mount.
      x-luna-cli:
        requiredScopes: ["deployment:update"]
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        exclusionReason: Local JSON selection, interactive mappings, and Secret re-entry are handled by the Web console deployment bundle adapter.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentTargetBundleImportRequest" }
      responses:
        "201":
          description: Newly imported deployment target configuration. No build or release was started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentTarget" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: Bundle exceeds 1 MiB, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal failure with a stable deployment bundle error code and no dependency diagnostics., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/projects/{projectId}/releases/{releaseId}/terminal/authorize:
    post:
      operationId: authorizeReleaseRuntimeTerminal
      tags: [Deployments]
      summary: Authorize a release Web Console terminal connection
      x-luna-cli:
        requiredScopes: ["deployment:exec"]
        classification: protocol-adapter
        hidden: true
        exclusionReason: Low-level terminal preflight consumed by the explicit CLI release-terminal protocol adapter.
      description: Normal HTTP preflight used before opening the release terminal WebSocket. Browser callers use their current session cookie and Luna CLI uses its OAuth bearer token; personal access tokens are rejected. The response contains a short-lived random one-time ticket bound to the user, interactive subject, project, release, deployment target, cluster, and namespace. The WebSocket consumes the ticket atomically, repeats authorization checks before upgrading, and continuously revalidates identity, membership, role, resource state, and Web Console policy.
      security:
        - SessionCookie: []
        - BearerToken: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ReleaseId"
      responses:
        "200":
          description: One-time terminal ticket issued. The WebSocket endpoint must still atomically consume it and repeat authorization checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeTerminalAuthorization" }
        "401":
          description: Browser session or Luna CLI OAuth bearer is missing, invalid, expired, or revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Project role is insufficient, Web Console is disabled (`runtime.web_console_disabled`), or a personal access token was used (`runtime.terminal_session_required`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Project, release, or deployment target was not found.
          content:
            application/json:
