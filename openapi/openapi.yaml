        logicalName: { type: string }
        sourceType: { type: string, enum: [projectVolume, emptyDir] }
        projectVolumeId: { type: string }
        mountPath: { type: string }
        devicePath: { type: string }
        readOnly: { type: boolean }
        emptyDir: { $ref: "#/components/schemas/DeploymentEmptyDirInput" }
        activationState: { type: string, enum: [reserved, active, release_pending] }
    DeploymentTargetInput:
      type: object
      description: Complete deployment target create/update payload used by the console, CLI, and Agent. Repository sources require repositoryBindingId; image sources require imageRef. Omitted optional fields use platform defaults.
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
          description: Display name. Defaults to the normalized stage.
        environmentId:
          type: string
          description: Optional project environment reference.
        stage:
          type: string
          pattern: '^(dev|test|staging|prod|sys-[a-z0-9-]+)$'
          default: dev
          description: Immutable stage identifier, unique among active deployment targets in the application. Public create requests accept dev, test, staging, or prod and normalize production to prod. Updates to platform-managed components echo their existing sys-* value. A portable bundle may contain a historical non-public value, but preview/import require a public override. It may be reused after deletion cleanup.
        clusterId:
          type: string
          description: Runtime cluster ID available to the project. Empty selects the platform default cluster.
        namespace:
          type: string
          description: Optional Kubernetes namespace override. Empty uses the project namespace.
        workloadType:
          type: string
          enum: [Deployment, StatefulSet]
          default: Deployment
        replicas:
          type: integer
          minimum: 1
          default: 1
        cpuRequest:
          type: string
          default: "1"
          description: CPU quota for each replica; the selected runtime cluster policy derives Kubernetes requests and limits.
        memoryRequest:
          type: string
          default: 1Gi
          description: Memory quota for each replica; the selected runtime cluster policy derives Kubernetes requests and limits.
        imagePullPolicy:
          type: string
          enum: [Always, IfNotPresent, Never]
        containerCommand:
          type: string
          description: JSON string array or line-separated container command.
        containerArgs:
          type: string
          description: JSON string array or line-separated container arguments.
        lifecycle:
          type: string
          description: JSON Kubernetes lifecycle object.
        initContainers:
          type: string
          description: JSON array of Kubernetes init containers.
        sidecarContainers:
          type: string
          description: JSON array of Kubernetes sidecar containers.
        readinessProbe:
          type: string
          description: JSON Kubernetes readiness probe.
        livenessProbe:
          type: string
          description: JSON Kubernetes liveness probe.
        startupProbe:
          type: string
          description: JSON Kubernetes startup probe.
        runAsUser:
          type: string
          pattern: "^[0-9]*$"
        runAsGroup:
          type: string
          pattern: "^[0-9]*$"
        fsGroup:
          type: string
          pattern: "^[0-9]*$"
        fsGroupChangePolicy:
          type: string
          enum: [Always, OnRootMismatch]
        readOnlyRootFilesystem:
          type: boolean
          default: false
        allowPrivilegeEscalation:
          type: string
          enum: ["", "true", "false"]
          description: Tri-state string; empty inherits the platform default.
        capabilityAdd:
          type: string
          description: JSON string array or line-separated Linux capabilities to add.
        capabilityDrop:
          type: string
          description: JSON string array or line-separated Linux capabilities to drop.
        nodeSelector:
          type: string
          description: JSON object or key=value lines.
        tolerations:
          type: string
          description: JSON Kubernetes toleration array.
        affinity:
          type: string
          description: JSON Kubernetes affinity object.
        topologySpreadConstraints:
          type: string
          description: JSON Kubernetes topology spread constraint array.
        priorityClassName:
          type: string
        serviceAccountName:
          type: string
          pattern: "^$|^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
          maxLength: 253
          description: Optional Kubernetes ServiceAccount name used by the workload Pods.
        automountServiceAccountToken:
          type: string
          enum: ["", "true", "false"]
          description: Tri-state string controlling ServiceAccount token mounting; empty uses the Kubernetes default.
        serviceType:
          type: string
          enum: [ClusterIP, NodePort, LoadBalancer]
        serviceAnnotations:
          type: string
          description: JSON object or key=value lines.
        serviceExternalTrafficPolicy:
          type: string
          enum: [Cluster, Local]
        serviceSessionAffinity:
          type: string
          enum: [None, ClientIP]
        autoScalingEnabled:
          type: boolean
          default: false
        autoScalingMinReplicas:
          type: integer
          minimum: 0
          description: Minimum desired replicas. Zero enables HPA scale-to-zero.
        autoScalingMaxReplicas:
          type: integer
          minimum: 1
        autoScalingCpuPercent:
          type: integer
          minimum: 0
          maximum: 1000
        autoScalingMemoryPercent:
          type: integer
          minimum: 0
          maximum: 1000
        autoScalingBehavior:
          type: string
          description: JSON Kubernetes horizontal pod autoscaler behavior object.
        servicePort:
          type: integer
          minimum: 1
          maximum: 65535
          default: 8080
          description: Legacy single-port projection of servicePorts[0]. New clients should use servicePorts.
        servicePorts:
          type: array
          maxItems: 16
          description: Unique container service ports. This list is the authoritative port configuration.
          items:
            type: object
            additionalProperties: false
            properties:
              name: { type: string }
              port: { type: integer, minimum: 1, maximum: 65535 }
              appProtocol: { type: string }
            required: [port]
        sourceType:
          type: string
          enum: [repository, image]
          description: Repository builds source code; image deploys an existing image directly.
        repositoryBindingId:
          type: string
          description: Required when sourceType is repository; must belong to the same application.
        buildDefinitionMode:
          type: string
          enum: [repository_dockerfile, template]
          default: repository_dockerfile
          description: Selects the repository Dockerfile or a platform-rendered template Dockerfile.
        buildTemplateId:
          type: string
          description: Required when buildDefinitionMode is template.
        buildTemplateVersion:
          type: string
          description: Immutable built-in template version. An empty value selects the current version.
        buildTemplateValues:
          type: string
          description: JSON object containing validated template parameters.
        dockerfilePath:
          type: string
          default: Dockerfile
        buildContext:
          type: string
          default: "."
        buildDirectory:
          type: string
          description: Optional working directory within the build context.
        buildArgs:
          type: string
          description: Newline-separated Docker build arguments in KEY=value form.
        buildEnvironmentId:
          type: string
          description: Optional reusable build environment reference.
        buildCpuRequest:
          type: string
          default: "2"
        buildMemoryRequest:
          type: string
          default: 4Gi
        buildTimeoutSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 1800
        targetRegistryId:
          type: string
          description: Registry credential used to push repository builds.
        targetImageRef:
          type: string
          description: Combined target repository and tag for repository builds.
        targetRepository:
          type: string
        targetTag:
          type: string
          default: latest
        imageRef:
          type: string
          description: Existing OCI image reference used when sourceType is image.
        buildLabels:
          type: string
          description: Comma-separated build selector labels.
        buildVariableSetIds:
          type: array
          items: { type: string }
          description: Project build variable set IDs.
        buildVariables:
          type: object
          additionalProperties: { type: string }
          description: Optional deployment-level values that override matching application, project, and global keys.
        buildSecrets:
          type: object
          additionalProperties: { type: string }
          writeOnly: true
          x-luna-sensitive: true
          description: Optional deployment-level secret updates. Existing keys with an empty value are retained; omitted keys are removed. Values are encrypted and never returned.
        buildHooksEnabled:
          type: boolean
          default: true
        buildHookBindings:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              hookConfigId: { type: string }
              phase: { type: string }
              runOrder: { type: integer, minimum: 0 }
            required: [hookConfigId, phase]
        autoDeploy:
          type: boolean
          default: false
        branchPattern:
          type: string
        tagPattern:
          type: string
        concurrencyPolicy:
          type: string
          enum: [queue, parallel]
          default: queue
        runtimeConfigSetIds:
          type: array
          items: { type: string }
          description: Legacy shorthand for live runtime configuration references.
        runtimeConfigRefs:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              setId: { type: string }
              mode: { type: string, enum: [live, snapshot], default: live }
            required: [setId]
        environmentVariables:
          type: array
          maxItems: 128
          items: { $ref: "#/components/schemas/RuntimeEnvironmentVariableInput" }
          description: Caller-selected public runtime environment variables. The platform does not infer sensitivity from key names or values. A key may also have a separately managed secret; the secret takes precedence in deployed workloads while both modes remain visible in API state. Choose the dedicated runtime secret action when encrypted storage and non-disclosure are required.
        configRefs:
          type: object
          additionalProperties: { type: string }
          description: Runtime ConfigMap references.
        configFiles:
          type: string
          description: JSON array of runtime configuration file mounts.
        secretFiles:
          type: string
          writeOnly: true
          x-luna-sensitive: true
          description: JSON array of runtime secret file inputs. Existing plaintext values are never returned.
        dataVolumes:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/DeploymentDataVolumeInput" }
          description: Complete desired mount set. Omission or an empty array unbinds every existing deployment-volume mount; legacy storage fields and serialized JSON strings are rejected.
        requireApproval:
          type: boolean
          default: false
        webConsoleEnabled:
          type: [boolean, "null"]
          default: null
          description: "`null` inherits the project-space master switch and `false` disables Web Console for this deployment target."
        enabled:
          type: boolean
          default: true
    DeploymentTarget:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        projectId: { type: string }
        applicationId: { type: string }
        stage: { type: string, minLength: 2, maxLength: 12 }
        kubernetesName: { type: string }
        buildDefinitionMode: { type: string, enum: [repository_dockerfile, template] }
        buildTemplateId: { type: string }
        buildTemplateVersion: { type: string }
        buildTemplateValues: { type: string }
        environmentVariables:
          type: array
          items: { $ref: "#/components/schemas/RuntimeEnvironmentVariable" }
        configRefs:
          type: object
          additionalProperties: { type: string }
        dataVolumes:
          type: array
          items: { $ref: "#/components/schemas/DeploymentDataVolume" }
        status:
          type: string
          enum: [ready, scaled-to-zero, degraded, progressing, not-found, not-configured, unavailable, unknown, disabled]
          description: Point-in-time Kubernetes observation. scaled-to-zero is an observed zero-desired-replica runtime, not a serving-ready state.
        observationCode: { type: string }
        lastCheckedAt: { type: string, format: date-time }
        desiredReplicas: { type: integer, minimum: 0 }
        updatedReplicas: { type: integer, minimum: 0 }
        readyReplicas: { type: integer, minimum: 0 }
        availableReplicas: { type: integer, minimum: 0 }
        webConsoleEnabled:
          type: [boolean, "null"]
          description: Nullable target restriction. Effective policy is `project.webConsoleEnabled && webConsoleEnabled != false`; a true value is treated as inheritance.
      required: [id, projectId, applicationId, stage, kubernetesName, dataVolumes, webConsoleEnabled]
    DeploymentTargetRuntimeSecretsInput:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 128
          items: { $ref: "#/components/schemas/RuntimeSecretMutationItem" }
    DeploymentTargetRuntimeSecretsResponse:
      type: object
      additionalProperties: false
      required: [configuredKeys, generatedKeys, clearedKeys, environmentVariables]
      properties:
        configuredKeys: { type: array, items: { type: string } }
        generatedKeys: { type: array, items: { type: string } }
        clearedKeys: { type: array, items: { type: string } }
        environmentVariables:
          type: array
          items: { $ref: "#/components/schemas/RuntimeEnvironmentVariable" }
    DeploymentTargetRuntimeSecretsSummary:
      type: object
      additionalProperties: false
      required: [environmentVariables]
      properties:
        environmentVariables:
          type: array
          items: { $ref: "#/components/schemas/RuntimeEnvironmentVariable" }
    RuntimeEnvironmentVariableInput:
      type: object
      additionalProperties: false
      required: [key, valueMode, value]
      properties:
        key: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$', minLength: 1, maxLength: 128 }
        valueMode: { type: string, enum: [public] }
        value: { type: string, maxLength: 8192 }
    RuntimeEnvironmentVariable:
      type: object
      description: One stored runtime environment value mode. Responses may contain public and secret entries with the same key; the secret entry takes precedence in deployed workloads.
      additionalProperties: false
      required: [key, valueMode, configured]
      properties:
        key: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$', minLength: 1, maxLength: 128 }
        valueMode: { type: string, enum: [public, secret] }
        value:
          type: string
          description: Present only for public variables. Secret values and storage references are never returned.
        configured: { type: boolean }
    RuntimeSecretMutationItem:
      type: object
      additionalProperties: false
      required: [key, valueMode, operation]
      properties:
        key: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$', minLength: 1, maxLength: 128 }
        valueMode: { type: string, enum: [secret] }
        operation: { type: string, enum: [set, generate, clear] }
        value:
          type: string
          writeOnly: true
          x-luna-sensitive: true
          maxLength: 8192
          description: Used only by set. Empty values retain the existing secret.
        generation:
          type: object
          additionalProperties: false
          properties:
            length: { type: integer, minimum: 8, maximum: 256, default: 32 }
            encoding: { type: string, enum: [base64, hex, alphanumeric, numeric], default: base64 }
    DeploymentTargetBundle:
      type: object
      additionalProperties: false
      required: [schemaVersion, kind, exportedAt, configuration, references, secretRequirements, omissions]
      properties:
        schemaVersion: { type: integer, const: 1 }
        kind: { type: string, const: luna-devops.deployment-target }
        exportedAt: { type: string, format: date-time }
        configuration:
          allOf:
            - $ref: "#/components/schemas/DeploymentTargetInput"
          description: Portable desired configuration. Source IDs, resource IDs, secret fields, enabled, and runtime status fields are forbidden and rejected by the importer.
        references:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DeploymentBundleReference" }
        secretRequirements:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DeploymentBundleSecretRequirement" }
        omissions:
          type: array
          items: { type: string }
          description: Stable categories intentionally omitted from the portable bundle.
    DeploymentBundleReferenceDescriptor:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        type: { type: string }
        scope: { type: string }
        owner: { type: string }
        repository: { type: string }
        namespace: { type: string }
        mode: { type: string }
        phase: { type: string }
        runOrder: { type: integer }
        logicalName: { type: string }
        mountPath: { type: string }
        devicePath: { type: string }
        readOnly: { type: boolean }
        accessMode: { type: string }
        volumeMode: { type: string }
        storageClassName: { type: string }
        clusterName: { type: string }
        clusterType: { type: string }
    DeploymentBundleReference:
      type: object
      additionalProperties: false
      required: [key, kind, required, usage, source]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [repositoryBinding, runtimeCluster, artifactRegistry, buildVariableSet, runtimeConfigSet, hookConfig, projectVolume] }
        required: { type: boolean }
        usage: { type: string }
        source: { $ref: "#/components/schemas/DeploymentBundleReferenceDescriptor" }
    DeploymentBundleSecretRequirement:
      type: object
      additionalProperties: false
      required: [key, target]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        target: { type: string, enum: [build, runtimeEnv, runtimeFile] }
        name: { type: string }
        path: { type: string }
    DeploymentTargetBundleOverrides:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        stage: { type: string, enum: [dev, test, staging, prod], description: Public destination stage. Use this to repair a bundle containing a historical or invalid stage. }
        namespace: { type: [string, "null"] }
    DeploymentTargetBundleImportRequest:
      type: object
      additionalProperties: false
      required: [bundle, digest]
      properties:
        bundle: { $ref: "#/components/schemas/DeploymentTargetBundle" }
        digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Digest returned by preview. Commit rejects a changed bundle.
        mappings:
          type: object
          additionalProperties: { type: string }
          description: Maps each portable reference key to a destination resource ID.
        overrides: { $ref: "#/components/schemas/DeploymentTargetBundleOverrides" }
        secretValues:
          type: object
          writeOnly: true
          additionalProperties: { type: string, maxLength: 8192 }
          description: Plaintext values re-entered for each secretRequirements key. Values are encrypted and stored only during the commit transaction.
    DeploymentTargetBundlePreviewRequest:
      type: object
      additionalProperties: false
      required: [bundle]
      properties:
        bundle: { $ref: "#/components/schemas/DeploymentTargetBundle" }
        mappings:
          type: object
          additionalProperties: { type: string }
          description: Maps each portable reference key to a destination resource ID.
        overrides: { $ref: "#/components/schemas/DeploymentTargetBundleOverrides" }
    DeploymentBundleReferenceCandidate:
      type: object
      additionalProperties: false
      required: [id, name, matched, compatible]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        matched: { type: boolean }
        compatible: { type: boolean }
    DeploymentBundleReferenceCandidatesRequest:
      type: object
      additionalProperties: false
      required: [reference]
      properties:
        reference: { $ref: "#/components/schemas/DeploymentBundleReference" }
    DeploymentBundleReferenceCandidatePage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, sortBy, sortOrder, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeploymentBundleReferenceCandidate" }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        sortBy: { type: string, enum: [name, createdAt] }
        sortOrder: { type: string, enum: [asc, desc] }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    DeploymentBundleReferenceResolution:
      type: object
      additionalProperties: false
      required: [key, kind, required, usage, source, status, candidates, candidateCount, truncated]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [repositoryBinding, runtimeCluster, artifactRegistry, buildVariableSet, runtimeConfigSet, hookConfig, projectVolume] }
        required: { type: boolean }
        usage: { type: string }
        source: { $ref: "#/components/schemas/DeploymentBundleReferenceDescriptor" }
        status: { type: string, enum: [resolved, missing, ambiguous, forbidden, incompatible] }
        resolvedId: { type: string }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/DeploymentBundleReferenceCandidate" }
        candidateCount: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        code: { type: string }
    DeploymentTargetBundlePreview:
      type: object
      additionalProperties: false
      required: [digest, status, summary, references, secretRequirements, warnings]
      properties:
        digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        status: { type: string, enum: [ready, requires_mapping, invalid] }
        summary:
          type: object
          additionalProperties: false
          required: [name, stage, namespace, sourceType]
          properties:
            name: { type: string }
            stage: { type: string }
            namespace: { type: string }
            sourceType: { type: string, enum: [repository, image] }
        references:
          type: array
          items: { $ref: "#/components/schemas/DeploymentBundleReferenceResolution" }
        secretRequirements:
          type: array
          items: { $ref: "#/components/schemas/DeploymentBundleSecretRequirement" }
        warnings:
          type: array
          items: { type: string, description: Stable warning code. An invalid effective stage is deployment.stage_invalid. }
    DeploymentBundleErrorCode:
      type: string
      description: Published stable codes produced by deployment bundle validation, preview, import, and export. Authorization middleware may additionally return shared authentication and authorization codes.
      enum:
        - build_template.invalid
        - build_template.not_found
        - deployment.build_args_invalid
        - deployment.resource_quantity_invalid
        - deployment.runtime_config_unavailable
        - deployment.runtime_config_files_invalid
        - deployment.runtime_config_path_invalid
        - deployment.runtime_path_invalid
        - deployment.runtime_secret_files_invalid
        - deployment.stage_invalid
        - deployment_target.image_ref_required
        - deployment_target.service_account_invalid
        - deployment_bundle.candidate_query_invalid
        - deployment_bundle.digest_mismatch
        - deployment_bundle.export_failed
        - deployment_bundle.internal_error
        - deployment_bundle.invalid_json
        - deployment_bundle.not_ready
        - deployment_bundle.reference_ambiguous
        - deployment_bundle.reference_forbidden
        - deployment_bundle.reference_incompatible
        - deployment_bundle.reference_missing
        - deployment_bundle.registry_push_credential_required
        - deployment_bundle.repository_binding_missing
        - deployment_bundle.runtime_path_conflict
        - deployment_bundle.secret_encrypt_failed
        - deployment_bundle.secret_required
        - deployment_bundle.secret_requirement_invalid
        - deployment_bundle.stage_conflict
        - deployment_bundle.too_large
        - deployment_bundle.unsupported_kind
        - deployment_bundle.unsupported_version
        - volume.binding_conflict
        - volume.claim_conflict
        - volume.claim_not_found
        - volume.claim_spec_conflict
        - volume.cluster_unavailable
        - volume.idempotency_conflict
        - volume.in_use
        - volume.incompatible_cluster
        - volume.invalid_input
        - volume.name_conflict
        - volume.not_found
        - volume.ownership_conflict
        - volume.quota_exceeded
        - volume.quota_unavailable
        - volume.revision_conflict
        - volume.state_conflict
    BuildTemplateParameter:
      type: object
      properties:
        key: { type: string }
        type: { type: string, enum: [select, command, path, identifier, port] }
        required: { type: boolean }
        defaultValue: { type: string }
        options:
          type: array
          items: { type: string }
      required: [key, type, required, defaultValue]
    BuildEnvironmentConfigInput:
      type: object
      properties:
        variables:
          type: object
          additionalProperties: { type: string }
        secrets:
          type: object
          additionalProperties: { type: string }
          writeOnly: true
          description: Existing keys may use an empty value to retain their encrypted value. Omitted keys are removed.
      required: [variables, secrets]
    BuildEnvironmentConfig:
      type: object
      properties:
        scope: { type: string, enum: [global, application, deployment] }
        scopeRef: { type: string }
        variables:
          type: object
          additionalProperties: { type: string }
        secrets:
          type: object
          additionalProperties: { type: boolean }
          description: Secret presence by key. Plaintext and storage references are never returned.
      required: [scope, scopeRef, variables, secrets]
    BuildTemplate:
      type: object
      properties:
        id: { type: string }
        version: { type: string }
        runtime: { type: string }
        category: { type: string, enum: [service, static] }
        defaultServicePort: { type: integer }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/BuildTemplateParameter" }
      required: [id, version, runtime, category, defaultServicePort, parameters]
    BuildTemplatePreviewInput:
      type: object
      properties:
        version: { type: string }
        values:
          type: object
          additionalProperties: { type: string }
      required: [values]
    BuildTemplatePreview:
      type: object
      properties:
        templateId: { type: string }
        version: { type: string }
        values:
          type: object
          additionalProperties: { type: string }
        dockerfile: { type: string }
        checksum: { type: string }
      required: [templateId, version, values, dockerfile, checksum]
    PaginatedProjectList:
      type: object
      required: [items, page, pageSize, sortBy, sortOrder, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        page: { type: integer }
        pageSize: { type: integer }
        sortBy: { type: string }
        sortOrder: { type: string, enum: [asc, desc] }
        total: { type: integer }
        totalPages: { type: integer }
    ProjectPin:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        identifier: { type: string }
        description: { type: string }
        namespaceStrategy: { type: string, enum: [project] }
        createdAt: { type: string, format: date-time }
        pinnedAt: { type: string, format: date-time }
    ProjectMemberInput:
      type: object
      properties:
        email: { type: string }
        role:
          $ref: "#/components/schemas/ProjectRole"
      required: [email, role]
    RegistryCredentialInput:
      type: object
      properties:
        name: { type: string }
        username: { type: string }
        password: { type: string }
        token: { type: string }
        usage: { type: string, enum: [pull, push, push-pull] }
        scope: { type: string, enum: [user, project, global] }
        projectIds:
          type: array
          items: { type: string }
        repositoryTemplate: { type: string }
        tagTemplate: { type: string }
    RegistryCredential:
      type: object
      properties:
        id: { type: string }
        registryId: { type: string }
        name: { type: string }
        username: { type: string }
        usage: { type: string, enum: [pull, push, push-pull] }
        scope: { type: string, enum: [user, project, global] }
        ownerRef: { type: string }
        projectIds:
          type: array
          items: { type: string }
        repositoryTemplate: { type: string }
        tagTemplate: { type: string }
        passwordSet: { type: boolean }
        tokenSet: { type: boolean }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - registryId
        - name
        - username
        - usage
        - scope
        - ownerRef
        - projectIds
        - repositoryTemplate
        - tagTemplate
        - passwordSet
        - tokenSet
        - createdAt
    RepositoryBindingInput:
      type: object
      properties:
        applicationId: { type: string }
        gitAccountId: { type: string }
        owner: { type: string }
        repo: { type: string }
        cloneUrl: { type: string }
        defaultBranch: { type: string }
        webhookEnabled:
          type: boolean
          description: Desired webhook configuration. Current webhook availability is observed from the Git provider.
      required: [applicationId, gitAccountId, owner, repo]
    UpdateConfigsInput:
      type: object
      properties:
        values:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: object
              - type: array
      required: [values]
    DataRetentionDataset:
      type: object
      properties:
        key:
          type: string
          enum: [platform_events, notification_deliveries, worker_task_events, build_logs, release_logs, hook_run_logs, expired_auth_data]
        configKey: { type: string }
        defaultDays: { type: integer, minimum: 0, maximum: 3650 }
      required: [key, configKey, defaultDays]
    DataRetentionCatalogResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DataRetentionDataset" }
      required: [items]
    DataRetentionRequest:
      type: object
      properties:
        datasets:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [platform_events, notification_deliveries, worker_task_events, build_logs, release_logs, hook_run_logs, expired_auth_data]
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
      required: [datasets, startAt, endAt]
    DataRetentionResult:
      type: object
      properties:
        dataset: { type: string }
        matched: { type: integer, format: int64, minimum: 0 }
        deleted: { type: integer, format: int64, minimum: 0 }
      required: [dataset, matched, deleted]
    DataRetentionResultResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DataRetentionResult" }
      required: [items]
    PlatformRole:
      type: string
      enum: [platform_admin, user]
    ProjectRole:
      type: string
      enum: [owner, admin, developer, viewer]
    CurrentUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        avatarUrl: { type: string }
        passwordSet: { type: boolean }
        role:
          $ref: "#/components/schemas/PlatformRole"
        language: { type: string, enum: [zh-CN, en-US] }
        brandColorPreset:
          type: string
          description: Empty follows the platform color theme; otherwise contains a curated multi-color theme or official Radix single-color preset ID.
          enum: ['', gold, bronze, brown, yellow, amber, orange, tomato, red, ruby, crimson, pink, plum, purple, violet, iris, indigo, blue, cyan, teal, jade, green, grass, lime, mint, sky]
        interfaceStyle:
          type: string
          description: Empty follows the platform default; minimal uses a neutral canvas and themed uses the brand-tinted canvas.
          enum: ['', minimal, themed]
        permissions:
          type: array
          items: { type: string }
      required: [id, email, name, avatarUrl, passwordSet, role, language, brandColorPreset, interfaceStyle, permissions]
    AuthRegistrationStatus:
      type: object
      properties:
        emailRegistrationEnabled: { type: boolean }
        oidcRegistrationEnabled: { type: boolean }
        externalIdentityPasswordEnabled: { type: boolean }
      required: [emailRegistrationEnabled, oidcRegistrationEnabled, externalIdentityPasswordEnabled]
    AuthRegistrationSettings:
      type: object
      properties:
        allowEmailRegistration: { type: boolean }
        allowOidcRegistration: { type: boolean }
