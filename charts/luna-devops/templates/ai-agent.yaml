{{- if .Values.ai.enabled }}
{{- if not .Values.ai.existingSecret }}
{{- fail "ai.existingSecret is required when ai.enabled=true" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "luna-devops.agentName" . }}
  labels:
    {{- include "luna-devops.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ai.agent.service.port }}
      targetPort: http
  selector:
    {{- include "luna-devops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "luna-devops.agentName" . }}
  labels:
    {{- include "luna-devops.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      {{- include "luna-devops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "luna-devops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
        {{- with .Values.ai.agent.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum.luna.devops/managed-secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.ai.agent.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: "{{ .Values.ai.agent.image.repository }}:{{ include "luna-devops.imageTag" (dict "Chart" .Chart "tag" .Values.ai.agent.image.tag) }}"
          imagePullPolicy: {{ .Values.ai.agent.image.pullPolicy }}
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.containerSecurityContext) (dict "readOnlyRootFilesystem" true)) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.ai.agent.service.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: {{ .Values.ai.agent.service.port | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.app.logFormat | quote }}
            - name: LOG_COLOR
              value: {{ .Values.app.logColor | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.app.logLevel | quote }}
            - name: OTEL_SERVICE_VERSION
              value: {{ include "luna-devops.imageTag" (dict "Chart" .Chart "tag" .Values.ai.agent.image.tag) | quote }}
            - name: AUTH_MODE
              value: bff-hmac
            - name: LUNA_API_BASE_URL
              value: {{ printf "http://%s:%v" (include "luna-devops.apiName" .) .Values.api.service.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "luna-devops.databaseUrlSecretName" . }}
                  key: {{ include "luna-devops.databaseUrlSecretKey" . }}
            - name: AI_DATABASE_MAX_CONNECTIONS
              value: {{ .Values.ai.agent.database.maxConnections | quote }}
            - name: AI_DATABASE_CONNECTION_TIMEOUT_MS
              value: {{ .Values.ai.agent.database.connectionTimeoutMs | quote }}
            - name: AI_DATABASE_STATEMENT_TIMEOUT_MS
              value: {{ .Values.ai.agent.database.statementTimeoutMs | quote }}
            - name: AI_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "luna-devops.aiSecretName" . }}
                  key: {{ .Values.ai.internalSecretKey }}
            - name: AI_OBSERVABILITY_CAPTURE_CONTENT
              value: {{ .Values.ai.agent.observabilityCaptureContent | quote }}
            - name: AI_OBSERVABILITY_CAPTURE_DATABASE_SPANS
              value: {{ .Values.ai.agent.observabilityCaptureDatabaseSpans | quote }}
            {{- if .Values.observability.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.observability.resourceAttributes | quote }}
            {{- if .Values.observability.existingSecret }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observability.existingSecret }}
                  key: {{ .Values.observability.headersKey }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /internal/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /internal/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.ai.agent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.ai.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ai.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ai.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
