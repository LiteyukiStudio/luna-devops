name: Changelog Sync

on:
  workflow_run:
    workflows:
      - Build & Publish Containers
      - CLI Release
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: changelog-sync-main
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize release changelogs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main with release tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch immutable release tags
        run: git fetch --force --tags origin

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Generate all changelog tracks
        run: scripts/generate-changelog.sh

      - name: Commit synchronized changelogs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/docs/zh/changelog docs/docs/en/changelog; then
            echo "Changelogs are already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/docs/zh/changelog docs/docs/en/changelog
          git commit -m "docs 📝: 同步发布更新日志"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              gh workflow run build-publish.yml --ref main
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Failed to synchronize changelogs after 3 attempts." >&2
          exit 1
