        refresh_token: { type: string, writeOnly: true, x-luna-sensitive: true }
        device_code: { type: string, writeOnly: true, x-luna-sensitive: true }
      allOf:
        - if:
            properties:
              grant_type: { const: authorization_code }
          then:
            required: [code, code_verifier, redirect_uri]
        - if:
            properties:
              grant_type: { const: refresh_token }
          then:
            required: [refresh_token]
        - if:
            properties:
              grant_type: { const: "urn:ietf:params:oauth:grant-type:device_code" }
          then:
            required: [device_code]
