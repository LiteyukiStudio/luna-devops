apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "luna-devops.apiName" . }}
  labels:
    {{- include "luna-devops.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "luna-devops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "luna-devops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum.luna.devops/shared-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum.luna.devops/api-config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
        checksum.luna.devops/managed-secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "luna-devops.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ include "luna-devops.imageTag" (dict "Chart" .Chart "tag" .Values.api.image.tag) }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.api.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- include "luna-devops.commonEnv" . | nindent 12 }}
            - name: INITIAL_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "luna-devops.initialAdminSecretName" . }}
                  key: {{ .Values.api.initialAdmin.emailKey }}
                  optional: true
            - name: INITIAL_ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "luna-devops.initialAdminSecretName" . }}
                  key: {{ .Values.api.initialAdmin.nameKey }}
                  optional: true
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "luna-devops.initialAdminSecretName" . }}
                  key: {{ .Values.api.initialAdmin.passwordKey }}
                  optional: true
            - name: INITIAL_ADMIN_LANGUAGE
              valueFrom:
                secretKeyRef:
                  name: {{ include "luna-devops.initialAdminSecretName" . }}
                  key: {{ .Values.api.initialAdmin.languageKey }}
                  optional: true
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            - name: METRICS_ADDR
              value: {{ .Values.metrics.api.addr | quote }}
            - name: METRICS_PATH
              value: {{ .Values.metrics.path | quote }}
            {{- if .Values.ai.enabled }}
            - name: AI_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "luna-devops.aiSecretName" . }}
                  key: {{ .Values.ai.internalSecretKey }}
            {{- end }}
            {{- if .Values.api.browserTrace.existingSecret }}
            - name: OTEL_EXPORTER_OTLP_TRACES_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.browserTrace.existingSecret }}
                  key: {{ .Values.api.browserTrace.headersKey }}
            {{- end }}
            {{- include "luna-devops.extraEnv" (dict "component" "api" "values" .Values.api.extraEnv) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "luna-devops.sharedConfigName" . }}
            - configMapRef:
                name: {{ include "luna-devops.apiConfigName" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
