  /api/v1/projects/{projectId}/releases/{releaseId}/command-sessions:
    post:
      operationId: createReleaseRuntimeCommandSession
      tags: [Releases]
      summary: Create a persistent release runtime command session
      description: Creates an API-owned, non-TTY shell session for bounded Agent diagnostics. The session is bound to the current user session, Agent Run when present, release, deployment target, and container. Idle and absolute TTLs are enforced by the owning API instance.
      x-luna-cli:
        classification: business-command
        risk: high
        mfaPurpose: runtime_exec
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: releaseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseRuntimeCommandSessionInput" }
      responses:
        "201":
          description: Runtime command session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeCommandSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectId}/releases/{releaseId}/command-sessions/{sessionId}/commands:
    post:
      operationId: executeReleaseRuntimeCommandSession
      tags: [Releases]
      summary: Execute a command in a persistent release runtime session
      description: Executes one bounded command serially in the existing shell. Authorization, project role, Web Console policy, Step-up MFA, Agent Run binding, and high-risk Agent approval are revalidated for every command.
      x-luna-cli:
        classification: business-command
        risk: high
        mfaPurpose: runtime_exec
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: releaseId
          in: path
          required: true
          schema: { type: string }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, pattern: "^rtcs_[a-z0-9]{1,8}_[a-f0-9]{36}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseRuntimeCommandSessionExecuteInput" }
      responses:
        "200":
          description: Command completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeCommandSessionCommandResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The session belongs to another API instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: The session expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/projects/{projectId}/releases/{releaseId}/command-sessions/{sessionId}:
    delete:
      operationId: closeReleaseRuntimeCommandSession
      tags: [Releases]
      summary: Close a persistent release runtime command session
      description: Closes the API-owned shell and releases its Kubernetes exec stream. Closing does not execute a workload command.
      x-luna-cli:
        classification: business-command
        risk: medium
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: releaseId
          in: path
          required: true
          schema: { type: string }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, pattern: "^rtcs_[a-z0-9]{1,8}_[a-f0-9]{36}$" }
      responses:
        "204": { description: Runtime command session closed. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The session belongs to another API instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/projects/{projectId}/releases/{releaseId}/terminal:
    get:
      operationId: streamReleaseRuntimeTerminal
      tags:
        - Releases
      summary: Stream Release Runtime Terminal
      description: Opens the release terminal WebSocket. Luna CLI passes the short-lived one-time ticket returned by the authorize endpoint in the `ticket` query parameter; browser callers may omit it and continue using the existing session-cookie flow.
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        exclusionReason: WebSocket terminal transport consumed by the explicit CLI release-terminal protocol adapter.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
        - name: container
          in: query
          required: false
          schema:
            type: string
        - name: ticket
          in: query
          required: false
          schema:
            type: string
          description: Short-lived one-time ticket returned by `authorizeReleaseRuntimeTerminal`. Required for Luna CLI; omitted by the existing browser cookie flow.
      responses:
        "101":
          description: WebSocket protocol switch accepted after the ticket or browser session is authorized.
          content:
            text/plain:
              schema:
                type: string
