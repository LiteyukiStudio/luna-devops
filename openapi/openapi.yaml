        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BillingRateRulesInput:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            type: object
            required: [meter, creditsPerUnit, enabled]
            properties:
              meter: { type: string }
              creditsPerUnit:
                type: string
                pattern: '^[0-9]+(\.[0-9]+)?$'
              enabled: { type: boolean }
    BillingWalletTransactionInput:
      type: object
      required: [amountCredits, type]
      properties:
        amountCredits: { type: number }
        type: { type: string }
        description: { type: string }
        userId: { type: string }
    ExternalBillingTransactionInput:
      allOf:
        - $ref: "#/components/schemas/BillingWalletTransactionInput"
        - type: object
          required: [idempotencyKey]
          properties:
            idempotencyKey: { type: string, minLength: 1 }
    GatewayTrafficUsageInput:
      type: object
      required: [routeId, responseBytes, requestCount, periodStart, periodEnd]
      properties:
        routeId: { type: string }
        responseBytes: { type: integer, format: int64, minimum: 0 }
        requestCount: { type: integer, format: int64, minimum: 0 }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
    BillingSummary:
      type: object
      properties:
        userId: { type: string }
        balanceCredits: { type: number }
        periodSpendCredits: { type: number }
        todaySpendCredits: { type: number }
        unsettledCredits: { type: number }
        buildSpendCredits: { type: number }
        runtimeSpendCredits: { type: number }
        storageSpendCredits: { type: number }
        gatewaySpendCredits: { type: number }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
