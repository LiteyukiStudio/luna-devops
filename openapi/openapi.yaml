    AgentObservabilityConversationPage:
      type: object
      required: [items, page, pageSize, sortBy, sortOrder, total, totalPages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentObservabilityConversation" } }
        page: { type: integer }
        pageSize: { type: integer }
        sortBy: { type: string }
        sortOrder: { type: string, enum: [asc, desc] }
        total: { type: integer, format: int64 }
        totalPages: { type: integer }
    AgentObservabilityTurnPage:
      type: object
      required: [items, page, pageSize, sortBy, sortOrder, total, totalPages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AgentObservabilityTurn" } }
        page: { type: integer }
        pageSize: { type: integer }
        sortBy: { type: string }
        sortOrder: { type: string, enum: [asc, desc] }
        total: { type: integer, format: int64 }
        totalPages: { type: integer }
    AgentObservabilityOverview:
      type: object
      required: [generatedAt, range, summary, sourceStatus, observationCode]
      properties:
        generatedAt: { type: string, format: date-time }
        range: { type: string, enum: [1h, 6h, 24h, 7d, 30d, 1y] }
        summary:
          type: object
          required: [inputTokens, outputTokens, toolCalls, turnCount, turnSuccessRate, runDurationP95]
          properties:
            inputTokens: { type: number, minimum: 0, description: Input tokens consumed during the selected period. }
            outputTokens: { type: number, minimum: 0, description: Output tokens generated during the selected period. }
            toolCalls: { type: number, minimum: 0, description: Tool calls executed during the selected period. }
            turnCount: { type: integer, format: int64, minimum: 0, description: Conversation turns created during the selected period. }
            turnSuccessRate: { type: number, minimum: 0, maximum: 100, description: Completed turns divided by terminal turns during the selected period. }
            runDurationP95: { type: number, minimum: 0, description: P95 Agent Run duration in seconds during the selected period. }
        sourceStatus: { type: object, additionalProperties: { type: string, enum: [ready, unavailable] } }
        observationCode: { type: string }
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        error:
          type: string
          description: Safe user-facing error message.
        detail:
          type: string
          description: Development-only diagnostic detail; omitted in production responses.
        requestId:
          type: string
          description: Request identifier for support and log correlation.
        purpose:
          type: string
          description: Step-up purpose returned with `mfa_required`.
        details:
          type: object
          additionalProperties: true
          description: Development-only machine-readable diagnostic context; omitted in production responses.
      required: [code, error, requestId]
    InboxCategory:
      type: string
