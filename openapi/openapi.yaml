      properties:
        id: { type: string }
        type:
          type: string
          enum: [project.billing_owner_transfer]
        requesterUserId: { type: string }
        recipientUserId: { type: string }
        projectId: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        status:
          $ref: "#/components/schemas/InboxActionRequestStatus"
        rowVersion:
          type: integer
          format: int64
          minimum: 1
        expiresAt:
          type: [string, "null"]
          format: date-time
        respondedAt:
          type: [string, "null"]
