      responses:
        "200":
          description: Matched and deleted counts by dataset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataRetentionResultResponse" }
        "400":
          description: Invalid range or unknown dataset (`retention.invalid_range` or `retention.invalid_dataset`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Platform-administrator role is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Cleanup failed (`retention.cleanup_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runtime/clusters/{clusterId}/pods/terminal/authorize:
    post:
      operationId: authorizeRuntimeClusterPodTerminal
      tags: [Runtime]
      summary: Authorize a runtime-cluster Pod terminal connection
      x-luna-cli:
        requiredScopes: ["cluster:manage"]
        classification: protocol-adapter
        hidden: true
        exclusionReason: Low-level terminal preflight consumed by the explicit CLI runtime-terminal protocol adapter.
      description: Normal HTTP preflight used before opening the Pod terminal WebSocket. Browser callers use their current session cookie and Luna CLI uses its OAuth bearer token; personal access tokens are rejected. The response contains a short-lived random one-time ticket bound to the user, interactive subject, cluster, and Pod. The WebSocket consumes the ticket atomically, repeats authorization checks before upgrading, and continuously revalidates identity, role, Pod identity, and platform ownership.
      security:
        - SessionCookie: []
        - BearerToken: []
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - name: namespace
          in: query
          required: true
          schema: { type: string }
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One-time terminal ticket issued. The WebSocket endpoint must still atomically consume it and repeat authorization checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeTerminalAuthorization" }
        "400":
          description: Pod namespace or name is empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Browser session or Luna CLI OAuth bearer is missing, invalid, expired, or revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The current user is not a platform administrator, or a personal access token was used (`runtime.terminal_session_required`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Runtime cluster was not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The shared production terminal-ticket store is unavailable (`runtime_terminal.ticket_unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

