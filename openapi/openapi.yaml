    get:
      operationId: observeRuntimeClusterPressure
      x-luna-cli:
        requiredScopes: ["cluster:read"]
      tags: [Runtime]
      summary: Observe current runtime cluster pressure
      description: Returns a current Kubernetes observation for the requested visible clusters. Platform administrators receive exact allocation and usage details; other users receive only the derived pressure level.
      x-luna-agent:
        purpose: { zh: 查询一个或多个运行集群当前的资源分配压力，用于部署前判断集群余量。, en: Observe current resource pressure for one or more runtime clusters before deployment. }
        aliases: { zh: [查看集群压力, 查询集群负载等级, 比较集群余量], en: [observe cluster pressure, check cluster load level, compare cluster headroom] }
        avoidWhen: { zh: 查询历史资源用量或计费记录时不要使用此工具。, en: Do not use this tool for historical usage or billing records. }
        preconditions: { zh: [先用 listRuntimeClusters 获取当前用户可见的真实 clusterId], en: [Resolve visible clusterId values with listRuntimeClusters first] }
        successEvidence: { zh: 返回实时压力等级；平台管理员还会得到 CPU、内存的 requests、allocatable 与可用实际用量。, en: "Returns a live pressure level and, for platform administrators, exact CPU and memory requests, allocatable capacity, and available usage." }
      parameters:
        - name: clusterId
          in: query
          required: true
          description: One to 100 visible runtime cluster identifiers. Repeat the query parameter for multiple clusters.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, pattern: '^clu_' }
        - name: projectId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Current pressure observations in requested cluster order; invisible identifiers are omitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeClusterPressureList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

