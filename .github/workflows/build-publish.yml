name: Build & Publish Containers

on:
  push:
    branches: [main, dev]
    tags: [v*]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CONTAINER_PLATFORMS: linux/amd64
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: liteyukistudio

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.changes.outputs.go }}
      web: ${{ steps.changes.outputs.web }}
      agent: ${{ steps.changes.outputs.agent }}
      docs: ${{ steps.changes.outputs.docs }}
      helm: ${{ steps.changes.outputs.helm }}
      dependencies: ${{ steps.changes.outputs.dependencies }}
      container: ${{ steps.changes.outputs.container }}
      container_images: ${{ steps.changes.outputs.container_images }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect affected checks and images
        id: changes
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/detect-changes.sh

      - name: Test change detection
        run: bash scripts/ci/test-detect-changes.sh

  go-quality:
    name: Go quality
    needs: changes
    if: >-
      needs.changes.outputs.go == 'true' &&
      !startsWith(github.ref, 'refs/tags/') &&
      github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Run Go tests and static checks
        run: bash scripts/ci/check-go.sh

  web-quality:
    name: Web quality
    needs: changes
    if: >-
      needs.changes.outputs.web == 'true' &&
      !startsWith(github.ref, 'refs/tags/') &&
      github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'pnpm' || '' }}
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked Web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Run Web checks
        run: bash scripts/ci/check-web.sh

  agent-quality:
    name: Agent quality
    needs: changes
    if: >-
      needs.changes.outputs.agent == 'true' &&
      !startsWith(github.ref, 'refs/tags/') &&
      github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'pnpm' || '' }}
          cache-dependency-path: luna-agent/pnpm-lock.yaml
      - name: Install locked Agent dependencies
        run: pnpm --dir luna-agent install --frozen-lockfile
      - name: Run Agent checks
        run: bash scripts/ci/check-agent.sh

  docs-quality:
    name: Docs quality
    needs: changes
    if: >-
      needs.changes.outputs.docs == 'true' &&
      !startsWith(github.ref, 'refs/tags/') &&
      github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'pnpm' || '' }}
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install locked Docs dependencies
        run: pnpm --dir docs install --frozen-lockfile
      - name: Build documentation
        run: bash scripts/ci/check-docs.sh

  helm-quality:
    name: Helm quality
    needs: changes
    if: >-
      needs.changes.outputs.helm == 'true' &&
      !startsWith(github.ref, 'refs/tags/') &&
      github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Lint, render, and test Helm chart
        run: bash scripts/ci/check-helm.sh

  dependency-quality:
    name: Dependency vulnerability checks
    needs: changes
    if: >-
      needs.changes.outputs.dependencies == 'true' &&
      !startsWith(github.ref, 'refs/tags/') &&
      github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Audit dependency vulnerabilities
        run: bash scripts/ci/check-dependencies.sh

  full-quality:
    name: Full release quality
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/full-quality.yml
    with:
      release_mode: true
    permissions:
      contents: read

  container:
    name: container-build / ${{ matrix.title }}
    needs:
      - changes
      - go-quality
      - web-quality
      - agent-quality
      - docs-quality
      - helm-quality
      - dependency-quality
      - full-quality
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.container == 'true' &&
      (needs.go-quality.result == 'success' || needs.go-quality.result == 'skipped') &&
      (needs.web-quality.result == 'success' || needs.web-quality.result == 'skipped') &&
      (needs.agent-quality.result == 'success' || needs.agent-quality.result == 'skipped') &&
      (needs.docs-quality.result == 'success' || needs.docs-quality.result == 'skipped') &&
      (needs.helm-quality.result == 'success' || needs.helm-quality.result == 'skipped') &&
      (needs.dependency-quality.result == 'success' || needs.dependency-quality.result == 'skipped') &&
      (((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') &&
      needs.full-quality.result == 'success') ||
      (!startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' &&
      needs.full-quality.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image_key: ${{ fromJSON(needs.changes.outputs.container_images) }}
        include:
          - image_key: api
            title: API
            image: luna-devops
            file: Dockerfile
            target: runtime-embed-web
            build_args: TARGET=api
          - image_key: worker
            title: Worker
            image: luna-worker
            file: Dockerfile
            target: runtime-worker
            build_args: TARGET=worker
          - image_key: agent
            title: Agent
            image: luna-agent
            file: luna-agent/Dockerfile
            target: runtime
            build_args: ""
          - image_key: gateway-traffic-probe
            title: Gateway Traffic Probe
            image: devops-gateway-traffic-probe
            file: Dockerfile
            target: runtime-probe
            build_args: TARGET=gateway-traffic-probe
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          image_prefix="${DOCKERHUB_NAMESPACE}"
          image_name="${{ matrix.image }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version_tag="${GITHUB_REF#refs/tags/}"
            image_tags="${image_prefix}/${image_name}:${version_tag}"
            if [[ "${version_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              image_tags="${image_tags}"$'\n'"${image_prefix}/${image_name}:latest"
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            short_sha="${GITHUB_SHA::12}"
            image_tags="${image_prefix}/${image_name}:pr-${short_sha}"
          else
            image_tags="${image_prefix}/${image_name}:nightly"
          fi
          {
            echo "image_tags<<EOF"
            echo "${image_tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and optionally push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ env.CONTAINER_PLATFORMS }}
          build-args: |
            ${{ matrix.build_args }}
            APP_VERSION=${{ github.sha }}
            VITE_APP_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.meta.outputs.image_tags }}

  quality:
    name: Release Quality Gate
    needs:
      - changes
      - go-quality
      - web-quality
      - agent-quality
      - docs-quality
      - helm-quality
      - dependency-quality
      - full-quality
      - container
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every executed check to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          GO_RESULT: ${{ needs.go-quality.result }}
          WEB_RESULT: ${{ needs.web-quality.result }}
          AGENT_RESULT: ${{ needs.agent-quality.result }}
          DOCS_RESULT: ${{ needs.docs-quality.result }}
          HELM_RESULT: ${{ needs.helm-quality.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-quality.result }}
          FULL_RESULT: ${{ needs.full-quality.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          for result in \
            "$CHANGES_RESULT" "$GO_RESULT" "$WEB_RESULT" "$AGENT_RESULT" \
            "$DOCS_RESULT" "$HELM_RESULT" "$DEPENDENCY_RESULT" "$FULL_RESULT" "$CONTAINER_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "required CI job finished with result: $result" >&2; exit 1 ;;
            esac
          done

  release:
    name: Publish Luna DevOps GitHub Release
    needs:
      - quality
      - container
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.quality.result == 'success' &&
      needs.container.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Generate LiteyukiAutoBot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.LITEYUKI_AUTO_BOT_APP_ID }}
          private-key: ${{ secrets.LITEYUKI_AUTO_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "Luna DevOps ${TAG#v}" \
            --generate-notes
