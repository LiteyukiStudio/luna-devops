    InboxPriority:
      type: string
      enum: [low, normal, high, critical]
    InboxActionRequestStatus:
      type: string
      enum: [pending, processing, completed, rejected, cancelled, expired, failed]
    InboxDecision:
      type: string
      enum: [accept, reject]
    InboxDecisionInput:
