  /api/v1/projects/{projectId}/volume-transfers/{transferId}/content:
    head:
      operationId: headVolumeTransferContent
      tags: [Volumes]
      summary: Inspect an authorized export archive and Range capability
      description: Exchange an optional single-use ticket for a transfer-bound HttpOnly download session, or reuse the existing download session cookie. A supplied ticket takes precedence and rotates any old cookie.
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        transport: download
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TransferId"
        - $ref: "#/components/parameters/DownloadTicket"
        - $ref: "#/components/parameters/DownloadSessionCookie"
      responses:
        "200":
          description: Archive metadata.
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Length: { schema: { type: integer, format: int64, minimum: 0 } }
            ETag: { schema: { type: string } }
            Set-Cookie:
              description: Present when a ticket is exchanged. Sets a transfer-path-bound `luna_volume_download_session` HttpOnly, SameSite=Strict cookie for at most 30 minutes; production responses also set Secure.
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "401":
          description: Download credential is missing, malformed, or bound to another project or transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: volume_transfer.download_unauthorized, error: Download authorization is invalid, requestId: req_example }
        "410": { description: Ticket, download session, or export archive expired, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    get:
      operationId: downloadVolumeTransferContent
      tags: [Volumes]
      summary: Download an authorized export archive with HTTP Range support
      description: Use a single-use ticket on the first request to establish a transfer-bound HttpOnly download session. Subsequent Range requests omit the ticket and reuse the cookie; a new valid ticket rotates an existing session.
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        transport: download
        streaming: true
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TransferId"
        - $ref: "#/components/parameters/DownloadTicket"
        - $ref: "#/components/parameters/DownloadSessionCookie"
        - name: Range
          in: header
          schema: { type: string, pattern: '^bytes=[0-9]+-[0-9]*$' }
      responses:
        "200":
          description: Complete archive.
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            ETag: { schema: { type: string } }
            Set-Cookie:
              description: Present when a ticket is exchanged. Sets a transfer-path-bound `luna_volume_download_session` HttpOnly, SameSite=Strict cookie for at most 30 minutes; production responses also set Secure.
              schema: { type: string }
          content:
            application/gzip: { schema: { type: string, format: binary } }
            application/zstd: { schema: { type: string, format: binary } }
        "206":
          description: Requested archive byte range.
          headers:
            Content-Range: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
            ETag: { schema: { type: string } }
            Set-Cookie:
              description: Present when a ticket is exchanged. Sets a transfer-path-bound `luna_volume_download_session` HttpOnly, SameSite=Strict cookie for at most 30 minutes; production responses also set Secure.
              schema: { type: string }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "401":
          description: Download credential is missing, malformed, or bound to another project or transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: volume_transfer.download_unauthorized, error: Download authorization is invalid, requestId: req_example }
        "410": { description: Ticket, download session, or export archive expired, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/projects/{projectId}/volume-transfers/{transferId}/manifest:
    head:
      operationId: headVolumeTransferManifest
      tags: [Volumes]
      summary: Inspect an authorized Block raw.zst export manifest
      description: Available only for a succeeded `raw_zst` export of a Block volume. A supplied single-use ticket takes precedence over the transfer-bound `luna_volume_download_session` cookie and rotates the cookie. The session cookie Path is `/api/v1/projects/{projectId}/volume-transfers/{transferId}/`, so the same session authorizes both content and manifest reads. Authorization requires `volume:export`.
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        transport: download
        requiredScopes: [volume:export]
        exclusionReason: Manifest authentication and attachment download are consumed by Web or Luna CLI protocol adapters.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TransferId"
        - $ref: "#/components/parameters/DownloadTicket"
        - $ref: "#/components/parameters/DownloadSessionCookie"
      responses:
        "200":
          description: Manifest attachment metadata.
          headers:
            Content-Length: { schema: { type: integer, format: int64, minimum: 0 } }
            ETag: { schema: { type: string } }
            Content-Type: { schema: { type: string, const: "application/json; charset=utf-8" } }
            Content-Disposition: { schema: { type: string } }
            Set-Cookie:
              description: Present when a ticket is exchanged. The HttpOnly, SameSite=Strict cookie is scoped to the transfer path for at most 30 minutes; production responses also set Secure.
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { description: Ticket, download session, or export manifest expired, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "422": { description: The completed raw.zst export does not contain a valid manifest digest or metadata, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    get:
      operationId: downloadVolumeTransferManifest
      tags: [Volumes]
      summary: Download an authorized Block raw.zst export manifest
      description: Returns the dynamic JSON manifest only for a succeeded `raw_zst` export of a Block volume. A supplied single-use ticket takes precedence over the transfer-bound cookie. Authorization requires `volume:export`.
      x-luna-cli:
        classification: protocol-adapter
        hidden: true
        agentAllowed: false
        transport: download
        requiredScopes: [volume:export]
        exclusionReason: Manifest authentication and attachment download are consumed by Web or Luna CLI protocol adapters.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TransferId"
        - $ref: "#/components/parameters/DownloadTicket"
        - $ref: "#/components/parameters/DownloadSessionCookie"
      responses:
        "200":
          description: JSON manifest attachment.
          headers:
            Content-Length: { schema: { type: integer, format: int64, minimum: 0 } }
            ETag: { schema: { type: string } }
            Content-Type: { schema: { type: string, const: "application/json; charset=utf-8" } }
            Content-Disposition: { schema: { type: string } }
            Set-Cookie:
              description: Present when a ticket is exchanged. The HttpOnly, SameSite=Strict cookie is scoped to the transfer path for at most 30 minutes; production responses also set Secure.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeTransferManifest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { description: Ticket, download session, or export manifest expired, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "422": { description: The completed raw.zst export does not contain a valid manifest digest or metadata, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

