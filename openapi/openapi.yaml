            schema: { $ref: "#/components/schemas/DeploymentTargetBundlePreviewRequest" }
      responses:
        "200":
          description: Destination-specific validation and reference resolution result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentTargetBundlePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: Bundle exceeds 1 MiB, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: Internal failure with a stable deployment bundle error code and no dependency diagnostics., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

