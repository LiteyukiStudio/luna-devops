  /api/v1/data-retention/preview:
    post:
      operationId: previewDataRetention
      tags: [DataRetention]
      summary: Preview data matching a retention range
      description: Counts rows without changing data. The selected range is left-closed and right-open (`startAt <= timestamp < endAt`). Active runtime records and protected datasets are never matched.
      x-luna-cli:
        command: retention.preview
        classification: business-command
        risk: low
        requiredScopes: ["retention:read"]
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataRetentionRequest" }
      responses:
        "200":
          description: Matching counts by dataset. `deleted` is zero for a preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataRetentionResultResponse" }
        "400":
          description: Invalid range or unknown dataset (`retention.invalid_range` or `retention.invalid_dataset`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Platform-administrator role is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/data-retention/cleanup:
    post:
      operationId: cleanupDataRetention
      tags: [DataRetention]
      summary: Permanently remove data matching a retention range
      description: Runs the same fixed whitelist and protection rules as preview, then writes only the aggregate result to the audit log. The operation does not accept table names or SQL expressions.
      x-luna-cli:
        command: retention.cleanup
        classification: business-command
        risk: critical
        requiredScopes: ["retention:manage"]
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
